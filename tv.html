<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IFASCON 2026 - Door Display Kiosk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f8fafc; overflow: hidden; -webkit-tap-highlight-color: transparent; }
        .loader { border: 4px solid #1e293b; border-top: 4px solid #6366f1; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .animate-live { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        .custom-scroll::-webkit-scrollbar { display: none; }
        .custom-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex flex-col h-screen w-screen overflow-hidden select-none bg-slate-950 relative">

    <!-- SPLASH SCREEN / FLYER OVERLAY FOR TV -->
    <div id="tvSplashOverlay" class="hidden absolute inset-0 bg-slate-950 z-[400] flex flex-col items-center justify-between p-6 sm:p-8 text-center transition-opacity duration-300 overflow-hidden">
        <div id="tvSplashContent" class="w-full h-full flex flex-col items-center justify-between"></div>
    </div>

    <!-- FULLSCREEN LEADERBOARD OVERLAY MODAL -->
    <div id="tvLeaderboardModal" class="hidden fixed inset-0 bg-slate-950/98 backdrop-blur-lg z-[150] flex flex-col items-center justify-center p-8">
        <h2 id="tvLbTitle" class="text-4xl sm:text-6xl font-black text-amber-500 mb-2 drop-shadow-xl text-center"><i class="fas fa-trophy mr-4"></i>Live Hall Standings</h2>
        <p id="tvLbSub" class="text-slate-400 font-bold text-sm sm:text-lg tracking-widest uppercase mb-8 text-center">Calculating Database Weights...</p>
        <div id="tvLeaderboardList" class="w-full max-w-4xl flex flex-col gap-3.5 max-h-[70vh] overflow-y-auto pr-2 custom-scroll"></div>
    </div>

    <!-- SETUP WIZARD -->
    <div id="setupWizard" class="hidden fixed inset-0 bg-slate-950/95 backdrop-blur-md z-[300] flex flex-col items-center justify-center p-6 text-slate-100">
        <div class="bg-slate-900 border border-slate-700 p-8 rounded-3xl max-w-2xl w-full shadow-2xl max-h-[90vh] overflow-y-auto custom-scroll">
            <div class="flex items-center gap-3 mb-6 border-b border-slate-800 pb-4">
                <i class="fas fa-tv text-3xl text-indigo-400"></i>
                <div>
                    <h2 class="text-2xl font-black">Door TV Configuration</h2>
                    <p class="text-xs text-slate-400">Configure this display kiosk for your hall</p>
                </div>
            </div>
            
            <div class="space-y-4 bg-slate-950/60 p-5 rounded-2xl border border-slate-800">
                <div>
                    <label class="block font-bold text-slate-300 mb-2 text-sm">Feed / Timeline Hall</label>
                    <select id="wizHall" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white font-bold outline-none text-base"></select>
                </div>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block font-bold text-slate-300 mb-2 text-sm">Physical Door Name</label>
                        <select id="wizName" onchange="toggleCustomNameInput()" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-3 text-white font-bold outline-none text-sm">
                            <option value="Hall A">Hall A</option>
                            <option value="Hall B">Hall B</option>
                            <option value="Jasper Hall">Jasper Hall</option>
                            <option value="default">Default Schedule Name</option>
                            <option value="custom">✏️ Custom Name...</option>
                        </select>
                        <input type="text" id="wizCustomName" placeholder="Enter custom hall name" class="hidden mt-2 w-full bg-slate-900 border border-indigo-500 rounded-xl px-3 py-2 text-white font-bold outline-none text-sm">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-300 mb-2 text-sm">Door Arrow Direction</label>
                        <select id="wizArrow" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-3 text-white font-bold outline-none text-sm">
                            <option value="none">No Arrow (Stage Display)</option>
                            <option value="left">⬅ Point Left (Doorway)</option>
                            <option value="right">➔ Point Right (Doorway)</option>
                            <option value="up">⬆ Straight In</option>
                        </select>
                    </div>
                </div>
            </div>

            <button onclick="launchFromWizard()" class="w-full mt-6 bg-indigo-600 hover:bg-indigo-500 text-white font-black py-4 rounded-xl shadow-lg transition active:scale-95 text-lg">Launch TV Kiosk</button>
        </div>
    </div>

    <!-- MAIN KIOSK VIEWPORT (Single Screen Only) -->
    <main id="kioskViewport" class="flex-1 flex flex-col w-full h-full relative overflow-hidden bg-slate-950 p-6 sm:p-10"></main>

    <!-- AUDIO TOGGLE FLOATING BADGE -->
    <div class="fixed bottom-4 right-4 z-[200]">
        <button id="globalAudioToggle" onclick="toggleGlobalAudio()" class="bg-slate-900/80 hover:bg-slate-800 text-slate-400 hover:text-white border border-slate-700/80 px-4 py-2.5 rounded-2xl text-sm font-bold transition flex items-center gap-2 shadow-2xl backdrop-blur">
            <i id="audioIcon" class="fas fa-volume-mute text-rose-400"></i>
            <span id="audioText">Muted</span>
        </button>
    </div>

    <script>
        const supabaseUrl = 'https://iiqxxxamsprzhzggsrer.supabase.co';
        const supabaseKey = 'sb_publishable_eYTrqO8dPDZj0mjbv3Csqg_dMrY2h3k';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        const DELEGATE_APP_URL = "https://ifascon-2026.vercel.app/delegate_live.html";
        
        const sheetLinks = {
            'quizzes': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTSXW-U_qQZinazbfDmwxFT4VdZ_3OzNaBH29daT9Vm0pzwHu9kVZUTNK5stzUkfvp6gTKbIoM6KH1k/pub?gid=0&single=true&output=csv',
            '23a': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTRQ3g-iv-ZNPmsFq_zInPnhzbraxuMfJNEHsUro3i7C_eNIHWmAc261FSqBcmuNFmDlLVl0-8jKNJ_/pub?gid=1579973346&single=true&output=csv',
            '23b': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTRQ3g-iv-ZNPmsFq_zInPnhzbraxuMfJNEHsUro3i7C_eNIHWmAc261FSqBcmuNFmDlLVl0-8jKNJ_/pub?gid=239334255&single=true&output=csv'
        };

        const configTitles = {
            '23a': "23rd August 2026 - Hall A", 
            '23b': "23rd August 2026 - Hall B"
        };

        let appData = {};
        let globalQuizzes = [];
        let isMuted = true;
        const CACHE_KEY = 'ifascon_tv_schedule_cache_v910';

        let liveHall = null;
        let hallArrow = 'none';
        let hallCustomName = null;
        
        let tvState = { remoteIndex: null, quizStart: null, localStart: null, lastHash: "", expiredRendered: false };
        let tickerTimer = null;

        function cleanText(val) { return val ? String(val).replace(/\u00A0/g, ' ').replace(/\s+/g, ' ').trim() : ""; }
        
        function normalizeHallId(val) {
            if (!val) return "23a";
            let str = cleanText(val).toLowerCase().replace(/[^a-z0-9]/g, '');
            if (str.includes('23b') || (str.includes('23') && str.includes('b'))) return '23b';
            return '23a';
        }

        function resolveDirectImageUrl(url) {
            if (!url) return "";
            url = url.trim();
            if (url.includes('drive.google.com') || url.includes('docs.google.com')) {
                let fIdMatch = url.match(/[-\w]{25,}/);
                if (fIdMatch && fIdMatch[0]) return `https://drive.google.com/thumbnail?id=${fIdMatch[0]}&sz=w1200`;
            }
            return encodeURI(url);
        }

        function convertTo12HourFormat(timeStr) {
            if (!timeStr) return "";
            if (/[aApP][mM]/.test(timeStr)) { return timeStr; }
            return timeStr.replace(/\b([01]?[0-9]|2[0-3])[:.]([0-5][0-9])(?:[:.][0-9]{2})?\b/g, function(match, p1, p2) {
                let h = parseInt(p1, 10);
                let ampm = h >= 12 ? 'PM' : 'AM';
                h = h % 12; h = h ? h : 12; 
                let paddedH = h < 10 ? '0' + h : h;
                return paddedH + ':' + p2 + ' ' + ampm;
            });
        }

        function parseTimeToMinutes(timeStr) {
            if (!timeStr) return null;
            let cleanStr = cleanText(timeStr).toLowerCase().replace(/\s+to\s+/g, '-').replace(/[—–]/g, '-');
            let clean = cleanStr.split('-')[0].trim();
            let isPM = clean.includes('pm'), isAM = clean.includes('am');
            let timeMatch = clean.match(/(\d{1,2})[:.](\d{2})/);
            if (!timeMatch) return null;
            let hours = parseInt(timeMatch[1], 10), minutes = parseInt(timeMatch[2], 10);
            if (isPM && hours < 12) hours += 12;
            if (isAM && hours === 12) hours = 0;
            if (!isPM && !isAM && hours >= 1 && hours <= 7) hours += 12;
            return hours * 60 + minutes;
        }

        function checkIfCorrect(optionText, correctAnswer, index) {
            let optClean = cleanText(optionText).toLowerCase();
            let corClean = cleanText(correctAnswer).toLowerCase();
            let letter = String.fromCharCode(65 + index).toLowerCase(); 
            return optClean === corClean || corClean === letter || corClean === `option ${letter}` || corClean === `option-${letter}` || corClean === `${letter}.` || corClean === `${letter})`;
        }

        function parseRawData(rows, hallTitle) {
            let events = [], current_session = "";

            rows.forEach(r => {
                while(r.length < 12) r.push("");
                r = r.map(x => cleanText(x));
                let col0 = r[0], col1 = r[1], col2 = r[2], col3 = r[3];
                let colTitle = r[4] || r[5] || "", colSpeaker = r[4] ? r[5] : r[6];
                let colChair1 = r[4] ? r[6] : r[7], colChair2 = r[4] ? r[7] : r[8], colChair3 = r[4] ? r[8] : r[9];
                let row_text = r.join(" ").toLowerCase();

                if (row_text.includes("position:absolute") || row_text.includes("docs-drivelogo") || row_text.includes("<!doctype html>")) return; 
                if (col0.toLowerCase().includes("duration") && col1.toLowerCase().includes("from")) return;

                if (!col0 && !col1 && !col2 && !col3 && !colTitle) return;

                let isCeremonyOrMeeting = /\b(inauguration|inaugural|valedictory|gbm|general body|ec meeting|executive committee|banquet|gala dinner)\b/i.test(row_text);

                if (isCeremonyOrMeeting) {
                    let text = colTitle || col3 || col0 || "Official Session";
                    if (/\binaugur/i.test(row_text)) text = colTitle || col3 || "Inauguration Ceremony";
                    else if (/\bvaledict/i.test(row_text)) text = colTitle || col3 || "Valedictory Function";
                    else if (/\bgbm\b/i.test(row_text)) text = "Annual General Body Meeting (GBM)";
                    
                    let time_raw = (col1 && col2) ? `${col1} - ${col2}` : (col1 || col0);
                    let display_time = convertTo12HourFormat(time_raw);
                    let dignitaries = [colSpeaker, colChair1, colChair2, colChair3].filter(c => c && !["nan", "speaker", "chairperson", "tbd"].includes(c.toLowerCase())).join(", ");

                    events.push({
                        type: 'break', isCeremony: true, title: text, time: time_raw, display_time: display_time,
                        speaker: dignitaries, hall: hallTitle, parent_session: text, adLink: r.find(c => c.toLowerCase().includes('http')) || ""
                    });
                    return;
                }

                const breakRegex = /\b(break|lunch|registration|tea|coffee|sponsor|commercial|ad|video)\b/;
                if (breakRegex.test(row_text) && !row_text.includes("symposium") && !row_text.includes("session")) {
                    let text = colTitle || col3 || col0, targetText = `${colTitle} ${col3} ${col0}`.toLowerCase();
                    if (/\b(tea|coffee)\b/i.test(targetText)) text = "Tea / Coffee Break";
                    else if (/\b(lunch|lunch break)\b/i.test(targetText) && !targetText.includes("pre-lunch") && !targetText.includes("pre lunch")) text = "Lunch Break";
                    else if (/\bregistration\b/i.test(targetText)) text = "Registration";

                    let time_raw = (col1 && col2) ? `${col1} - ${col2}` : (col1 || col0);
                    events.push({ type: 'break', isCeremony: false, title: text, time: time_raw, display_time: convertTo12HourFormat(time_raw), speaker: '', hall: hallTitle, parent_session: '', adLink: r.find(c => c.toLowerCase().includes('http')) || "" });
                    return;
                }

                let isQA = col3.toLowerCase().includes("q&a") || colTitle.toLowerCase().includes("discussion");
                let isPlenary = col3.toLowerCase().includes("plenary") || colTitle.toLowerCase().includes("plenary");
                let isSession = false, isOration = false;

                if (row_text.includes('oration')) { isSession = true; isOration = true; } 
                else if (!isQA && !isPlenary) {
                    if (!col1 && !col2 && !col0) isSession = true; 
                    else if (!col0 && col1 && col2 && !colTitle) isSession = true; 
                    else if (col3 && !colTitle && !colSpeaker) isSession = true; 
                    else if (row_text.includes('symposium') || row_text.includes('session')) isSession = true;
                }

                let isHandsOn = col3.toLowerCase().includes('hands-on') || col3.toLowerCase().includes('demonstration') || colTitle.toLowerCase().includes('hands-on') || colTitle.toLowerCase().includes('demonstration');
                if (isHandsOn) isSession = false;

                if (isSession) {
                    let topic = colTitle || col3 || (isOration ? "Oration" : "Session");
                    if (colTitle && col3 && colTitle.toLowerCase() !== col3.toLowerCase()) {
                        if (colTitle.toLowerCase().includes(col3.toLowerCase())) topic = colTitle;
                        else if (col3.toLowerCase().includes(colTitle.toLowerCase())) topic = col3;
                        else topic = col3 + ": " + colTitle;
                    }
                    current_session = topic; 
                    let time_raw = (col1 && col2) ? `${col1} - ${col2}` : (col1 || col0);
                    events.push({ type: 'session', isOration: isOration, time: time_raw, display_time: convertTo12HourFormat(time_raw), title: topic, speaker: isOration ? (colSpeaker || "") : [isOration ? "" : colSpeaker, colChair1, colChair2, colChair3].filter(c => c && !["nan", "speaker", "chairperson"].includes(c.toLowerCase())).join(", "), hall: hallTitle, parent_session: current_session });
                    return;
                }

                if (col1 || colTitle || isQA || isPlenary || col3) {
                    let time_raw = (col1 && col2) ? `${col1} - ${col2}` : (col1 || col0);
                    if (col0 && !col0.toLowerCase().includes('duration')) time_raw = time_raw ? `${time_raw} (${col0.trim()})` : col0.trim();
                    events.push({ type: 'presentation', isHandsOn: isHandsOn, time: time_raw, display_time: convertTo12HourFormat(time_raw), tag: (isQA && !colTitle) ? "Discussion" : col3, title: (isQA && !colTitle) ? col3 : (colTitle || col3), speaker: ["nan", "tbd"].includes(colSpeaker.toLowerCase()) ? "" : colSpeaker, hall: hallTitle, parent_session: current_session });
                }
            });

            return events;
        }

        function toggleGlobalAudio() {
            isMuted = !isMuted;
            document.querySelectorAll('iframe, video').forEach(media => {
                if (media.tagName === 'VIDEO') { media.muted = isMuted; }
            });
            document.getElementById('audioIcon').className = isMuted ? "fas fa-volume-mute text-rose-400" : "fas fa-volume-up text-emerald-400";
            document.getElementById('audioText').innerText = isMuted ? "Muted" : "Live Audio";
        }

        async function fetchSchedule() {
            let fetchedData = {};
            let quizzesLoaded = [];
            
            const fetchPromises = Object.entries(sheetLinks).map(async ([key, link]) => {
                if (!link || link.trim() === '') return;
                try {
                    const response = await fetch(link + '&_cb=' + Date.now());
                    if (!response.ok) return;
                    const csvText = await response.text();
                    let parsedCsv = Papa.parse(csvText, { header: false, skipEmptyLines: true }).data;
                    
                    if (key === 'quizzes') {
                        let colOffset = 0;
                        if (parsedCsv.length > 1) {
                            let firstRow = parsedCsv[1];
                            let cell0 = cleanText(firstRow[0]);
                            if (/^\d{1,4}$/.test(cell0) || cell0.includes('/')) colOffset = 1;
                        }
                        parsedCsv.forEach((r, idx) => {
                            if (idx === 0 || !r || r.length < 3) return;
                            let rawHall = cleanText(r[0 + colOffset]), rawSymp = cleanText(r[1 + colOffset]), rawTitle = cleanText(r[2 + colOffset]);
                            if (!rawTitle || rawTitle.toLowerCase() === 'question' || rawTitle.toLowerCase() === 'title') return;
                            quizzesLoaded.push({ 
                                type: 'quiz', hall_id: normalizeHallId(rawHall), symposium: rawSymp || 'General', title: rawTitle, 
                                options: [cleanText(r[3 + colOffset]), cleanText(r[4 + colOffset]), cleanText(r[5 + colOffset]), cleanText(r[6 + colOffset])].filter(Boolean), 
                                correct: cleanText(r[7 + colOffset]) 
                            });
                        });
                    } else {
                        fetchedData[key] = { title: configTitles[key], events: parseRawData(parsedCsv, configTitles[key]) };
                    }
                } catch(err) {}
            });

            await Promise.allSettled(fetchPromises);
            
            if (Object.keys(fetchedData).length > 0) {
                appData = fetchedData;
                globalQuizzes = quizzesLoaded;
                localStorage.setItem(CACHE_KEY, JSON.stringify({ halls: appData, quizzes: globalQuizzes }));
            }
        }

        async function fetchMathLeaderboard(type) {
            try {
                const { data, error } = await supabaseClient.from('quiz_responses').select('*').order('created_at', { ascending: true });
                if (error) throw error;
                
                let targetType = String(type || 'grand').toLowerCase().trim();
                let titleText = "Live Leaderboard";

                if (targetType === '23a') titleText = "Day 2: Hall A Standings";
                else if (targetType === '23b') titleText = "Day 2: Hall B Standings";
                else if (targetType === 'day2_cum') titleText = "Day 2 Cumulative Standings";
                else titleText = "Grand Overall Standings";

                let filteredData = data.filter(d => {
                    if (targetType === 'grand' || targetType === 'all') return true;
                    let dHall = String(d.hall_id || '').toLowerCase().replace(/[^a-z0-9]/g, '');
                    let tHall = targetType.replace(/[^a-z0-9]/g, '');

                    if (targetType === 'day2_cum') return dHall.includes('23');
                    return dHall === tHall || dHall.includes(tHall) || tHall.includes(dHall);
                });

                let scores = {};
                let names = {};
                filteredData.forEach(r => { 
                    let p = cleanText(r.phone);
                    if (!p) return;
                    if (scores[p] === undefined) scores[p] = 0;
                    if (r.name && cleanText(r.name) && !names[p]) names[p] = cleanText(r.name);
                }); 
                
                let qGroups = {};
                filteredData.forEach(r => {
                    if (!r.is_correct) return;
                    let key = r.hall_id + "_" + r.question; 
                    if (!qGroups[key]) qGroups[key] = [];
                    if (!qGroups[key].some(x => x.phone === r.phone)) { qGroups[key].push(r); }
                });
                
                Object.values(qGroups).forEach(responses => { responses.forEach((r, idx) => { scores[r.phone] += Math.max(10 - idx, 2); }); });
                return { sorted: Object.entries(scores).sort((a,b) => b[1] - a[1]), titleText, names };
            } catch(e) { return { sorted: [], titleText: "Error Loading Board", names: {} }; }
        }

        async function showTVLeaderboard(type) {
            const modal = document.getElementById('tvLeaderboardModal');
            const list = document.getElementById('tvLeaderboardList');
            if (!modal || !list) return;
            modal.classList.remove('hidden');
            document.getElementById('tvLbSub').innerText = "Real-time Computed Database Weights";
            list.innerHTML = '<div class="flex justify-center my-12"><div class="loader"></div></div>';
            
            let math = await fetchMathLeaderboard(type);
            document.getElementById('tvLbTitle').innerHTML = `<i class="fas fa-trophy mr-4 text-amber-400"></i>${math.titleText}`;
            
            if (!math.sorted || math.sorted.length === 0) {
                list.innerHTML = '<p class="text-slate-400 text-2xl font-bold text-center py-10">No scores recorded yet.</p>';
                return;
            }

            let html = '';
            math.sorted.slice(0, 10).forEach((item, idx) => {
                let name = math.names[item[0]] || 'Delegate';
                let last4 = item[0].length >= 4 ? item[0].slice(-4) : item[0];
                let rankColor = idx === 0 ? 'text-amber-400' : idx === 1 ? 'text-slate-300' : idx === 2 ? 'text-amber-700' : 'text-indigo-400';
                html += `
                    <div class="flex justify-between items-center bg-slate-900 border border-slate-700/80 p-5 rounded-2xl shadow-xl">
                        <span class="text-white text-3xl font-black truncate pr-4"><span class="${rankColor} mr-4 font-mono">#${idx + 1}</span> ${name} <span class="text-slate-400 font-mono text-xl font-normal">(••••${last4})</span></span>
                        <span class="text-emerald-400 text-4xl font-black flex-shrink-0">${item[1]} pts</span>
                    </div>`;
            });
            list.innerHTML = html;
        }

        function hideTVLeaderboard() {
            const modal = document.getElementById('tvLeaderboardModal');
            if (modal) modal.classList.add('hidden');
        }

        function applySplashState(stateName) {
            let urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('preview') === 'true') {
                hideSplashState();
                return;
            }

            let overlay = document.getElementById('tvSplashOverlay');
            let contentDiv = document.getElementById('tvSplashContent');
            if (!overlay || !contentDiv) return;

            if (!stateName || stateName === 'live' || stateName === 'splash_live' || stateName === 'none') {
                hideSplashState();
                return;
            }

            overlay.classList.remove('hidden');

            if (stateName.startsWith('splash_flyer:')) {
                try {
                    let flyerObj = JSON.parse(stateName.replace('splash_flyer:', ''));
                    let resolvedImg = flyerObj.img ? resolveDirectImageUrl(flyerObj.img) : '';
                    let isImageOnly = resolvedImg && !flyerObj.title && !flyerObj.subtitle && !flyerObj.desc;

                    if (isImageOnly) {
                        overlay.className = "absolute inset-0 bg-black z-[400] flex items-center justify-center p-0 transition-opacity duration-300";
                        contentDiv.innerHTML = `<img src="${resolvedImg}" class="w-full h-full object-contain" onerror="this.src='https://via.placeholder.com/1920x1080?text=Slide+Not+Found'">`;
                        return;
                    }

                    let imgHtml = resolvedImg ? `
                        <div class="flex-shrink-0 flex items-center justify-center px-6 max-w-[40vw] z-10">
                            <div class="bg-black/90 p-4 rounded-3xl border-2 border-slate-700 shadow-2xl inline-block max-w-full">
                                <img src="${resolvedImg}" class="max-h-[65vh] max-w-full object-contain rounded-2xl mx-auto block" onerror="this.style.display='none'">

        function getLiveStatusForHall() {
            const data = appData[liveHall];
            if (!data || !data.events) return { currentEvent: null, nextEvent: null };
            
            const playableEvents = data.events.filter(e => {
                if (e.type === 'presentation' || e.type === 'break') return true;
                if (e.isOration && (e.speaker || '').trim() !== '') return true;
                return false;
            });
            if (playableEvents.length === 0) return { currentEvent: null, nextEvent: null };

            if (tvState.remoteIndex !== null && tvState.remoteIndex !== undefined) {
                if (tvState.remoteIndex < 0 && globalQuizzes.length > 0) {
                    return {
                        currentEvent: globalQuizzes[Math.abs(tvState.remoteIndex) - 1] || null,
                        nextEvent: playableEvents[0] || null
                    };
                }
                return {
                    currentEvent: playableEvents[tvState.remoteIndex] || null,
                    nextEvent: playableEvents[tvState.remoteIndex + 1] || null
                };
            }

            const now = new Date();
            const currentMins = now.getHours() * 60 + now.getMinutes();
            let currentEvent = null;
            let nextEvent = null;

            for (let i = 0; i < playableEvents.length; i++) {
                const ev = playableEvents[i];
                const evStart = parseTimeToMinutes(ev.time);
                let evEnd = null;

                if (ev.time && ev.time.includes('-')) {
                    let cleanStr = cleanText(ev.time).toLowerCase().replace(/\s+to\s+/g, '-').replace(/[—–]/g, '-');
                    let parts = cleanStr.split('-');
                    if (parts.length > 1) {
                        evEnd = parseTimeToMinutes(parts[1]);
                    }
                }
                if (evEnd === null && evStart !== null) {
                    evEnd = evStart + 15;
                }

                if (evStart !== null && evEnd !== null) {
                    if (currentMins >= evStart && currentMins < evEnd) {
                        currentEvent = ev;
                        if (i + 1 < playableEvents.length) {
                            nextEvent = playableEvents[i + 1];
                        }
                        break;
                    } else if (currentMins < evStart) {
                        nextEvent = ev;
                        currentEvent = (i > 0) ? playableEvents[i - 1] : playableEvents[0];
                        break;
                    }
                }
            }

            if (!currentEvent && playableEvents.length > 0) {
                let lastEvStart = parseTimeToMinutes(playableEvents[playableEvents.length-1].time);
                if (lastEvStart && currentMins > lastEvStart) {
                    currentEvent = playableEvents[playableEvents.length - 1];
                    nextEvent = null;
                } else {
                    currentEvent = playableEvents[0];
                    nextEvent = playableEvents[1] || null;
                }
            }

            return { currentEvent, nextEvent };
        }

        function subscribeToHallRealtime() {
            supabaseClient.from('hall_states').select('override_index, quiz_start_time, active_leaderboard, active_splash, force_leaderboard').eq('hall_id', liveHall).single().then(({ data }) => {
                if (data) {
                    tvState.remoteIndex = data.override_index;
                    if (data.quiz_start_time) {
                        tvState.localStart = Date.now();
                    }
                    tvState.quizStart = data.quiz_start_time;
                    tvState.expiredRendered = false;
                    
                    let activeCmd = data.active_splash || data.force_leaderboard;
                    if (activeCmd && activeCmd !== 'live' && activeCmd !== 'splash_live' && activeCmd !== 'none') {
                        applySplashState(activeCmd);
                    } else {
                        hideSplashState();
                    }

                    if (data.active_leaderboard && data.active_leaderboard !== 'none') showTVLeaderboard(data.active_leaderboard);
                    else hideTVLeaderboard();
                }
                tvState.lastHash = "";
                refreshDisplays();
            });

            supabaseClient.channel('tv-feed-' + liveHall)
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'hall_states', filter: `hall_id=eq.${liveHall}` },
                    (payload) => {
                        // Check if this payload is just a leaderboard trigger
                        let onlyLeaderboardChanged = (payload.new.active_leaderboard !== payload.old.active_leaderboard);
                        let splashChanged = (payload.new.active_splash !== payload.old.active_splash);
                        
                        tvState.remoteIndex = payload.new.override_index;
                        
                        if (payload.new.quiz_start_time && payload.new.quiz_start_time !== tvState.quizStart) {
                            tvState.localStart = Date.now();
                        } else if (!payload.new.quiz_start_time) {
                            tvState.localStart = null;
                        }
                        tvState.quizStart = payload.new.quiz_start_time;
                        tvState.expiredRendered = false;
                        
                        let splashCmd = payload.new.active_splash || payload.new.force_leaderboard;
                        if (splashCmd && splashCmd !== 'live' && splashCmd !== 'splash_live' && splashCmd !== 'none') {
                            applySplashState(splashCmd);
                        } else if (splashChanged) {
                            hideSplashState();
                        }

                        let boardType = payload.new.active_leaderboard;
                        if (boardType && boardType !== 'none') showTVLeaderboard(boardType);
                        else if (onlyLeaderboardChanged) hideTVLeaderboard();
                        
                        // Prevent background redrawing if ONLY the modal opened
                        if (!onlyLeaderboardChanged || splashChanged) {
                            tvState.lastHash = "";
                            refreshDisplays();
                        }
                    }
                ).subscribe();
        }

        function initClockAndSmoothTicker() {
            tickerTimer = setInterval(() => {
                let timeStr = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
                document.querySelectorAll('.sharedDigitalClock').forEach(el => el.innerText = timeStr);

                if (tvState.remoteIndex !== null && tvState.remoteIndex < 0 && tvState.localStart) {
                    let diff = Math.floor((Date.now() - tvState.localStart) / 1000);
                    let sec = Math.max(0, 45 - diff);
                    
                    let timerEl = document.getElementById(`quizTimer_tv`);
                    if (timerEl && sec > 0) {
                        timerEl.innerHTML = `<i class="fas fa-hourglass-half mr-3 animate-spin"></i>${sec}s`;
                    }
                    
                    if (sec === 0 && !tvState.expiredRendered) {
                        tvState.expiredRendered = true;
                        tvState.lastHash = "";
                        refreshDisplays();
                    } else if (sec > 0) {
                        tvState.expiredRendered = false;
                    }
                }
            }, 1000);
        }

        function toggleCustomNameInput() {
            const val = document.getElementById('wizName').value;
            const inputEl = document.getElementById('wizCustomName');
            if (val === 'custom') {
                inputEl.classList.remove('hidden');
                inputEl.focus();
            } else {
                inputEl.classList.add('hidden');
            }
        }

        function populateWizardDropdowns() {
            const opts = Object.entries(configTitles).map(([k, title]) => `<option value="${k}">${title}</option>`).join('');
            document.getElementById('wizHall').innerHTML = opts;
        }

        function getSelectedHallName() {
            const val = document.getElementById('wizName').value;
            if (val === 'custom') {
                return document.getElementById('wizCustomName').value.trim() || 'Hall';
            } else if (val === 'default') {
                return '';
            }
            return val;
        }

        function launchFromWizard() {
            let newUrl = new URL(window.location);
            let h = document.getElementById('wizHall').value;
            let a = document.getElementById('wizArrow').value;
            let n = getSelectedHallName();
            
            newUrl.searchParams.set('hall', h);
            if (a !== 'none') newUrl.searchParams.set('arrow', a);
            if (n) newUrl.searchParams.set('name', n);
            
            window.location.href = newUrl.toString();
        }

        async function bootApp() {
            initClockAndSmoothTicker();
            const params = new URLSearchParams(window.location.search);
            const hallParam = params.get('hall');
            const arrowParam = params.get('arrow') || "none";
            const nameParam = params.get('name') || "";

            if (!hallParam) {
                populateWizardDropdowns();
                document.getElementById('setupWizard').classList.remove('hidden');
                return;
            }

            liveHall = normalizeHallId(hallParam);
            hallArrow = arrowParam.toLowerCase();
            if (nameParam && nameParam.trim() !== '') {
                hallCustomName = nameParam.trim();
            }

            const cached = localStorage.getItem(CACHE_KEY);
            if (cached) {
                try {
                    let parsed = JSON.parse(cached);
                    appData = parsed.halls || {};
                    globalQuizzes = parsed.quizzes || [];
                } catch(e){}
            }

            await fetchSchedule();
            refreshDisplays();
            subscribeToHallRealtime();

            setInterval(async () => {
                if (!liveHall) return;
                try {
                    const { data } = await supabaseClient.from('hall_states').select('override_index, quiz_start_time, active_splash, active_leaderboard').eq('hall_id', liveHall).single();
                    if (data) {
                        if (data.active_splash === 'RELOAD') {
                            window.location.reload(true);
                            return;
                        }

                        let changed = false;
                        if (tvState.remoteIndex !== data.override_index) {
                            tvState.remoteIndex = data.override_index;
                            changed = true;
                        }
                        if (tvState.quizStart !== data.quiz_start_time) {
                            tvState.quizStart = data.quiz_start_time;
                            if (data.quiz_start_time) {
                                tvState.localStart = Date.now();
                            } else {
                                tvState.localStart = null;
                            }
                            tvState.expiredRendered = false;
                            changed = true;
                        }

                        if (changed) {
                            tvState.lastHash = "";
                            refreshDisplays();
                        }
                    }
                } catch(e){}
            }, 3000);

            setInterval(fetchSchedule, 60000);
        }

        bootApp();
    </script>
</body>
</html>
