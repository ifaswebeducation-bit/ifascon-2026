    <script>
        const supabaseUrl = 'https://iiqxxxamsprzhzggsrer.supabase.co';
        const supabaseKey = 'sb_publishable_eYTrqO8dPDZj0mjbv3Csqg_dMrY2h3k';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        const DELEGATE_APP_URL = "https://ifascon-2026.vercel.app/delegate_live.html";

        const sheetLinks = {
            'quizzes': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTSXW-U_qQZinazbfDmwxFT4VdZ_3OzNaBH29daT9Vm0pzwHu9kVZUTNK5stzUkfvp6gTKbIoM6KH1k/pub?gid=0&single=true&output=csv',
            'ao': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTRQ3g-iv-ZNPmsFq_zInPnhzbraxuMfJNEHsUro3i7C_eNIHWmAc261FSqBcmuNFmDlLVl0-8jKNJ_/pub?gid=189655281&single=true&output=csv',
            '22a': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTRQ3g-iv-ZNPmsFq_zInPnhzbraxuMfJNEHsUro3i7C_eNIHWmAc261FSqBcmuNFmDlLVl0-8jKNJ_/pub?gid=0&single=true&output=csv',
            '22b': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTRQ3g-iv-ZNPmsFq_zInPnhzbraxuMfJNEHsUro3i7C_eNIHWmAc261FSqBcmuNFmDlLVl0-8jKNJ_/pub?gid=660947078&single=true&output=csv',
            '22c': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTRQ3g-iv-ZNPmsFq_zInPnhzbraxuMfJNEHsUro3i7C_eNIHWmAc261FSqBcmuNFmDlLVl0-8jKNJ_/pub?gid=127806642&single=true&output=csv',
            '23a': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTRQ3g-iv-ZNPmsFq_zInPnhzbraxuMfJNEHsUro3i7C_eNIHWmAc261FSqBcmuNFmDlLVl0-8jKNJ_/pub?gid=1579973346&single=true&output=csv',
            '23b': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTRQ3g-iv-ZNPmsFq_zInPnhzbraxuMfJNEHsUro3i7C_eNIHWmAc261FSqBcmuNFmDlLVl0-8jKNJ_/pub?gid=239334255&single=true&output=csv',
            '23c': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTRQ3g-iv-ZNPmsFq_zInPnhzbraxuMfJNEHsUro3i7C_eNIHWmAc261FSqBcmuNFmDlLVl0-8jKNJ_/pub?gid=1095375546&single=true&output=csv'
        };

        const configTitles = {
            'ao_seminar': "21st August 2026 - AO Seminar", 
            'workshop_diabetic': "21st August 2026 - Diabetic Foot", 
            'workshop_mis': "21st August 2026 - MIS Workshop",
            '22a': "22nd August 2026 - Hall A", 
            '22b': "22nd August 2026 - Hall B", 
            '22c': "22nd August 2026 - Hall C",
            '23a': "23rd August 2026 - Hall A", 
            '23b': "23rd August 2026 - Hall B", 
            '23c': "23rd August 2026 - Hall C"
        };

        let appData = {};
        let globalQuizzes = [];
        let isMuted = true;
        const CACHE_KEY = 'ifascon_tv_schedule_cache_v300';

        let activeHalls = [];
        let hallArrows = {};
        let hallCustomNames = {};
        let hallStates = {
            hall1: { id: null, remoteIndex: null, quizStart: null, lastHash: "", expiredRendered: false },
            hall2: { id: null, remoteIndex: null, quizStart: null, lastHash: "", expiredRendered: false }
        };

        function cleanText(val) { return val ? val.toString().replace(/\u00A0/g, ' ').replace(/\s+/g, ' ').trim() : ""; }
        function normalizeHallId(val) {
            if (!val) return "";
            let str = cleanText(val).toLowerCase().replace(/[^a-z0-9]/g, '');
            if (str.includes('ao') || str.includes('sem')) return 'ao_seminar';
            if (str.includes('diabet')) return 'workshop_diabetic';
            if (str.includes('mis')) return 'workshop_mis';
            if (str === '22c' || str === 'hallc' || str === 'c22') return '22c';
            if (str === '23c' || str === 'hallc' || str === 'c23') return '23c';
            if (str.includes('22a') || (str.includes('22') && str.includes('a'))) return '22a';
            if (str.includes('22b') || (str.includes('22') && str.includes('b'))) return '22b';
            if (str.includes('22c')) return '22c';
            if (str.includes('23a') || (str.includes('23') && str.includes('a'))) return '23a';
            if (str.includes('23b') || (str.includes('23') && str.includes('b'))) return '23b';
            if (str.includes('23c')) return '23c';
            return str;
        }

        function resolveDirectImageUrl(url) {
            if (!url) return "";
            url = url.trim();
            if (url.includes('drive.google.com') || url.includes('docs.google.com')) {
                let fIdMatch = url.match(/[-\w]{25,}/);
                if (fIdMatch && fIdMatch[0]) {
                    return `https://drive.google.com/thumbnail?id=${fIdMatch[0]}&sz=w1000`;
                }
            }
            return url;
        }

        function convertTo12HourFormat(timeStr) {
            if (!timeStr) return "";
            if (/[aApP][mM]/.test(timeStr)) { return timeStr; }
            return timeStr.replace(/\b([01]?[0-9]|2[0-3])[:.]([0-5][0-9])(?:[:.][0-9]{2})?\b/g, function(match, p1, p2) {
                let h = parseInt(p1, 10);
                return (h % 12 || 12) + ':' + p2 + ' ' + (h >= 12 ? 'PM' : 'AM');
            });
        }

        function parseTimeToMinutes(timeStr) {
            if (!timeStr) return null;
            let clean = cleanText(timeStr).split('-')[0].trim().toLowerCase();
            let isPM = clean.includes('pm');
            let isAM = clean.includes('am');
            
            let timePart = clean.replace(/[^\d:.]/g, '');
            let parts = timePart.split(/[:.]/);
            if (parts.length < 2) return null;
            
            let hours = parseInt(parts[0], 10);
            let minutes = parseInt(parts[1], 10);
            if (isNaN(hours) || isNaN(minutes)) return null;
            
            if (isPM && hours < 12) hours += 12;
            if (isAM && hours === 12) hours = 0;
            if (!isPM && !isAM && hours >= 1 && hours <= 7) hours += 12;
            
            return hours * 60 + minutes;
        }

        function checkIfCorrect(optionText, correctAnswer, index) {
            let optClean = cleanText(optionText).toLowerCase();
            let corClean = cleanText(correctAnswer).toLowerCase();
            let letter = String.fromCharCode(65 + index).toLowerCase(); 
            return optClean === corClean || corClean === letter || corClean === `option ${letter}` || corClean === `option-${letter}` || corClean === `${letter}.` || corClean === `${letter})`;
        }

        function parseRawData(rows, hallTitle) {
            let events = [], current_session = "";
            const breakRegex = /\b(break|lunch|banquet|gbm|valedictory|inauguration|registration|tea|coffee|sponsor|commercial|ad|video)\b/;
            let isHallC = hallTitle && hallTitle.toLowerCase().includes('hall c');

            rows.forEach(r => {
                while(r.length < 12) r.push("");
                r = r.map(x => cleanText(x));
                let col0 = r[0], col1 = r[1], col2 = r[2], col3 = r[3];
                let colTitle = r[4] || r[5] || "", colSpeaker = r[4] ? r[5] : r[6];
                let colChair1 = r[4] ? r[6] : r[7], colChair2 = r[4] ? r[7] : r[8], colChair3 = r[4] ? r[8] : r[9];
                let row_text = r.join(" ").toLowerCase();

                if (row_text.includes("position:absolute") || row_text.includes("docs-drivelogo") || row_text.includes("<!doctype html>")) return; 
                if (col0.toLowerCase().includes("duration") && col1.toLowerCase().includes("from")) return;
                
                if (hallTitle && !isHallC) {
                    if (row_text.includes("hall c") && !row_text.includes("hall a") && !row_text.includes("hall b")) return;
                }

                if (!col0 && !col1 && !col2 && !col3 && !colTitle) return;

                if (isHallC) {
                    let time_raw = (col1 && col2) ? `${col1} - ${col2}` : (col1 || col2 || "");
                    let topic = col3;
                    if (!topic && !time_raw) return; 
                    if (!topic) topic = "Session"; 
                    let display_time = convertTo12HourFormat(time_raw);

                    if (breakRegex.test(topic.toLowerCase())) {
                        let text = topic;
                        if (topic.toLowerCase().includes("registration")) text = "Registration";
                        else if (topic.toLowerCase().includes("lunch")) text = "Lunch";
                        else if (topic.toLowerCase().includes("coffee") || topic.toLowerCase().includes("tea")) text = "Tea / Coffee Break";
                        events.push({ type: 'break', title: text, time: time_raw, display_time: display_time, speaker: '', hall: hallTitle, parent_session: '', adLink: '' });
                    } else {
                        events.push({ type: 'presentation', time: time_raw, display_time: display_time, tag: '', title: topic, speaker: '', hall: hallTitle, parent_session: '' });
                    }
                    return;
                }

                let isBreakOrAd = breakRegex.test(row_text) && !row_text.includes("symposium") && !row_text.includes("session");
                if (isBreakOrAd) {
                    let text = colTitle || col3 || col0;
                    if (row_text.includes("registration")) text = "Registration";
                    else if (row_text.includes("lunch")) text = "Lunch";
                    else if (/\btea\b|\bcoffee\b/.test(row_text) && !row_text.includes("sponsor") && !row_text.includes("ad")) text = "Tea / Coffee Break";

                    let time_raw = (col1 && col2) ? `${col1} - ${col2}` : (col1 || col0);
                    let display_time = convertTo12HourFormat(time_raw);
                    let adLink = r.find(c => c.toLowerCase().includes('http')) || "";
                    events.push({ type: 'break', title: text, time: time_raw, display_time: display_time, speaker: '', hall: hallTitle, parent_session: '', adLink: adLink });
                    return;
                }

                let isQA = col3.toLowerCase().includes("q&a") || colTitle.toLowerCase().includes("discussion");
                let isPlenary = col3.toLowerCase().includes("plenary") || colTitle.toLowerCase().includes("plenary");
                let isSession = false, isOration = false;

                if (row_text.includes('oration')) { isSession = true; isOration = true; } 
                else if (!isQA && !isPlenary) {
                    if (!col1 && !col2 && !col0) isSession = true; 
                    else if (!col0 && col1 && col2 && !colTitle) isSession = true; 
                    else if (col3 && !colTitle && !colSpeaker) isSession = true; 
                    else if (row_text.includes('symposium') || row_text.includes('session')) isSession = true;
                }

                let isHandsOn = col3.toLowerCase().includes('hands-on') || col3.toLowerCase().includes('demonstration') || colTitle.toLowerCase().includes('hands-on') || colTitle.toLowerCase().includes('demonstration');
                if (isHandsOn) {
                    isSession = false;
                }

                if (isSession) {
                    let topic = colTitle || col3 || (isOration ? "Oration" : "Session");
                    if (colTitle && col3 && colTitle.toLowerCase() !== col3.toLowerCase()) {
                        if (colTitle.toLowerCase().includes(col3.toLowerCase())) topic = colTitle;
                        else if (col3.toLowerCase().includes(colTitle.toLowerCase())) topic = col3;
                        else topic = col3 + ": " + colTitle;
                    }
                    let chairsArr = [isOration ? "" : colSpeaker, colChair1, colChair2, colChair3].filter(c => c && !["nan", "speaker", "chairperson"].includes(c.toLowerCase()));
                    current_session = topic; 
                    let time_raw = (col1 && col2) ? `${col1} - ${col2}` : (col1 || col0);
                    events.push({ type: 'session', isOration: isOration, time: time_raw, display_time: convertTo12HourFormat(time_raw), title: topic, speaker: isOration ? (colSpeaker || "") : chairsArr.join(", "), hall: hallTitle, parent_session: current_session });
                    return;
                }

                if (col1 || colTitle || isQA || isPlenary || col3) {
                    let speaker = ["nan", "tbd"].includes(colSpeaker.toLowerCase()) ? "" : colSpeaker;
                    let time_raw = (col1 && col2) ? `${col1} - ${col2}` : (col1 || col0);
                    if (col0 && !col0.toLowerCase().includes('duration')) { time_raw = time_raw ? `${time_raw} (${col0.trim()})` : col0.trim(); }
                    let display_time = convertTo12HourFormat(time_raw);
                    let displayTitle = (isQA && !colTitle) ? col3 : (colTitle || col3);
                    events.push({ type: 'presentation', isHandsOn: isHandsOn, time: time_raw, display_time: display_time, tag: (isQA && !colTitle) ? "Discussion" : col3, title: displayTitle, speaker: speaker, hall: hallTitle, parent_session: current_session });
                }
            });
            return events;
        }

        async function fetchSchedule() {
            let fetchedData = {};
            let quizzesLoaded = [];
            for (const [key, link] of Object.entries(sheetLinks)) {
                if (!link || link.trim() === '') continue;
                try {
                    const response = await fetch(link);
                    if (!response.ok) continue;
                    const csvText = await response.text();
                    let parsedCsv = Papa.parse(csvText, { header: false, skipEmptyLines: true }).data;
                    
                    if (key === 'quizzes') {
                        let colOffset = 0;
                        if (parsedCsv.length > 1) {
                            let firstRow = parsedCsv[1];
                            let cell0 = cleanText(firstRow[0]);
                            if (/^\d{1,4}$/.test(cell0) || cell0.includes('/')) colOffset = 1;
                        }
                        parsedCsv.forEach((r, idx) => {
                            if (idx === 0 || !r || r.length < 3) return;
                            let rawHall = cleanText(r[0 + colOffset]);
                            let rawSymp = cleanText(r[1 + colOffset]);
                            let rawTitle = cleanText(r[2 + colOffset]);
                            if (!rawTitle || rawTitle.toLowerCase() === 'question' || rawTitle.toLowerCase() === 'title') return;
                            quizzesLoaded.push({ 
                                type: 'quiz', 
                                hall_id: normalizeHallId(rawHall), 
                                symposium: rawSymp || 'General', 
                                title: rawTitle, 
                                options: [cleanText(r[3 + colOffset]), cleanText(r[4 + colOffset]), cleanText(r[5 + colOffset]), cleanText(r[6 + colOffset])].filter(Boolean), 
                                correct: cleanText(r[7 + colOffset]) 
                            });
                        });
                    } else if (key === 'ao') {
                        let semRows = [], diaRows = [], misRows = [];
                        parsedCsv.forEach((r, idx) => {
                            let rowStr = r.join(' ').toLowerCase();
                            if (rowStr.includes('position:absolute') || (rowStr.includes('duration') && rowStr.includes('from'))) return;
                            if (rowStr.includes('mis hallux') || rowStr.includes('calcaneum osteotomy') || rowStr.includes('mis zadek') || rowStr.includes('mis - extended') || rowStr.includes('mis hands-on') || rowStr.includes('getting started with mis')) {
                                misRows.push(r);
                            } else if (rowStr.includes('charcot foot') || rowStr.includes('preventing amputations') || rowStr.includes('hind foot and mid foot charcot') || rowStr.includes('beaming in mid foot') || rowStr.includes('flipper technique') || rowStr.includes('beam screw hands-on')) {
                                diaRows.push(r);
                            } else {
                                semRows.push(r);
                            }
                        });

                        fetchedData['ao_seminar'] = { title: configTitles['ao_seminar'], events: parseRawData(semRows, "AO Seminar Hall") };
                        fetchedData['workshop_diabetic'] = { title: configTitles['workshop_diabetic'], events: parseRawData(diaRows, "Diabetic Foot Hall") };
                        fetchedData['workshop_mis'] = { title: configTitles['workshop_mis'], events: parseRawData(misRows, "MIS Hall") };
                    } else {
                        fetchedData[key] = { title: configTitles[key], events: parseRawData(parsedCsv, configTitles[key]) };
                    }
                } catch(e) {}
            }
            if (Object.keys(fetchedData).length > 0) {
                appData = fetchedData;
                globalQuizzes = quizzesLoaded;
                localStorage.setItem(CACHE_KEY, JSON.stringify({ halls: appData, quizzes: globalQuizzes }));
            }
        }

        async function fetchMathLeaderboard(type) {
            try {
                const { data, error } = await supabaseClient.from('quiz_responses').select('*').order('created_at', { ascending: true });
                if (error) throw error;
                let filteredData = data;
                let titleText = "";
                if (type === '22a') { filteredData = data.filter(d => d.hall_id === '22a'); titleText = "Day 1: Hall A Standings"; }
                else if (type === '22b') { filteredData = data.filter(d => d.hall_id === '22b'); titleText = "Day 1: Hall B Standings"; }
                else if (type === '22c') { filteredData = data.filter(d => d.hall_id === '22c'); titleText = "Day 1: Hall C Standings"; }
                else if (type === 'day1_cum') { filteredData = data.filter(d => ['22a','22b','22c'].includes(d.hall_id)); titleText = "Day 1 Cumulative Standings"; }
                else if (type === '23a') { filteredData = data.filter(d => d.hall_id === '23a'); titleText = "Day 2: Hall A Standings"; }
                else if (type === '23b') { filteredData = data.filter(d => d.hall_id === '23b'); titleText = "Day 2: Hall B Standings"; }
                else if (type === '23c') { filteredData = data.filter(d => d.hall_id === '23c'); titleText = "Day 2: Hall C Standings"; }
                else if (type === 'day2_cum') { filteredData = data.filter(d => ['23a','23b','23c'].includes(d.hall_id)); titleText = "Day 2 Cumulative Standings"; }
                else { titleText = "Grand Overall Standings"; }

                let scores = {};
                let names = {};
                filteredData.forEach(r => { 
                    scores[r.phone] = 0; 
                    if (r.name && !names[r.phone]) names[r.phone] = r.name;
                }); 
                let qGroups = {};
                filteredData.forEach(r => {
                    if (!r.is_correct) return;
                    let key = r.hall_id + "_" + r.question; 
                    if (!qGroups[key]) qGroups[key] = [];
                    if (!qGroups[key].some(x => x.phone === r.phone)) { qGroups[key].push(r); }
                });
                Object.values(qGroups).forEach(responses => { responses.forEach((r, idx) => { scores[r.phone] += Math.max(10 - idx, 1); }); });
                return { sorted: Object.entries(scores).sort((a,b) => b[1] - a[1]), titleText, names };
            } catch(e) { return { sorted: [], titleText: "Error Loading Board", names: {} }; }
        }

        function getLiveStatusForHall(hallId, remoteIndex) {
            const data = appData[hallId];
            if (!data || !data.events) return { currentEvent: null, nextEvent: null };
            
            const playableEvents = data.events.filter(e => {
                if (e.type === 'presentation' || e.type === 'break') return true;
                if (e.isOration && (e.speaker || '').trim() !== '') return true;
                return false;
            });
            if (playableEvents.length === 0) return { currentEvent: null, nextEvent: null };

            // 1. Check Hall-Specific Manual Remote Override (from Cockpit)
            if (remoteIndex !== null && remoteIndex !== undefined) {
                if (remoteIndex < 0 && globalQuizzes.length > 0) {
                    return {
                        currentEvent: globalQuizzes[Math.abs(remoteIndex) - 1] || null,
                        nextEvent: playableEvents[0] || null
                    };
                }
                return {
                    currentEvent: playableEvents[remoteIndex] || null,
                    nextEvent: playableEvents[remoteIndex + 1] || null
                };
            }

            // 2. Real-Time Clock Progression
            const now = new Date();
            const currentMins = now.getHours() * 60 + now.getMinutes();
            let currentEvent = null;
            let nextEvent = null;

            for (let i = 0; i < playableEvents.length; i++) {
                const ev = playableEvents[i];
                const evStart = parseTimeToMinutes(ev.time);
                let evEnd = null;

                if (ev.time && ev.time.includes('-')) {
                    let parts = ev.time.split('-');
                    if (parts.length > 1) {
                        evEnd = parseTimeToMinutes(parts[1]);
                    }
                }
                if (evEnd === null && evStart !== null) {
                    evEnd = evStart + 15;
                }

                if (evStart !== null && evEnd !== null) {
                    if (currentMins >= evStart && currentMins < evEnd) {
                        currentEvent = ev;
                        if (ev.type === 'break' && i > 0 && playableEvents[i - 1].type !== 'break') {
                            currentEvent = playableEvents[i - 1];
                        }
                        if (i + 1 < playableEvents.length) {
                            nextEvent = playableEvents[i + 1];
                        }
                        break;
                    } else if (currentMins < evStart) {
                        nextEvent = ev;
                        currentEvent = (i > 0) ? playableEvents[i - 1] : playableEvents[0];
                        break;
                    }
                }
            }

            if (!currentEvent && playableEvents.length > 0) {
                currentEvent = playableEvents[0];
                nextEvent = playableEvents[1] || null;
            }

            return { currentEvent, nextEvent };
        }

                            if (el && el.innerHTML === "") {
                                new QRCode(el, {
                                    text: `${DELEGATE_APP_URL}?hall=${hallId}`,
                                    width: isSplit ? 68 : 96,
                                    height: isSplit ? 68 : 96,
                                    colorDark : "#020617",
                                    colorLight : "#ffffff",
                                    correctLevel : QRCode.CorrectLevel.M
                                });
                            }
                        }, 50);
                    }
                } else if (currentEvent.type === 'break') {
                    let lowTitle = currentEvent.title.toLowerCase();
                    let isSocietyMeeting = /\b(gbm|general body|inauguration|valedictory|ec meeting|executive committee)\b/i.test(lowTitle);

                    if (currentEvent.adLink && !isSocietyMeeting) {
                        let link = currentEvent.adLink, media = '';
                        if (link.includes('youtube.com') || link.includes('youtu.be')) {
                            let ytMatch = link.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
                            if (ytMatch) media = `<iframe class="w-full aspect-video rounded-3xl shadow-2xl border border-slate-700 pointer-events-none" src="https://www.youtube.com/embed/${ytMatch[1]}?autoplay=1&mute=1&loop=1&playlist=${ytMatch[1]}&controls=0&showinfo=0&modestbranding=1" frameborder="0" allow="autoplay; encrypted-media"></iframe>`;
                        } else if (link.includes('drive.google.com') || link.includes('docs.google.com')) {
                            let dUrl = resolveDirectImageUrl(link);
                            media = `<img src="${dUrl}" class="w-full h-auto ${isSplit ? 'max-h-[40vh]' : 'max-h-[50vh]'} object-contain rounded-3xl bg-black border border-slate-700 shadow-2xl" onerror="this.src='${link}'">`;
                        } else {
                            media = `<img src="${link}" class="w-full h-auto ${isSplit ? 'max-h-[40vh]' : 'max-h-[50vh]'} object-contain rounded-3xl bg-black border border-slate-700 shadow-2xl">`;
                        }
                        bodyHtml = `
                            <div class="flex-1 bg-slate-900 border border-slate-700/80 rounded-3xl ${isSplit ? 'p-6' : 'p-8 sm:p-10'} shadow-2xl flex flex-col justify-between mb-4">
                                <div class="flex items-center justify-between mb-6">
                                    <span class="bg-amber-500 text-slate-950 ${isSplit ? 'px-4 py-1.5 text-xs' : 'px-6 py-2.5 text-sm sm:text-base'} rounded-full font-black uppercase tracking-wider shadow"><i class="fas fa-play-circle mr-2"></i> ${currentEvent.title}</span>
                                    <span class="${isSplit ? 'text-lg px-3 py-1' : 'text-2xl sm:text-3xl px-5 py-2'} font-bold text-slate-300 bg-slate-950 rounded-xl border border-slate-800">${currentEvent.display_time}</span>
                                </div>
                                ${media}
                            </div>`;
                    } else {
                        let breakIcon = "fa-coffee", iconColor = "text-amber-500";
                        if (lowTitle.includes('lunch')) { breakIcon = "fa-utensils"; iconColor = "text-emerald-500"; }
                        else if (lowTitle.includes('banquet') || lowTitle.includes('dinner')) { breakIcon = "fa-glass-cheers"; iconColor = "text-purple-500"; }
                        else if (lowTitle.includes('registration')) { breakIcon = "fa-id-badge"; iconColor = "text-blue-400"; }
                        else if (isSocietyMeeting) { breakIcon = "fa-landmark"; iconColor = "text-indigo-400"; }

                        bodyHtml = `
                            <div class="flex-1 flex flex-col items-center justify-center text-center ${isSplit ? 'py-16' : 'py-24'} bg-slate-900/60 rounded-3xl border border-slate-800 my-4 shadow-inner px-6">
                                <i class="fas ${breakIcon} ${isSplit ? 'text-6xl sm:text-7xl mb-6' : 'text-8xl sm:text-9xl mb-8'} ${iconColor} animate-pulse drop-shadow-2xl"></i>
                                <h2 class="${isSplit ? 'text-3xl sm:text-4xl' : 'text-5xl sm:text-7xl'} font-black text-white uppercase tracking-widest">${currentEvent.title}</h2>
                                <p class="${isSplit ? 'text-xl mt-3' : 'text-3xl sm:text-4xl mt-6'} text-slate-300 font-mono font-bold">${currentEvent.display_time}</p>
                            </div>`;
                    }
                } else {
                    let isHandsOn = currentEvent.isHandsOn || (currentEvent.tag && currentEvent.tag.toLowerCase().includes('hands-on')) || (currentEvent.title && currentEvent.title.toLowerCase().includes('hands-on'));
                    let bStyle = isHandsOn ? "bg-amber-500 text-slate-950" : (currentEvent.isOration ? "bg-rose-600 text-white" : "bg-indigo-600 text-white");
                    let handsOnBadge = isHandsOn ? `<span class="bg-amber-500/20 border border-amber-500/40 text-amber-300 ${isSplit ? 'px-3 py-1 text-xs' : 'px-4 py-1.5 text-sm'} rounded-full font-bold uppercase tracking-wider ml-2 shadow-inner"><i class="fas fa-hand-holding-medical mr-1.5"></i>Hands-on Workshop</span>` : '';
                    let pSess = currentEvent.parent_session && currentEvent.parent_session !== currentEvent.title && !currentEvent.parent_session.toLowerCase().includes('oration') 
                        ? `<div class="text-indigo-400 font-bold uppercase ${isSplit ? 'text-xs sm:text-sm mb-2' : 'text-base sm:text-xl mb-4'} flex items-center tracking-wider"><i class="fas fa-layer-group mr-2.5"></i>${currentEvent.parent_session}</div>` 
                        : '';

                    let titleStyle = isSplit 
                        ? "text-2xl sm:text-3xl lg:text-4xl font-black text-white leading-tight mb-6" 
                        : "text-4xl sm:text-5xl lg:text-6xl xl:text-7xl font-black text-white leading-tight mb-8";

                    let iconHtml = isHandsOn ? `
                        <div class="${isSplit ? 'w-12 h-12 rounded-xl text-xl mr-4' : 'w-20 h-20 sm:w-24 sm:h-24 rounded-2xl text-3xl sm:text-5xl mr-6'} bg-amber-500/20 text-amber-400 flex items-center justify-center p-3 flex-shrink-0 border border-amber-500/40 shadow-inner">
                            <svg class="w-full h-full text-amber-400 fill-current" viewBox="0 0 512 512">
                                <path d="M497.9 74.1l-60-60c-18.7-18.7-49.1-18.7-67.9 0L241.8 142.3l-8.5-8.5c-6.2-6.2-16.4-6.2-22.6 0l-33.9 33.9c-6.2 6.2-6.2 16.4 0 22.6l8.5 8.5L25.4 358.6c-33.9 33.9-33.9 88.8 0 122.6s88.8 33.9 122.6 0l160.7-160.7 8.5 8.5c6.2 6.2 16.4 6.2 22.6 0l33.9-33.9c6.2-6.2 6.2-16.4 0-22.6l-8.5-8.5 128.2-128.2c18.7-18.7 18.7-49.1.5-67.7zM113.8 447c-14.7 14.7-38.5 14.7-53.2 0s-14.7-38.5 0-53.2l128-128 53.2 53.2-128 128z"/>
                            </svg>
                        </div>
                    ` : `
                        <div class="${isSplit ? 'w-12 h-12 rounded-xl text-xl mr-4' : 'w-20 h-20 sm:w-24 sm:h-24 rounded-2xl text-3xl sm:text-5xl mr-6'} bg-indigo-500/20 text-indigo-400 flex items-center justify-center flex-shrink-0 border border-indigo-500/30 shadow-inner">
                            <i class="fas fa-microphone"></i>
                        </div>
                    `;

                    let speakerCardStyle = isSplit 
                        ? `<div class="flex items-center bg-slate-950/80 p-4 rounded-2xl border border-slate-800 shadow-inner">
                                ${iconHtml}
                                <div>
                                    <span class="block text-[10px] uppercase tracking-widest text-slate-400 font-bold">Faculty / Speaker</span>
                                    <span class="text-lg sm:text-xl font-extrabold text-white leading-snug">${currentEvent.speaker}</span>
                                </div>
                           </div>` 
                        : `<div class="flex items-center bg-slate-950/90 p-6 sm:p-8 rounded-3xl border border-slate-800 shadow-2xl inline-flex max-w-full">
                                ${iconHtml}
                                <div>
                                    <span class="block text-xs sm:text-sm uppercase tracking-widest text-slate-400 font-bold mb-1">Faculty / Speaker</span>
                                    <span class="text-2xl sm:text-4xl lg:text-5xl font-black text-white leading-snug">${currentEvent.speaker}</span>
                                </div>
                           </div>`;

                    let statusBadgeClass = isSplit ? "px-3.5 py-1 text-xs" : "px-6 py-2.5 text-sm sm:text-base";
                    let clockBadgeClass = isSplit ? "px-3.5 py-1 text-base sm:text-lg" : "px-6 py-2.5 text-xl sm:text-2xl";

                    bodyHtml = `
                        <div class="flex-1 bg-gradient-to-br from-slate-900 to-slate-900/80 border border-slate-700/80 rounded-3xl ${isSplit ? 'p-6 sm:p-8' : 'p-8 sm:p-12'} shadow-2xl flex flex-col justify-between mb-4">
                            <div>
                                <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
                                    <div class="flex items-center gap-2 flex-wrap">
                                        <span class="${bStyle} ${statusBadgeClass} rounded-full font-black uppercase tracking-widest flex items-center shadow-lg">
                                            <span class="w-2.5 h-2.5 bg-current rounded-full mr-2.5 animate-pulse"></span> LIVE NOW
                                        </span>
                                        ${handsOnBadge}
                                    </div>
                                    <span class="${clockBadgeClass} font-bold text-slate-300 bg-slate-950 rounded-2xl border border-slate-800 shadow-inner">
                                        <i class="far fa-clock mr-2 text-indigo-400"></i>${currentEvent.display_time}
                                    </span>
                                </div>
                                ${pSess}
                                <h1 class="${titleStyle}">${currentEvent.title}</h1>
                            </div>
                            ${currentEvent.speaker ? speakerCardStyle : ''}
                        </div>`;
                }
            }

            let upNextHtml = '';
            if (nextEvent && nextEvent.type !== 'quiz') {
                if (isSplit) {
                    upNextHtml = `
                        <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-4 sm:p-5 flex items-center justify-between gap-3 shadow-md flex-shrink-0">
                            <div class="flex-1 truncate">
                                <span class="text-[10px] font-black uppercase tracking-widest text-amber-400 block mb-1 flex items-center"><i class="fas fa-step-forward mr-1.5"></i>Coming Up &bull; ${nextEvent.display_time}</span>
                                <h4 class="text-base sm:text-lg font-bold text-slate-200 leading-snug truncate">${nextEvent.title}</h4>
                                ${nextEvent.speaker ? `<p class="text-slate-400 text-xs mt-1 truncate"><i class="fas fa-user-md mr-1 text-indigo-400"></i>${nextEvent.speaker}</p>` : ''}
                            </div>
                            <span class="bg-slate-950 text-slate-400 text-[10px] font-bold px-2.5 py-1 rounded-lg border border-slate-800 uppercase flex-shrink-0">${nextEvent.type === 'break' ? 'Break' : 'Next'}</span>
                        </div>`;
                } else {
                    upNextHtml = `
                        <div class="bg-slate-900/70 border border-slate-800/90 rounded-3xl p-6 sm:p-8 flex items-center justify-between gap-6 shadow-xl flex-shrink-0">
                            <div class="flex-1 truncate">
                                <span class="text-xs sm:text-sm font-black uppercase tracking-widest text-amber-400 block mb-2 flex items-center"><i class="fas fa-step-forward mr-2"></i>Coming Up Next &bull; ${nextEvent.display_time}</span>
                                <h4 class="text-2xl sm:text-3xl font-bold text-slate-100 leading-snug truncate">${nextEvent.title}</h4>
                                ${nextEvent.speaker ? `<p class="text-slate-400 text-base sm:text-lg font-semibold mt-2 truncate flex items-center"><i class="fas fa-user-md mr-2 text-indigo-400"></i>${nextEvent.speaker}</p>` : ''}
                            </div>
                            <span class="bg-slate-950 text-slate-300 text-xs sm:text-sm font-black px-4 py-2 rounded-xl border border-slate-800 uppercase flex-shrink-0 shadow">${nextEvent.type === 'break' ? 'Break' : 'Session'}</span>
                        </div>`;
                }
            }

            container.innerHTML = singleBrandingHeader + workshopNotice + bodyHtml + upNextHtml;
        }

        function isQuizRunning(stateObj) {
            if (stateObj.remoteIndex === null || stateObj.remoteIndex >= 0) return false;
            if (stateObj.quizStart) {
                let diff = Math.floor((new Date() - new Date(stateObj.quizStart)) / 1000);
                return diff < 45;
            }
            return true;
        }

        function refreshDisplays() {
            let panel1 = document.getElementById('panelHall1');
            let panel2 = document.getElementById('panelHall2');
            let sharedHdr = document.getElementById('sharedTopHeader');

            if (activeHalls.length === 1) {
                panel1.classList.remove('hidden');
                panel2.classList.add('hidden');
                sharedHdr.classList.add('hidden');
                renderHallPanel('panelHall1', activeHalls[0], hallStates.hall1, hallArrows[activeHalls[0]], false);
                return;
            }

            let h1QuizActive = isQuizRunning(hallStates.hall1);
            let h2QuizActive = isQuizRunning(hallStates.hall2);

            if (h1QuizActive && !h2QuizActive) {
                sharedHdr.classList.add('hidden');
                panel2.classList.add('hidden');
                panel1.classList.remove('hidden');
                renderHallPanel('panelHall1', activeHalls[0], hallStates.hall1, hallArrows[activeHalls[0]], false);
            } else if (h2QuizActive && !h1QuizActive) {
                sharedHdr.classList.add('hidden');
                panel1.classList.add('hidden');
                panel2.classList.remove('hidden');
                renderHallPanel('panelHall2', activeHalls[1], hallStates.hall2, hallArrows[activeHalls[1]], false);
            } else {
                sharedHdr.classList.remove('hidden');
                panel1.classList.remove('hidden');
                panel2.classList.remove('hidden');
                renderHallPanel('panelHall1', activeHalls[0], hallStates.hall1, hallArrows[activeHalls[0]], true);
                renderHallPanel('panelHall2', activeHalls[1], hallStates.hall2, hallArrows[activeHalls[1]], true);
            }
        }

        function subscribeToHallRealtime(hallId, stateSlot) {
            supabaseClient.from('hall_states').select('override_index, quiz_start_time, active_leaderboard, active_splash').eq('hall_id', hallId).single().then(({ data }) => {
                if (data) {
                    stateSlot.remoteIndex = data.override_index;
                    stateSlot.quizStart = data.quiz_start_time;
                    stateSlot.expiredRendered = false;
                    
                    if (data.active_splash && data.active_splash !== 'live') applySplashState(data.active_splash);
                    else hideSplashState();

                    if (data.active_leaderboard && data.active_leaderboard !== 'none') showTVLeaderboard(data.active_leaderboard);
                    else hideTVLeaderboard();
                }
                stateSlot.lastHash = "";
                refreshDisplays();
            });

            supabaseClient.channel('tv-feed-' + hallId)
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'hall_states', filter: `hall_id=eq.${hallId}` },
                    (payload) => {
                        stateSlot.remoteIndex = payload.new.override_index;
                        stateSlot.quizStart = payload.new.quiz_start_time;
                        stateSlot.expiredRendered = false;
                        
                        let splash = payload.new.active_splash;
                        if (splash && splash !== 'live') applySplashState(splash);
                        else hideSplashState();

                        let boardType = payload.new.active_leaderboard;
                        if (boardType && boardType !== 'none') showTVLeaderboard(boardType);
                        else hideTVLeaderboard();
                        
                        stateSlot.lastHash = "";
                        refreshDisplays();
                    }
                ).subscribe();
        }

        function initClockAndSmoothTicker() {
            setInterval(() => {
                let timeStr = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
                document.querySelectorAll('.sharedDigitalClock').forEach(el => el.innerText = timeStr);

                ['hall1', 'hall2'].forEach(slot => {
                    let st = hallStates[slot];
                    if (st.id && st.remoteIndex !== null && st.remoteIndex < 0 && st.quizStart) {
                        let diff = Math.floor((new Date() - new Date(st.quizStart)) / 1000);
                        let sec = Math.max(0, 45 - diff);
                        
                        let timerEl = document.getElementById(`quizTimer_${st.id}`);
                        if (timerEl && sec > 0) {
                            timerEl.innerHTML = `<i class="fas fa-hourglass-half mr-2 animate-spin"></i>${sec}s`;
                        }
                        
                        if (sec === 0 && !st.expiredRendered) {
                            st.expiredRendered = true;
                            st.lastHash = "";
                            refreshDisplays();
                        } else if (sec > 0) {
                            st.expiredRendered = false;
                        }
                    }
                });
            }, 1000);
        }

        function setWizardMode(mode) {
            const singleSec = document.getElementById('wizSingleSection');
            const splitSec = document.getElementById('wizSplitSection');
            const btnSingle = document.getElementById('wizModeSingle');
            const btnSplit = document.getElementById('wizModeSplit');
            if (mode === 'split') {
                singleSec.classList.add('hidden');
                splitSec.classList.remove('hidden');
                btnSplit.className = "py-2.5 px-4 rounded-xl border border-indigo-500 bg-indigo-600/30 text-indigo-300 font-bold transition";
                btnSingle.className = "py-2.5 px-4 rounded-xl border border-slate-700 bg-slate-800 text-slate-400 font-bold transition";
            } else {
                splitSec.classList.add('hidden');
                singleSec.classList.remove('hidden');
                btnSingle.className = "py-2.5 px-4 rounded-xl border border-indigo-500 bg-indigo-600/30 text-indigo-300 font-bold transition";
                btnSplit.className = "py-2.5 px-4 rounded-xl border border-slate-700 bg-slate-800 text-slate-400 font-bold transition";
            }
        }

        function toggleCustomNameInput(selectId, inputId) {
            const val = document.getElementById(selectId).value;
            const inputEl = document.getElementById(inputId);
            if (val === 'custom') {
                inputEl.classList.remove('hidden');
                inputEl.focus();
            } else {
                inputEl.classList.add('hidden');
            }
        }

        function populateWizardDropdowns() {
            const opts = Object.entries(configTitles).map(([k, title]) => `<option value="${k}">${title}</option>`).join('');
            document.getElementById('wizHall1').innerHTML = opts;
            document.getElementById('wizSplitHall1').innerHTML = opts;
            document.getElementById('wizSplitHall2').innerHTML = opts;
            document.getElementById('wizSplitHall2').selectedIndex = 1;
        }

        function getSelectedHallName(selectId, inputId) {
            const val = document.getElementById(selectId).value;
            if (val === 'custom') {
                return document.getElementById(inputId).value.trim() || 'Hall';
            } else if (val === 'default') {
                return '';
            }
            return val;
        }

        function launchFromWizard() {
            let isSplit = !document.getElementById('wizSplitSection').classList.contains('hidden');
            let newUrl = new URL(window.location);
            if (isSplit) {
                let h1 = document.getElementById('wizSplitHall1').value;
                let h2 = document.getElementById('wizSplitHall2').value;
                let a1 = document.getElementById('wizArrow1').value;
                let a2 = document.getElementById('wizArrow2').value;
                let n1 = getSelectedHallName('wizSplitName1', 'wizSplitCustomName1');
                let n2 = getSelectedHallName('wizSplitName2', 'wizSplitCustomName2');
                
                newUrl.searchParams.set('halls', `${h1},${h2}`);
                newUrl.searchParams.set('arrows', `${a1},${a2}`);
                if (n1 || n2) newUrl.searchParams.set('names', `${n1},${n2}`);
            } else {
                let h1 = document.getElementById('wizHall1').value;
                let a1 = document.getElementById('wizSingleArrow').value;
                let n1 = getSelectedHallName('wizName1', 'wizCustomName1');
                
                newUrl.searchParams.set('hall', h1);
                if (a1 !== 'none') newUrl.searchParams.set('arrow', a1);
                if (n1) newUrl.searchParams.set('name', n1);
            }
            window.location.href = newUrl.toString();
        }

        async function bootApp() {
            initClockAndSmoothTicker();
            const params = new URLSearchParams(window.location.search);
            const hallsParam = params.get('halls') || params.get('hall');
            const arrowsParam = params.get('arrows') || params.get('arrow') || "";
            const namesParam = params.get('names') || params.get('name') || "";

            if (!hallsParam) {
                populateWizardDropdowns();
                document.getElementById('setupWizard').classList.remove('hidden');
                return;
            }

            const rawList = hallsParam.split(',').map(s => normalizeHallId(s)).filter(Boolean);
            const rawArrows = arrowsParam.split(',').map(s => s.trim().toLowerCase());
            const rawNames = namesParam.split(',').map(s => s.trim());

            activeHalls = rawList.slice(0, 2);
            activeHalls.forEach((h, i) => {
                hallArrows[h] = rawArrows[i] || (i === 0 ? 'left' : 'right');
                if (rawNames[i] && rawNames[i].trim() !== '') {
                    hallCustomNames[h] = rawNames[i].trim();
                }
            });

            if (activeHalls.length > 1) {
                document.getElementById('sharedTopHeader').classList.remove('hidden');
                document.getElementById('panelHall2').classList.remove('hidden');
            }

            hallStates.hall1.id = activeHalls[0];
            if (activeHalls.length > 1) hallStates.hall2.id = activeHalls[1];

            const cached = localStorage.getItem(CACHE_KEY);
            if (cached) {
                try {
                    let parsed = JSON.parse(cached);
                    appData = parsed.halls || {};
                    globalQuizzes = parsed.quizzes || [];
                } catch(e){}
            }

            await fetchSchedule();
            refreshDisplays();

            subscribeToHallRealtime(activeHalls[0], hallStates.hall1);
            if (activeHalls.length > 1) {
                subscribeToHallRealtime(activeHalls[1], hallStates.hall2);
            }

            setInterval(fetchSchedule, 60000);
        }

        bootApp();
    </script>
</body>
