<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IFASCON 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        .glass-header { background: #ffffff; border-bottom: 1px solid #e2e8f0; backdrop-filter: blur(10px); }
        .tab-btn.active { color: #4f46e5; border-top-color: #4f46e5; background-color: #f1f5f9; }
        
        /* Loading Spinner */
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #4f46e5; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Live Kiosk Styles */
        body.live-mode { background-color: #0f172a !important; color: #f8fafc !important; }
        .live-mode .glass-header, .live-mode nav, .live-mode .z-40, .live-mode #downloadContainer { display: none !important; }
        .live-mode #contentContainer { padding: 2rem !important; max-width: 1200px; margin: 0 auto; }
        
        /* Pulse animation for live badge */
        @keyframes pulse-fast { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.8; transform: scale(0.98); } }
        .animate-live { animation: pulse-fast 2s infinite ease-in-out; }
    </style>
</head>
<body class="text-slate-800 flex flex-col h-screen overflow-hidden">

    <header class="glass-header z-50 flex-shrink-0 relative">
        <div class="px-4 py-3 flex items-center justify-center h-[72px]">
            <img src="IFASCON chd logo.jpg" alt="IFASCON 2026 Logo" class="h-20 object-contain" onerror="this.src='https://via.placeholder.com/200x50?text=IFASCON+2026'">
        </div>
    </header>

    <div class="z-40 bg-white/90 backdrop-blur px-4 py-3 border-b border-slate-200 shadow-sm flex-shrink-0">
        <div class="relative">
            <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
            <input type="text" id="searchInput" placeholder="Search speaker, topic..." 
                   autocomplete="off" autocorrect="off" spellcheck="false"
                   class="w-full pl-10 pr-10 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition shadow-inner" disabled>
            <button id="clearSearch" class="hidden absolute right-3 top-1/2 transform -translate-y-1/2 text-slate-400 hover:text-slate-600 p-1">
                <i class="fas fa-times-circle"></i>
            </button>
        </div>
    </div>
    
    <div id="downloadContainer" class="hidden bg-white/90 backdrop-blur px-4 pb-3 border-b border-slate-200 shadow-sm flex-shrink-0">
        <button id="downloadBtn" class="w-full bg-indigo-600 text-white py-2.5 rounded-xl text-sm font-bold shadow hover:bg-indigo-700 transition flex items-center justify-center">
            <i class="fas fa-file-download mr-2"></i> Download My Itinerary (.txt)
        </button>
    </div>

    <div id="manualOverridePanel" class="hidden fixed top-0 left-0 w-full bg-slate-900/95 border-b border-slate-700 p-4 z-50 shadow-2xl backdrop-blur flex flex-col sm:flex-row items-center justify-between gap-4 text-white">
        <div class="flex items-center gap-3">
            <span class="bg-amber-500 text-slate-950 font-black px-2.5 py-1 rounded text-xs uppercase tracking-wider">Manual Override Active</span>
            <span class="text-sm text-slate-300">TV is unlinked from the real clock. Use arrows to shift talks.</span>
        </div>
        <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
            <button onclick="manualShift(-1)" class="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-lg font-bold border border-slate-600 active:scale-95 transition flex-1 sm:flex-none">⬅ Prev Talk</button>
            <button onclick="manualShift(1)" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-lg font-bold shadow active:scale-95 transition flex-1 sm:flex-none">Next Talk ➔</button>
            <button onclick="resumeAutoSync()" class="bg-rose-600/20 text-rose-400 hover:bg-rose-600/30 px-3 py-2 rounded-lg font-bold border border-rose-500/30 ml-2 active:scale-95 transition text-sm">Resume Auto</button>
        </div>
    </div>

    <main class="flex-1 overflow-y-auto p-4 pb-24 relative" id="contentContainer">
        <div id="loadingState" class="absolute inset-0 flex flex-col items-center justify-center bg-f8fafc z-50">
            <div class="loader mb-4"></div>
            <p class="text-slate-500 font-semibold text-sm animate-pulse" id="loadingText">Syncing live schedule...</p>
        </div>
    </main>

    <nav class="fixed bottom-0 w-full bg-white shadow-[0_-4px_10px_rgba(0,0,0,0.05)] border-t border-slate-200 flex justify-around z-50 pb-safe">
        <button onclick="showTab('ao_seminar')" id="tab-ao_seminar" class="tab-btn flex-1 py-2.5 px-1 text-[10px] sm:text-xs font-bold border-t-2 border-transparent text-slate-500 transition opacity-50 leading-tight" disabled>21 Aug<br><span class="text-[9px] text-indigo-600 block mt-0.5">AO Trauma Foot & Ankle Seminar</span></button>
        <button onclick="showTab('ao_workshops')" id="tab-ao_workshops" class="tab-btn flex-1 py-2.5 px-1 text-[10px] sm:text-xs font-bold border-t-2 border-transparent text-slate-500 transition opacity-50 leading-tight" disabled>21 Aug<br><span class="text-[9px] text-rose-600 block mt-0.5">Workshops:<br>Diabetic Foot Workshop<br>MIS Workshop</span></button>
        <button onclick="showTab('22a')" id="tab-22a" class="tab-btn flex-1 py-2.5 px-1 text-[10px] sm:text-xs font-bold border-t-2 border-transparent text-slate-600 transition opacity-50 leading-tight" disabled>22 Aug<br><span class="text-[9px] text-indigo-400 block mt-0.5">Day 1<br>Hall A</span></button>
        <button onclick="showTab('22b')" id="tab-22b" class="tab-btn flex-1 py-2.5 px-1 text-[10px] sm:text-xs font-bold border-t-2 border-transparent text-slate-600 transition opacity-50 leading-tight" disabled>22 Aug<br><span class="text-[9px] text-indigo-400 block mt-0.5">Day 1<br>Hall B</span></button>
        <button onclick="showTab('23a')" id="tab-23a" class="tab-btn flex-1 py-2.5 px-1 text-[10px] sm:text-xs font-bold border-t-2 border-transparent text-slate-600 transition opacity-50 leading-tight" disabled>23 Aug<br><span class="text-[9px] text-indigo-400 block mt-0.5">Day 2<br>Hall A</span></button>
        <button onclick="showTab('23b')" id="tab-23b" class="tab-btn flex-1 py-2.5 px-1 text-[10px] sm:text-xs font-bold border-t-2 border-transparent text-slate-600 transition opacity-50 leading-tight" disabled>23 Aug<br><span class="text-[9px] text-indigo-400 block mt-0.5">Day 2<br>Hall B</span></button>
    </nav>

    <script>
        // Google Sheets Published CSV Links
        const sheetLinks = {
            'ao': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTRQ3g-iv-ZNPmsFq_zInPnhzbraxuMfJNEHsUro3i7C_eNIHWmAc261FSqBcmuNFmDlLVl0-8jKNJ_/pub?gid=189655281&single=true&output=csv',
            '22a': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTRQ3g-iv-ZNPmsFq_zInPnhzbraxuMfJNEHsUro3i7C_eNIHWmAc261FSqBcmuNFmDlLVl0-8jKNJ_/pub?gid=0&single=true&output=csv',
            '22b': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTRQ3g-iv-ZNPmsFq_zInPnhzbraxuMfJNEHsUro3i7C_eNIHWmAc261FSqBcmuNFmDlLVl0-8jKNJ_/pub?gid=660947078&single=true&output=csv',
            '23a': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTRQ3g-iv-ZNPmsFq_zInPnhzbraxuMfJNEHsUro3i7C_eNIHWmAc261FSqBcmuNFmDlLVl0-8jKNJ_/pub?gid=1579973346&single=true&output=csv',
            '23b': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTRQ3g-iv-ZNPmsFq_zInPnhzbraxuMfJNEHsUro3i7C_eNIHWmAc261FSqBcmuNFmDlLVl0-8jKNJ_/pub?gid=239334255&single=true&output=csv'
        };

        const configTitles = {
            'ao_seminar': "21st August' 2026 - AO Trauma Foot & Ankle Seminar",
            'ao_workshops': "21st August' 2026 - Concurrent Workshops : Diabetic Foot & MIS (4.15pm to 6pm)",
            '22a': "22nd August' 2026 - Day 1 Hall A",
            '22b': "22nd August' 2026 - Day 1 Hall B",
            '23a': "23rd August' 2026 - Day 2 Hall A",
            '23b': "23rd August' 2026 - Day 2 Hall B"
        };

        // App State & Caching Variables (Busted to v9 for Live Module)
        let appData = {};
        const CACHE_KEY = 'ifascon_schedule_cache_v9'; 
        const container = document.getElementById('contentContainer');
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearSearch');
        const downloadContainer = document.getElementById('downloadContainer');
        const downloadBtn = document.getElementById('downloadBtn');
        let currentTab = 'ao_seminar';

        // --- Live Mode State Variables ---
        const urlParams = new URLSearchParams(window.location.search);
        const isLiveMode = urlParams.get('mode') === 'live';
        const liveHall = urlParams.get('hall') || '22a';
        let manualOverrideIndex = null; // Holds custom talk index if manually changed
        let liveUpdateTimer = null;

        // --- Core Engine & Caching Logic ---
        
        async function initializeApp() {
            if (isLiveMode) {
                document.body.classList.add('live-mode');
            }

            const cachedData = localStorage.getItem(CACHE_KEY);
            
            if (cachedData) {
                try {
                    appData = JSON.parse(cachedData);
                    document.getElementById('loadingState').classList.add('hidden');
                    enableUI();
                    startAppropriateView();
                    fetchLiveSchedule(true);
                } catch (e) {
                    fetchLiveSchedule(false);
                }
            } else {
                fetchLiveSchedule(false);
            }
        }

        function startAppropriateView() {
            if (isLiveMode) {
                initLiveKiosk(liveHall);
            } else {
                showTab(currentTab);
            }
        }

        function enableUI() {
            searchInput.disabled = false;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.disabled = false;
                btn.classList.remove('opacity-50');
            });
        }

        async function fetchLiveSchedule(isBackground = false) {
            let fetchedData = {};
            let hasErrors = false;

            for (const [key, link] of Object.entries(sheetLinks)) {
                try {
                    const response = await fetch(link);
                    const csvText = await response.text();
                    
                    Papa.parse(csvText, {
                        complete: function(results) {
                            if (key === 'ao') {
                                // --- STRICT 24h SPLIT FOR 21st AUGUST ---
                                const allAoEvents = parseRawData(results.data, "21 Aug");
                                let seminarEvents = [];
                                let workshopEvents = [];
                                let isWorkshopSection = false;

                                allAoEvents.forEach(ev => {
                                    const matchString = `${ev.title} ${ev.time} ${ev.parent_session}`.toLowerCase();
                                    
                                    if (/\b(workshop|16:15|16\.15)\b/i.test(matchString) || 
                                        matchString.includes('16:15') || 
                                        matchString.includes('16.15')) {
                                        isWorkshopSection = true;
                                    }

                                    if (isWorkshopSection) {
                                        ev.hall = "Workshops";
                                        workshopEvents.push(ev);
                                    } else {
                                        ev.hall = "AO Seminar";
                                        seminarEvents.push(ev);
                                    }
                                });

                                fetchedData['ao_seminar'] = {
                                    title: configTitles['ao_seminar'],
                                    events: seminarEvents
                                };
                                fetchedData['ao_workshops'] = {
                                    title: configTitles['ao_workshops'],
                                    events: workshopEvents
                                };
                            } else {
                                fetchedData[key] = {
                                    title: configTitles[key],
                                    events: parseRawData(results.data, configTitles[key])
                                };
                            }
                        }
                    });
                } catch(err) {
                    console.error("Failed to load: ", key, err);
                    hasErrors = true;
                }
            }
            
            if (Object.keys(fetchedData).length > 0) {
                appData = fetchedData;
                localStorage.setItem(CACHE_KEY, JSON.stringify(appData));
                
                if (!isBackground) {
                    document.getElementById('loadingState').classList.add('hidden');
                    enableUI();
                    startAppropriateView();
                } else {
                    if (!searchInput.value && !isLiveMode) {
                        showTab(currentTab);
                    } else if (isLiveMode && manualOverrideIndex === null) {
                        updateLiveDisplay();
                    }
                }
            } else {
                document.getElementById('loadingText').innerText = "Failed to load schedule. Please check connection.";
            }
        }

        function parseRawData(rows, hallTitle) {
            let events = [];
            let current_session = "";

            rows.forEach(r => {
                while(r.length < 12) r.push("");
                r = r.map(x => (x || "").trim());

                let col0 = r[0], col1 = r[1], col2 = r[2], col3 = r[3];
                
                // Flexible Column Detection
                let colTitle = r[4] || r[5] || "";
                let colSpeaker = r[4] ? r[5] : r[6];
                let colChair1 = r[4] ? r[6] : r[7];
                let colChair2 = r[4] ? r[7] : r[8];
                let colChair3 = r[4] ? r[8] : r[9];

                let row_text = r.join(" ").toLowerCase();

                // Strict Junk / Error HTML Filter
                if (row_text.includes("position:absolute") || 
                    row_text.includes("docs-drivelogo") || 
                    row_text.includes("background-image") || 
                    row_text.includes("var(--") || 
                    row_text.includes("<!doctype html>")) {
                    return; 
                }

                // Skip junk/header rows
                if (col0.toLowerCase().includes("duration") && col1.toLowerCase().includes("from")) return;
                if (!col0 && !col1 && !col2 && !col3 && !colTitle) return;
                if (row_text.includes("ifascon 2026")) return;
                if ((row_text.includes("hall a") || row_text.includes("hall b")) && !col0 && !col1) return;

                // Identify Breaks 
                const breaks = ["break", "lunch", "tea", "coffee", "registration", "inauguration", "banquet", "gbm", "valedictory"];
                if (breaks.some(b => row_text.includes(b)) && !row_text.includes("symposium") && !row_text.includes("session")) {
                    let text = colTitle || col3 || col0;
                    if (row_text.includes("registration")) text = "Registration";
                    else if (row_text.includes("lunch")) text = "Lunch";
                    else if (row_text.includes("coffee") || row_text.includes("tea")) text = "Tea / Coffee Break";
                    else if (row_text.includes("gbm")) text = "GBM";
                    else if (row_text.includes("valedictory")) text = "Valedictory";
                    
                    let time_str = (col1 && col2) ? `${col1} - ${col2}` : col0;
                    if (!time_str && col1) time_str = col1;
                    
                    events.push({ type: 'break', title: text, time: time_str, speaker: '', hall: hallTitle, searchable: text.toLowerCase(), parent_session: '' });
                    return;
                }

                // Check if it is a Q&A, Discussion, or Plenary 
                let isQA = false;
                if (col3.toLowerCase().includes("q&a") || col3.toLowerCase().includes("discussion") || 
                    colTitle.toLowerCase().includes("q&a") || colTitle.toLowerCase().includes("discussion") ||
                    col3.toLowerCase().includes("q & a") || colTitle.toLowerCase().includes("q & a")) {
                    isQA = true;
                }
                
                let isPlenary = false;
                if (col3.toLowerCase().includes("plenary") || colTitle.toLowerCase().includes("plenary")) {
                    isPlenary = true;
                }

                // --- ROBUST SESSION & ORATION HEADING DETECTION ---
                let isSession = false;
                let isOration = false;
                
                if (!isQA && !isPlenary) {
                    if (!col1 && !col2 && !col0) isSession = true; 
                    else if (!col0 && col1 && col2 && !colTitle) isSession = true; 
                    else if (col3 && !colTitle && !colSpeaker) isSession = true; 
                    else if (row_text.includes('symposium') || row_text.includes('session') || row_text.includes('workshop')) {
                        isSession = true;
                    }
                    else if (row_text.includes('oration')) {
                        isSession = true;
                        isOration = true;
                    }
                }

                if (isSession) {
                    let topic, main_speaker, extra_chairs;
                    
                    if (isOration) {
                        let orationName = col3 || "Oration";
                        let orationTopic = colTitle ? `: ${colTitle}` : "";
                        topic = orationName + orationTopic;
                        main_speaker = colSpeaker || ""; 
                        
                        let chairsArr = [colChair1, colChair2, colChair3].filter(c => c && !["nan", "speaker", "chairperson", "chairpersons", "tbd", "chair :", "co-chair :"].includes(c.toLowerCase()));
                        extra_chairs = chairsArr.join(", ");
                    } else {
                        topic = colTitle || col3 || "Session";
                        let chairsArr = [colSpeaker, colChair1, colChair2, colChair3].filter(c => c && !["nan", "speaker", "chairperson", "chairpersons", "tbd", "chair :", "co-chair :"].includes(c.toLowerCase()));
                        main_speaker = chairsArr.join(", ");
                        extra_chairs = "";
                    }
                    
                    let time_str = "";
                    if (col1 && col2) time_str = `${col1} - ${col2}`;
                    else if (col1 || col0) time_str = col1 || col0;

                    current_session = topic; 
                    events.push({ 
                        type: 'session', 
                        isOration: isOration, 
                        time: time_str, 
                        title: topic, 
                        speaker: main_speaker, 
                        chairpersons: extra_chairs,
                        hall: hallTitle, 
                        searchable: `${topic} ${main_speaker} ${extra_chairs}`.toLowerCase(), 
                        parent_session: current_session 
                    });
                    return;
                }

                // Identify Standard Presentations / Q&A / Plenary
                if (col1 || colTitle || isQA || isPlenary) {
                    let speaker = colSpeaker;
                    if (["nan", "tbd"].includes(speaker.toLowerCase())) speaker = "";
                    
                    let time_display = "";
                    if (col1 && col2) time_display = `${col1} - ${col2}`;
                    else if (col1) time_display = col1;

                    if (col0) {
                        let cleanDur = col0.replace(/[^0-9]/g, ''); 
                        let durText = cleanDur ? `${cleanDur} mins` : col0; 
                        
                        if (time_display) {
                            time_display += ` (${durText})`;
                        } else {
                            time_display = durText;
                        }
                    }

                    let displayTitle = colTitle;
                    let displayTag = col3;

                    if (isQA && !displayTitle) {
                        displayTitle = col3;
                        displayTag = "Discussion";
                    }
                    
                    if (isPlenary && !displayTitle) {
                        displayTitle = col3;
                    }

                    events.push({ type: 'presentation', time: time_display, tag: displayTag, title: displayTitle, speaker: speaker, hall: hallTitle, searchable: `${displayTitle} ${speaker} ${displayTag}`.toLowerCase(), parent_session: current_session });
                }
            });

            return events;
        }

        // --- LIVE TV KIOSK & MANUAL OVERRIDE ENGINE ---
        
        function parseTimeToMinutes(timeStr) {
            if (!timeStr) return null;
            const startTime = timeStr.split('-')[0].trim();
            const parts = startTime.split(/[.:]/);
            if (parts.length < 2) return null;
            const hours = parseInt(parts[0], 10);
            const mins = parseInt(parts[1], 10);
            if (isNaN(hours) || isNaN(mins)) return null;
            return hours * 60 + mins;
        }

        function getCurrentMinutes() {
            const now = new Date();
            return now.getHours() * 60 + now.getMinutes();
            // To simulate time during testing, uncomment below (e.g., 10:15 AM = 615):
            // return 10 * 60 + 15;
        }

        function getLiveStatus(events) {
            // Only consider presentations and breaks for "Live Now", ignoring session headers
            const playableEvents = events.filter(e => e.type === 'presentation' || e.type === 'break');
            
            // If user has clicked override buttons, strictly follow their manual index
            if (manualOverrideIndex !== null) {
                const currentEvent = playableEvents[manualOverrideIndex] || null;
                const nextEvent = playableEvents[manualOverrideIndex + 1] || null;
                return { currentEvent, nextEvent };
            }

            // Otherwise, automatically calculate based on the real computer clock
            const currentMins = getCurrentMinutes();
            let currentEvent = null;
            let nextEvent = null;

            for (let i = 0; i < playableEvents.length; i++) {
                const ev = playableEvents[i];
                const evStart = parseTimeToMinutes(ev.time);
                
                let evEnd = null;
                if (ev.time && ev.time.includes('-')) {
                    evEnd = parseTimeToMinutes(ev.time.split('-')[1].trim());
                } else if (evStart !== null) {
                    evEnd = evStart + 15; // Assume 15 min duration if no end time exists
                }

                if (evStart !== null && evEnd !== null) {
                    if (currentMins >= evStart && currentMins < evEnd) {
                        currentEvent = ev;
                        if (i + 1 < playableEvents.length) nextEvent = playableEvents[i + 1];
                        break;
                    } else if (currentMins < evStart && !nextEvent) {
                        nextEvent = ev;
                    }
                }
            }
            return { currentEvent, nextEvent };
        }

        function toggleManualPanel() {
            const panel = document.getElementById('manualOverridePanel');
            panel.classList.toggle('hidden');
        }

        function manualShift(step) {
            const data = appData[liveHall];
            if (!data) return;
            const playableEvents = data.events.filter(e => e.type === 'presentation' || e.type === 'break');
            
            // Initialize manual index to currently playing event if not yet set
            if (manualOverrideIndex === null) {
                const { currentEvent } = getLiveStatus(data.events);
                manualOverrideIndex = playableEvents.indexOf(currentEvent);
                if (manualOverrideIndex === -1) manualOverrideIndex = 0;
            }

            manualOverrideIndex += step;
            // Prevent scrolling past start or end of the day's schedule
            if (manualOverrideIndex < 0) manualOverrideIndex = 0;
            if (manualOverrideIndex >= playableEvents.length) manualOverrideIndex = playableEvents.length - 1;

            document.getElementById('manualOverridePanel').classList.remove('hidden');
            updateLiveDisplay();
        }

        function resumeAutoSync() {
            manualOverrideIndex = null;
            document.getElementById('manualOverridePanel').classList.add('hidden');
            updateLiveDisplay();
        }

        function updateLiveDisplay() {
            const data = appData[liveHall];
            if (!data) return;

            const { currentEvent, nextEvent } = getLiveStatus(data.events);
            const nowStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            let nowPlayingHtml = `
                <div class="text-center py-20 bg-slate-800/40 rounded-3xl border border-slate-800 my-8">
                    <i class="fas fa-calendar-check text-6xl mb-4 text-slate-600"></i>
                    <h2 class="text-3xl font-bold text-slate-400">No Session Currently Active</h2>
                    <p class="text-lg text-slate-500 mt-2">Check the UP NEXT section below for scheduled presentations.</p>
                </div>`;

            if (currentEvent) {
                // ALWAYS keep the standard theme colors (Rose for Orations, Indigo for normal talks)
                let badgeStyle = currentEvent.isOration ? "bg-rose-600" : "bg-indigo-600";
                
                // ALWAYS display "LIVE NOW", completely hiding manual mode from the audience
                let badgeText = "LIVE NOW";

                nowPlayingHtml = `
                    <div class="bg-gradient-to-br from-slate-800 to-slate-800/80 border-2 border-slate-700/80 rounded-3xl p-6 sm:p-10 shadow-2xl relative overflow-hidden mb-8">
                        <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
                            <span class="animate-live ${badgeStyle} px-4 py-1.5 rounded-full text-sm sm:text-base font-black uppercase tracking-widest flex items-center shadow-lg">
                                <span class="w-2.5 h-2.5 bg-white rounded-full mr-2.5"></span> ${badgeText}
                            </span>
                            <span class="text-xl sm:text-2xl font-bold text-slate-300 bg-slate-900/60 px-4 py-1.5 rounded-xl border border-slate-700/50">
                                <i class="far fa-clock mr-2 text-indigo-400"></i>${currentEvent.time || 'Time TBD'}
                            </span>
                        </div>
                        
                        ${currentEvent.parent_session ? `<div class="text-indigo-400 font-bold uppercase tracking-wider text-base sm:text-xl mb-2 flex items-center"><i class="fas fa-layer-group mr-2 text-sm"></i>${currentEvent.parent_session}</div>` : ''}
                        <h1 class="text-3xl sm:text-5xl lg:text-6xl font-black text-white leading-tight mb-8">${currentEvent.title}</h1>
                        
                        ${currentEvent.speaker ? `
                        <div class="flex items-center bg-slate-900/90 p-5 sm:p-6 rounded-2xl border border-slate-700/80 shadow-inner inline-flex max-w-full">
                            <div class="w-12 h-12 sm:w-16 sm:h-16 rounded-2xl bg-indigo-500/20 text-indigo-400 flex items-center justify-center text-2xl sm:text-3xl mr-4 sm:mr-6 flex-shrink-0 border border-indigo-500/30">
                                <i class="fas fa-microphone"></i>
                            </div>
                            <div>
                                <span class="block text-xs uppercase tracking-widest text-slate-400 font-bold mb-0.5">Speaker / Faculty</span>
                                <span class="text-xl sm:text-3xl font-extrabold text-white leading-snug">${currentEvent.speaker}</span>
                            </div>
                        </div>` : ''}
                    </div>`;
            }
            let upNextHtml = '';
            if (nextEvent) {
                upNextHtml = `
                    <div class="bg-slate-800/40 border border-slate-700/60 rounded-2xl p-6 sm:p-8 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div class="flex-1">
                            <span class="text-xs font-black uppercase tracking-widest text-amber-400 block mb-1.5 flex items-center">
                                <i class="fas fa-step-forward mr-2"></i>Coming Up Next &bull; ${nextEvent.time || 'Next'}
                            </span>
                            <h4 class="text-xl sm:text-2xl font-bold text-slate-200 leading-snug">${nextEvent.title}</h4>
                            ${nextEvent.speaker ? `<p class="text-slate-400 font-semibold text-base mt-2 flex items-center"><i class="fas fa-user-md mr-2 text-indigo-400"></i>${nextEvent.speaker}</p>` : ''}
                        </div>
                        <div class="sm:text-right flex-shrink-0">
                            <span class="inline-block bg-slate-800 text-slate-300 font-bold text-xs px-3 py-1.5 rounded-lg border border-slate-700 uppercase tracking-wider">
                                ${nextEvent.type === 'break' ? 'Break' : 'Presentation'}
                            </span>
                        </div>
                    </div>`;
            }

            container.innerHTML = `
                <div class="max-w-6xl mx-auto pt-2">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center pb-6 mb-2 border-b border-slate-800 gap-4">
                        <div>
                            <div class="flex items-center gap-3">
                                <span class="bg-indigo-600 text-white font-black px-2.5 py-0.5 rounded text-[10px] uppercase tracking-widest">Digital Signage</span>
                                <span class="text-slate-400 text-sm font-semibold">${data.title.split(' - ')[0]}</span>
                            </div>
                            <h2 class="text-2xl sm:text-4xl font-black text-white mt-1 tracking-tight">${data.title.split(' - ')[1] || data.title}</h2>
                        </div>
                        
                        <div onclick="toggleManualPanel()" class="cursor-pointer bg-slate-800/80 hover:bg-slate-800 border border-slate-700 px-5 py-2.5 rounded-2xl transition flex items-center gap-3 shadow-lg group ml-auto sm:ml-0" title="Click to manually change talk if running late">
                            <i class="fas fa-sliders-h text-slate-500 group-hover:text-indigo-400 transition"></i>
                            <div class="text-2xl sm:text-3xl font-black text-white font-mono tracking-wider">${nowStr}</div>
                        </div>
                    </div>
                    ${nowPlayingHtml}
                    ${upNextHtml}
                </div>`;
        }

        function initLiveKiosk(hallKey) {
            if (!appData[hallKey]) {
                container.innerHTML = `<div class="text-center py-20 text-white"><h2 class="text-2xl font-bold">Hall ID '${hallKey}' Not Found.</h2><p class="text-slate-400 mt-2">Available IDs: ao_seminar, ao_workshops, 22a, 22b, 23a, 23b</p></div>`;
                return;
            }
            updateLiveDisplay();
            // Automatically check time and update display every 30 seconds
            if (liveUpdateTimer) clearInterval(liveUpdateTimer);
            liveUpdateTimer = setInterval(updateLiveDisplay, 30000);
        }

        // --- Standard Rendering Logic (For Phones / Normal Website) ---
        function renderEvent(ev, showHall = false) {
            let hallBadge = showHall ? `<div class="mb-3 inline-block px-2.5 py-1 bg-slate-800 text-white text-[10px] font-bold uppercase rounded tracking-wider shadow-sm">${ev.hall}</div>` : '';
            
            let searchContextHtml = (showHall && ev.parent_session && ev.type === 'presentation') ? 
                `<div class="mb-3 p-2 bg-indigo-50 border-l-2 border-indigo-500 rounded text-xs font-bold text-indigo-800 leading-tight">
                    <span class="uppercase tracking-wide text-[9px] text-indigo-500 block mb-0.5">Part of Session:</span>
                    ${ev.parent_session}
                </div>` : '';
            
            if (ev.type === 'break') {
                const icon = ev.title.toLowerCase().includes('coffee') || ev.title.toLowerCase().includes('tea') ? 'fa-coffee' : 
                             ev.title.toLowerCase().includes('lunch') ? 'fa-utensils' : 
                             ev.title.toLowerCase().includes('registration') ? 'fa-clipboard-list' : 'fa-star';
                             
                let timeBadgeHtml = ev.time ? `<span class="text-xs font-bold text-amber-700 bg-amber-100 px-2.5 py-1 rounded-md ml-2 whitespace-nowrap">${ev.time}</span>` : '';

                return `
                    <div class="bg-amber-50 border border-amber-200 rounded-xl p-4 my-4 flex items-center justify-between shadow-sm">
                        <div class="flex items-center">
                            <div class="w-10 h-10 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center mr-3 flex-shrink-0">
                                <i class="fas ${icon} text-lg"></i>
                            </div>
                            <div>
                                ${hallBadge}
                                <h3 class="font-bold text-amber-900 leading-tight">${ev.title}</h3>
                            </div>
                        </div>
                        ${timeBadgeHtml}
                    </div>
                `;
            } 
            else if (ev.type === 'session') {
                let speakerLabel = ev.isOration ? "Speaker / Orator" : "Chairpersons";
                let iconClass = ev.isOration ? "fa-microphone" : "fa-users";
                
                let bgStyle = ev.isOration ? "border-rose-500 bg-gradient-to-r from-rose-50 to-white" : "border-indigo-600 bg-gradient-to-r from-indigo-50 to-white";
                let tagColor = ev.isOration ? "bg-rose-600" : "bg-indigo-600";
                let textColor = ev.isOration ? "text-rose-600" : "text-indigo-500";
                let borderColor = ev.isOration ? "border-rose-200/60" : "border-indigo-200/60";

                if (ev.title.toLowerCase().includes('workshop')) {
                    bgStyle = "border-rose-500 bg-gradient-to-r from-rose-50 to-white";
                    tagColor = "bg-rose-600";
                    textColor = "text-rose-600";
                    borderColor = "border-rose-200/60";
                }

                let speakerHtml = ev.speaker ? `
                    <div class="mt-3 pt-3 border-t ${borderColor} flex items-start">
                        <i class="fas ${iconClass} mt-1 mr-2 ${textColor} text-sm"></i> 
                        <div>
                            <span class="block text-[10px] font-bold uppercase tracking-wider ${textColor} mb-0.5">${speakerLabel}</span>
                            <span class="text-sm font-bold text-slate-900 leading-snug">${ev.speaker}</span>
                        </div>
                    </div>` : '';
                    
                let chairpersonsHtml = ev.chairpersons ? `
                    <div class="mt-2 pt-2 border-t border-dashed ${borderColor} flex items-start">
                        <i class="fas fa-users mt-1 mr-2 text-slate-400 text-sm"></i> 
                        <div>
                            <span class="block text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-0.5">Chairpersons / Faculty</span>
                            <span class="text-[13px] font-bold text-slate-700 leading-snug">${ev.chairpersons}</span>
                        </div>
                    </div>` : '';
                    
                let timeBadgeHtml = ev.time ? `
                    <div class="flex items-center gap-2 mb-2">
                        <span class="inline-flex items-center text-xs font-bold ${tagColor} text-white px-2.5 py-1 rounded shadow-sm">
                            <i class="far fa-clock mr-1.5"></i> ${ev.time}
                        </span>
                    </div>` : '';
                    
                return `
                    <div class="mt-8 mb-4 border-l-4 ${bgStyle} p-4 rounded-r-xl shadow-sm ring-1 ring-slate-200/50">
                        ${hallBadge}
                        ${timeBadgeHtml}
                        <h2 class="text-[19px] font-black text-slate-900 tracking-tight leading-snug uppercase">${ev.title}</h2>
                        ${speakerHtml}
                        ${chairpersonsHtml}
                    </div>
                `;
            } 
            else {
                let tagClass = "bg-slate-100 text-slate-600 border border-slate-200";
                
                if(ev.tag && ev.tag.toLowerCase().includes('lecture')) tagClass = "bg-blue-50 text-blue-600 border border-blue-100";
                else if(ev.tag && ev.tag.toLowerCase().includes('panel')) tagClass = "bg-purple-50 text-purple-600 border border-purple-100";
                else if(ev.tag && (ev.tag.toLowerCase().includes('q&a') || ev.tag.toLowerCase().includes('discussion'))) tagClass = "bg-orange-50 text-orange-600 border border-orange-100";
                else if(ev.tag && (ev.tag.toLowerCase().includes('plenary') || ev.tag.toLowerCase().includes('oration'))) tagClass = "bg-rose-50 text-rose-700 border border-rose-200";

                let tagHtml = ev.tag ? `<span class="px-2 py-1 text-[10px] uppercase tracking-wider font-bold rounded flex-shrink-0 ${tagClass}">${ev.tag}</span>` : '';
                let speakerHtml = ev.speaker ? `<div class="mt-3 flex items-start bg-slate-50 p-2 rounded-lg border border-slate-100"><i class="fas fa-microphone text-indigo-400 mt-0.5 mr-2 text-sm"></i><span class="text-[13px] font-bold text-indigo-900 leading-snug">${ev.speaker}</span></div>` : '';
                
                let timeBadgeHtml = ev.time ? `
                    <div class="text-xs font-bold text-slate-600 bg-slate-100 px-2 py-1 rounded border border-slate-200 inline-flex items-center whitespace-nowrap">
                        <i class="far fa-clock mr-1.5 text-slate-400"></i> ${ev.time}
                    </div>` : '';

                let metaRowHtml = (timeBadgeHtml || tagHtml) ? `
                    <div class="flex flex-wrap items-center gap-2 mb-2">
                        ${timeBadgeHtml}
                        ${tagHtml}
                    </div>` : '';
                
                return `
                    <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200 mb-3 ml-0 sm:ml-4 relative overflow-hidden transition-all hover:shadow-md">
                        ${hallBadge}
                        ${searchContextHtml}
                        ${metaRowHtml}
                        <h3 class="text-[15px] font-semibold text-slate-800 leading-snug mt-1">${ev.title}</h3>
                        ${speakerHtml}
                    </div>
                `;
            }
        }

        // --- Interaction Logic ---
        function showTab(tabKey) {
            if (isLiveMode) return; // Ignore tabs if running as a TV display screen
            currentTab = tabKey;
            searchInput.value = '';
            clearBtn.classList.add('hidden');
            downloadContainer.classList.add('hidden');
            
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('tab-' + tabKey).classList.add('active');
            
            const data = appData[tabKey];
            if (!data) return;

            container.innerHTML = `
                <div class="mb-5 flex items-center justify-between pb-2 border-b border-slate-200">
                    <h2 class="text-xl font-extrabold text-slate-800 tracking-tight">${data.title.split(' - ')[0]}</h2>
                    <span class="text-[10px] font-bold bg-indigo-50 border border-indigo-100 text-indigo-700 px-2.5 py-1 rounded-full uppercase tracking-widest leading-tight text-right max-w-[50%] shadow-sm">${data.title.split(' - ')[1]}</span>
                </div>
            `;
            
            let eventsHtml = '';
            data.events.forEach(ev => { eventsHtml += renderEvent(ev, false); });
            
            if (eventsHtml === '') {
                eventsHtml = `
                    <div class="text-center py-12 px-4">
                        <div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-4 text-slate-400">
                            <i class="fas fa-file-excel text-2xl"></i>
                        </div>
                        <h3 class="text-lg font-semibold text-slate-700">Data Unavailable</h3>
                        <p class="text-slate-500 text-sm mt-1">Please ensure this tab is published to the web as a CSV in Google Sheets.</p>
                    </div>
                `;
            }

            container.innerHTML += eventsHtml;
            container.scrollTop = 0;
        }

        function performSearch(query) {
            if (isLiveMode) return;
            if (!query) {
                downloadContainer.classList.add('hidden');
                showTab(currentTab);
                return;
            }
            
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            container.innerHTML = `
                <div class="mb-5 pb-2 border-b border-slate-200">
                    <h2 class="text-xl font-extrabold text-slate-800 tracking-tight">Search Results</h2>
                    <p class="text-sm text-slate-500 mt-1">Showing all commitments for "<span class="font-bold text-indigo-600">${query}</span>"</p>
                </div>
            `;
            
            let foundCount = 0;
            let resultsHtml = '';
            
            for (const [key, data] of Object.entries(appData)) {
                data.events.forEach(ev => {
                    if (ev.searchable.includes(query)) {
                        resultsHtml += renderEvent(ev, true);
                        foundCount++;
                    }
                });
            }
            
            if (foundCount === 0) {
                downloadContainer.classList.add('hidden');
                container.innerHTML += `
                    <div class="text-center py-12 px-4">
                        <div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-4 text-slate-400">
                            <i class="fas fa-search text-2xl"></i>
                        </div>
                        <h3 class="text-lg font-semibold text-slate-700">No results found</h3>
                        <p class="text-slate-500 text-sm mt-1">Check the spelling and try again.</p>
                    </div>
                `;
            } else {
                downloadContainer.classList.remove('hidden');
                container.innerHTML += resultsHtml;
            }
        }

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            if (query.length > 0) clearBtn.classList.remove('hidden');
            else clearBtn.classList.add('hidden');
            performSearch(query);
        });

        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            clearBtn.classList.add('hidden');
            downloadContainer.classList.add('hidden');
            showTab(currentTab);
        });

        downloadBtn.addEventListener('click', () => {
            const query = searchInput.value.trim();
            if (!query) return;

            let textContent = `IFASCON 2026 - Itinerary for: "${query}"\n`;
            textContent += `==========================================================\n\n`;

            for (const [key, data] of Object.entries(appData)) {
                data.events.forEach(ev => {
                    if (ev.searchable.includes(query.toLowerCase())) {
                        textContent += `Date / Location : ${data.title}\n`;
                        if (ev.parent_session) textContent += `Session       : ${ev.parent_session}\n`;
                        if (ev.time) textContent += `Time          : ${ev.time}\n`;
                        if (ev.title) textContent += `Topic         : ${ev.title}\n`;
                        
                        if (ev.isOration) {
                            if (ev.speaker) textContent += `Speaker/Orator: ${ev.speaker}\n`;
                            if (ev.chairpersons) textContent += `Chairpersons  : ${ev.chairpersons}\n`;
                        } else {
                            if (ev.speaker) textContent += `Speaker/Chair : ${ev.speaker}\n`;
                        }
                        
                        textContent += `----------------------------------------------------------\n\n`;
                    }
                });
            }

            const blob = new Blob([textContent], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `IFASCON_Itinerary_${query.replace(/\s+/g, '_')}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        // --- Start the Engine ---
        initializeApp();
    </script>
</body>
</html>
