<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        .loader { border: 3px solid #334155; border-top: 3px solid #6366f1; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .animate-live { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex flex-col h-screen bg-slate-900 overflow-hidden relative">

    <div id="globalHijackOverlay" class="hidden absolute inset-0 bg-slate-950/95 backdrop-blur-md z-[200] flex flex-col items-center justify-center p-6 text-center">

    <!-- Top Identity Banner -->
    <div id="identityControlBanner" class="w-full bg-slate-950 border-b border-slate-800 p-3 flex justify-between items-center z-50 flex-shrink-0 shadow-md">

        <span class="text-slate-500 text-xs font-semibold ml-2">Syncing data...</span>
    </div>

    <script>
        const supabaseUrl = 'https://iiqxxxamsprzhzggsrer.supabase.co';
        const supabaseKey = 'sb_publishable_eYTrqO8dPDZj0mjbv3Csqg_dMrY2h3k';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        const sheetLinks = {
            'quizzes': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTSXW-U_qQZinazbfDmwxFT4VdZ_3OzNaBH29daT9Vm0pzwHu9kVZUTNK5stzUkfvp6gTKbIoM6KH1k/pub?gid=0&single=true&output=csv',
            'ao': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTRQ3g-iv-ZNPmsFq_zInPnhzbraxuMfJNEHsUro3i7C_eNIHWmAc261FSqBcmuNFmDlLVl0-8jKNJ_/pub?gid=189655281&single=true&output=csv',
            '22a': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTRQ3g-iv-ZNPmsFq_zInPnhzbraxuMfJNEHsUro3i7C_eNIHWmAc261FSqBcmuNFmDlLVl0-8jKNJ_/pub?gid=0&single=true&output=csv',
            '22b': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTRQ3g-iv-ZNPmsFq_zInPnhzbraxuMfJNEHsUro3i7C_eNIHWmAc261FSqBcmuNFmDlLVl0-8jKNJ_/pub?gid=660947078&single=true&output=csv',
            '22c': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTRQ3g-iv-ZNPmsFq_zInPnhzbraxuMfJNEHsUro3i7C_eNIHWmAc261FSqBcmuNFmDlLVl0-8jKNJ_/pub?gid=127806642&single=true&output=csv',
            '23a': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTRQ3g-iv-ZNPmsFq_zInPnhzbraxuMfJNEHsUro3i7C_eNIHWmAc261FSqBcmuNFmDlLVl0-8jKNJ_/pub?gid=1579973346&single=true&output=csv',
            '23b': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTRQ3g-iv-ZNPmsFq_zInPnhzbraxuMfJNEHsUro3i7C_eNIHWmAc261FSqBcmuNFmDlLVl0-8jKNJ_/pub?gid=239334255&single=true&output=csv',
            '23c': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTRQ3g-iv-ZNPmsFq_zInPnhzbraxuMfJNEHsUro3i7C_eNIHWmAc261FSqBcmuNFmDlLVl0-8jKNJ_/pub?gid=1095375546&single=true&output=csv'
        };

        const configTitles = {
            'ao_seminar': "21st August 2026 - AO Seminar", 'workshop_diabetic': "21st August 2026 - Diabetic Foot", 'workshop_mis': "21st August 2026 - MIS Workshop",
            '22a': "22nd August 2026 - Hall A", '22b': "22nd August 2026 - Hall B", '22c': "22nd August 2026 - Hall C",
            '23a': "23rd August 2026 - Hall A", '23b': "23rd August 2026 - Hall B", '23c': "23rd August 2026 - Hall C"
        };

        function cleanText(val) { return val ? val.toString().replace(/\u00A0/g, ' ').replace(/\s+/g, ' ').trim() : ""; }
        function normalizeHallId(val) {
            if (!val) return "";
            let str = cleanText(val).toLowerCase().replace(/[^a-z0-9]/g, '');
            if (str.includes('ao') || str.includes('sem')) return 'ao_seminar';
            if (str.includes('diabet')) return 'workshop_diabetic';
            if (str.includes('mis')) return 'workshop_mis';
            if (str === '22c' || str === 'hallc' || str === 'c22') return '22c';
            if (str === '23c' || str === 'hallc' || str === 'c23') return '23c';
            if (str.includes('22a') || (str.includes('22') && str.includes('a'))) return '22a';
            if (str.includes('22b') || (str.includes('22') && str.includes('b'))) return '22b';
            if (str.includes('22c')) return '22c';
            if (str.includes('23a') || (str.includes('23') && str.includes('a'))) return '23a';
            if (str.includes('23b') || (str.includes('23') && str.includes('b'))) return '23b';
            if (str.includes('23c')) return '23c';
            return str;
        }
        function checkIfCorrect(optionText, correctAnswer, index) {
            let optClean = cleanText(optionText).toLowerCase();
            let corClean = cleanText(correctAnswer).toLowerCase();
            let letter = String.fromCharCode(65 + index).toLowerCase(); 
            return optClean === corClean || corClean === letter || corClean === `option ${letter}` || corClean === `option-${letter}` || corClean === `${letter}.` || corClean === `${letter})`;
        }

        let appData = {};
        let globalQuizzes = [];
        
        let rawHallParam = new URLSearchParams(window.location.search).get('hall');
        let liveHall = rawHallParam ? normalizeHallId(rawHallParam) : '22a';
        if(!liveHall || liveHall === "") liveHall = '22a'; 
        
        let remoteOverrideIndex = null;
        let quizStartTimeStamp = null;
        let tickerTimer = null;
        let liveUpdateTimer = null;
        let lastRenderHash = "";

        const CACHE_KEY = 'ifascon_schedule_cache_delegate_v99'; 

        window.hideLeaderboard = function() {
            const modal = document.getElementById('leaderboardModal');
            if (modal) modal.classList.add('hidden');
        };

        window.showLeaderboard = async function(type) {
            const modal = document.getElementById('leaderboardModal');
            const list = document.getElementById('leaderboardList');
            if (!modal || !list) return;

            modal.classList.remove('hidden');
            document.getElementById('lbSub').innerText = "Calculating Data...";
            list.innerHTML = '<div class="flex justify-center my-8"><div class="loader"></div></div>';

            try {
                let mathResults = await fetchMathLeaderboard(type);
                document.getElementById('lbTitle').innerHTML = `<i class="fas fa-trophy mr-3"></i>${mathResults.titleText}`;
                document.getElementById('lbSub').innerText = "Live Standings";

                if (!mathResults.sorted || mathResults.sorted.length === 0) {
                    list.innerHTML = '<p class="text-slate-400 text-center py-4">No data available yet.</p>';
                    return;
                }

                let html = '';
                mathResults.sorted.slice(0, 50).forEach((item, idx) => {
                    let phone = item[0];
                    let score = item[1];
                    let name = mathResults.names[phone] || 'Delegate';
                    let last4 = phone.length >= 4 ? phone.slice(-4) : phone;
                    let rankColor = idx === 0 ? 'text-amber-400' : idx === 1 ? 'text-slate-300' : idx === 2 ? 'text-amber-700' : 'text-indigo-400';
                    
                    html += `
                        <div class="flex justify-between items-center bg-slate-900 border border-slate-700 p-4 rounded-xl mb-2 shadow-inner">
                            <span class="text-white font-bold"><span class="${rankColor} mr-3">#${idx + 1}</span> ${name} <span class="text-slate-400 font-mono text-xs">(••••${last4})</span></span>
                            <span class="text-emerald-400 font-black">${score} pts</span>
                        </div>
                    `;
                });
                list.innerHTML = html;
            } catch(e) {
                list.innerHTML = '<p class="text-rose-400 text-center py-4">Failed to load standings.</p>';
            }
        };

        window.syncMyAnswers = async function() {
            let phone = localStorage.getItem('delegate_phone');
            if(!phone) return;
            const { data } = await supabaseClient.from('quiz_responses').select('question, hall_id').eq('phone', phone);
            if(data) {
                data.forEach(d => {
                    let cleanKey = (d.hall_id + "_" + d.question).replace(/\W/g, '');
                    localStorage.setItem('answered_' + cleanKey, 'true');
                });
            }
        };

        window.refreshIdentityStateUI = function() {
            let num = localStorage.getItem('delegate_phone');
            let name = localStorage.getItem('delegate_name');
            let loggedInView = document.getElementById('identityLoggedInState');
            let loggedOutView = document.getElementById('identityLoggedOutState');
            if (num && name && loggedInView && loggedOutView) {
                loggedOutView.classList.add('hidden');
                loggedInView.classList.remove('hidden');
                let last4 = num.length >= 4 ? num.slice(-4) : num;
                document.getElementById('identityBannerLabel').innerText = `${name} (••••${last4})`;
            } else if (loggedInView && loggedOutView) {
                loggedInView.classList.add('hidden');
                loggedOutView.classList.remove('hidden');
            }
        };

        window.saveTopBannerIdentity = async function() {
            let nameVal = document.getElementById('topNameRegisterInput').value.trim();
            let phoneVal = document.getElementById('topPhoneRegisterInput').value.trim();
            if (!nameVal || nameVal.length < 2) { alert('Please enter your full name.'); return; }
            if (!phoneVal || phoneVal.length < 7) { alert('Please supply a valid telephone number.'); return; }

            localStorage.setItem('delegate_name', nameVal);
            localStorage.setItem('delegate_phone', phoneVal);
            window.refreshIdentityStateUI();
            await window.syncMyAnswers();
            window.updateLiveDisplay(true);
            window.updatePersistentFooter();
        };

        window.clearDelegateIdentity = function() {
            localStorage.removeItem('delegate_name');
            localStorage.removeItem('delegate_phone');
            window.refreshIdentityStateUI();
            window.updateLiveDisplay(true);
            window.updatePersistentFooter();
        };

        window.fetchLiveSchedule = async function(isBackground = false) {
            let fetchedData = {};
            let quizzesLoaded = [];
            for (const [key, link] of Object.entries(sheetLinks)) {
                if(!link || link.trim() === '') continue;
                try {
                    const response = await fetch(link);
                    if(!response.ok) continue;
                    const csvText = await response.text();
                    let parsedCsv = Papa.parse(csvText, { header: false, skipEmptyLines: true }).data;
                    
                    if (key === 'quizzes') {
                        let colOffset = 0;
                        if (parsedCsv.length > 1) {
                            let firstRow = parsedCsv[1];
                            let cell0 = cleanText(firstRow[0]);
                            if (/^\d{1,4}$/.test(cell0) || cell0.includes('/')) colOffset = 1;
                        }

                        parsedCsv.forEach((r, idx) => {
                            if (idx === 0 || !r || r.length < 3) return;
                            let rawHall = cleanText(r[0 + colOffset]);
                            let rawSymp = cleanText(r[1 + colOffset]);
                            let rawTitle = cleanText(r[2 + colOffset]);

                            if (!rawTitle || rawTitle.toLowerCase() === 'question' || rawTitle.toLowerCase() === 'title') return;

                            quizzesLoaded.push({ 
                                type: 'quiz', 
                                hall_id: normalizeHallId(rawHall), 
                                symposium: rawSymp || 'General', 
                                title: rawTitle, 
                                options: [cleanText(r[3 + colOffset]), cleanText(r[4 + colOffset]), cleanText(r[5 + colOffset]), cleanText(r[6 + colOffset])].filter(Boolean), 
                                correct: cleanText(r[7 + colOffset]) 
                            });
                        });
                    } else if (key === 'ao') {
                        const allAo = parseRawData(parsedCsv, "21 Aug");
                        let sem = [], dia = [], mis = [];
                        let isWs = false, track = 'diabetic';
                        allAo.forEach(ev => {
                            let matchStr = `${ev.title} ${ev.time} ${ev.parent_session}`.toLowerCase();
                            if (/\b(workshop|16:15|16\.15)\b/i.test(matchStr)) isWs = true;
                            if (isWs) {
                                if (matchStr.includes('diabetic') || matchStr.includes('nebula')) track = 'diabetic';
                                else if (matchStr.includes('mis') || matchStr.includes('arthrex')) track = 'mis';
                                if (track === 'diabetic') { ev.hall = "Diabetic Foot Hall"; dia.push(ev); }
                                else { ev.hall = "MIS Hall"; mis.push(ev); }
                            } else { ev.hall = "AO Seminar Hall"; sem.push(ev); }
                        });
                        fetchedData['ao_seminar'] = { title: configTitles['ao_seminar'], events: sem };
                        fetchedData['workshop_diabetic'] = { title: configTitles['workshop_diabetic'], events: dia };
                        fetchedData['workshop_mis'] = { title: configTitles['workshop_mis'], events: mis };
                    } else {
                        fetchedData[key] = { title: configTitles[key], events: parseRawData(parsedCsv, configTitles[key]) };
                    }
                } catch(err) {}
            }
            
            if(Object.keys(fetchedData).length === 0) {
                document.getElementById('loadingText').innerText = "Network Error. Check CSV Links.";
                return;
            }

            appData = fetchedData;
            globalQuizzes = quizzesLoaded;
            localStorage.setItem(CACHE_KEY, JSON.stringify({ halls: appData, quizzes: globalQuizzes }));
            
            if (!isBackground && document.getElementById('loadingState')) { 
                document.getElementById('loadingState').classList.add('hidden');
                document.getElementById('staticHeader').classList.remove('hidden'); 
                window.initLiveDashboard(); 
            } else { 
                window.updateLiveDisplay(true); 
            }
        };

        function convertTo12HourFormat(timeStr) {
            if (!timeStr) return "";
            if (/[aApP][mM]/.test(timeStr)) { return timeStr; }
            return timeStr.replace(/\b([01]?[0-9]|2[0-3])[:.]([0-5][0-9])(?:[:.][0-9]{2})?\b/g, function(match, p1, p2) {
                let h = parseInt(p1, 10);
                let ampm = h >= 12 ? 'PM' : 'AM';
                h = h % 12; h = h ? h : 12; 
                let paddedH = h < 10 ? '0' + h : h;
                return paddedH + ':' + p2 + ' ' + ampm;
            });
        }

        function parseRawData(rows, hallTitle) {
            let events = [], current_session = "";
            const breakRegex = /\b(break|lunch|banquet|gbm|valedictory|inauguration|registration|tea|coffee|sponsor|commercial|ad|video)\b/;
            let isHallC = hallTitle && hallTitle.toLowerCase().includes('hall c');

            rows.forEach(r => {
                while(r.length < 12) r.push("");
                r = r.map(x => cleanText(x));
                let col0 = r[0], col1 = r[1], col2 = r[2], col3 = r[3];
                let colTitle = r[4] || r[5] || "", colSpeaker = r[4] ? r[5] : r[6];
                let colChair1 = r[4] ? r[6] : r[7], colChair2 = r[4] ? r[7] : r[8], colChair3 = r[4] ? r[8] : r[9];
                let row_text = r.join(" ").toLowerCase();

                if (row_text.includes("position:absolute") || row_text.includes("docs-drivelogo") || row_text.includes("<!doctype html>")) return; 
                if (col0.toLowerCase().includes("duration") && col1.toLowerCase().includes("from")) return;
                
                if (hallTitle && !isHallC) {
                    if (row_text.includes("hall c") && !row_text.includes("hall a") && !row_text.includes("hall b")) return;
                }

                if (!col0 && !col1 && !col2 && !col3 && !colTitle) return;

                if (isHallC) {
                    let time_raw = (col1 && col2) ? `${col1} - ${col2}` : (col1 || col2 || "");
                    let topic = col3;
                    if (!topic && !time_raw) return; 
                    if (!topic) topic = "Session"; 
                    let display_time = convertTo12HourFormat(time_raw);

                    if (breakRegex.test(topic.toLowerCase())) {
                        let text = topic;
                        if (topic.toLowerCase().includes("registration")) text = "Registration";
                        else if (topic.toLowerCase().includes("lunch")) text = "Lunch";
                        else if (topic.toLowerCase().includes("coffee") || topic.toLowerCase().includes("tea")) text = "Tea / Coffee Break";
                        events.push({ type: 'break', title: text, time: time_raw, display_time: display_time, speaker: '', hall: hallTitle, parent_session: '', adLink: '' });
                    } else {
                        events.push({ type: 'presentation', time: time_raw, display_time: display_time, tag: '', title: topic, speaker: '', hall: hallTitle, parent_session: '' });
                    }
                    return;
                }

                let isBreakOrAd = breakRegex.test(row_text) && !row_text.includes("symposium") && !row_text.includes("session");
                if (isBreakOrAd) {
                    let text = colTitle || col3 || col0;
                    if (row_text.includes("registration")) text = "Registration";
                    else if (row_text.includes("lunch")) text = "Lunch";
                    else if (/\btea\b|\bcoffee\b/.test(row_text) && !row_text.includes("sponsor") && !row_text.includes("ad")) text = "Tea / Coffee Break";

                    let time_raw = (col1 && col2) ? `${col1} - ${col2}` : (col1 || col0);
                    let display_time = convertTo12HourFormat(time_raw);
                    let adLink = r.find(c => c.toLowerCase().includes('http')) || "";
                    events.push({ type: 'break', title: text, time: time_raw, display_time: display_time, speaker: '', hall: hallTitle, parent_session: '', adLink: adLink });
                    return;
                }

                let isQA = col3.toLowerCase().includes("q&a") || colTitle.toLowerCase().includes("discussion");
                let isPlenary = col3.toLowerCase().includes("plenary") || colTitle.toLowerCase().includes("plenary");
                let isSession = false, isOration = false;

                if (row_text.includes('oration')) { isSession = true; isOration = true; } 
                else if (!isQA && !isPlenary) {
                    if (!col1 && !col2 && !col0) isSession = true; 
                    else if (!col0 && col1 && col2 && !colTitle) isSession = true; 
                    else if (col3 && !colTitle && !colSpeaker) isSession = true; 
                    else if (row_text.includes('symposium') || row_text.includes('session') || row_text.includes('workshop')) isSession = true;
                }

                if (isSession) {
                    let topic = colTitle || col3 || (isOration ? "Oration" : "Session");
                    if (colTitle && col3 && colTitle.toLowerCase() !== col3.toLowerCase()) {
                        if (colTitle.toLowerCase().includes(col3.toLowerCase())) topic = colTitle;
                        else if (col3.toLowerCase().includes(colTitle.toLowerCase())) topic = col3;
                        else topic = col3 + ": " + colTitle;
                    }
                    let chairsArr = [isOration ? "" : colSpeaker, colChair1, colChair2, colChair3].filter(c => c && !["nan", "speaker", "chairperson"].includes(c.toLowerCase()));
                    current_session = topic; 
                    let time_raw = (col1 && col2) ? `${col1} - ${col2}` : (col1 || col0);
                    let display_time = convertTo12HourFormat(time_raw);
                    events.push({ type: 'session', isOration: isOration, time: time_raw, display_time: display_time, title: topic, speaker: isOration ? (colSpeaker || "") : chairsArr.join(", "), hall: hallTitle, parent_session: current_session });
                    return;
                }

                if (col1 || colTitle || isQA || isPlenary) {
                    let speaker = ["nan", "tbd"].includes(colSpeaker.toLowerCase()) ? "" : colSpeaker;
                    let time_raw = (col1 && col2) ? `${col1} - ${col2}` : (col1 || col0);
                    if (col0 && !col0.toLowerCase().includes('duration')) { time_raw = time_raw ? `${time_raw} (${col0.trim()})` : col0.trim(); }
                    let display_time = convertTo12HourFormat(time_raw);
                    let displayTitle = (isQA && !colTitle) ? col3 : (colTitle || col3);
                    events.push({ type: 'presentation', time: time_raw, display_time: display_time, tag: (isQA && !colTitle) ? "Discussion" : col3, title: displayTitle, speaker: speaker, hall: hallTitle, parent_session: current_session });
                }
            });
            return events;
        }

        function parseTimeToMinutes(timeStr) {
            if (!timeStr) return null;
            const parts = cleanText(timeStr).split('-')[0].trim().split(/[.:]/);
            if (parts.length < 2) return null;
            return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
        }

        window.subscribeToHall = function(hall_id) {
            if (window.currentSubscription) supabaseClient.removeChannel(window.currentSubscription);
            
            supabaseClient.from('hall_states').select('override_index, quiz_start_time, force_leaderboard').eq('hall_id', hall_id).single().then(({ data }) => {
                if (data) { 
                    remoteOverrideIndex = data.override_index; 
                    quizStartTimeStamp = data.quiz_start_time;
                    let boardType = data.force_leaderboard;
                    if (boardType && boardType !== 'none') window.showLeaderboard(boardType);
                    else window.hideLeaderboard(); 
                }
                lastRenderHash = ""; 
                window.updateLiveDisplay(true);
            });

            window.currentSubscription = supabaseClient.channel('delegate-feed-' + hall_id)
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'hall_states', filter: `hall_id=eq.${hall_id}` },
                    (payload) => { 
                        remoteOverrideIndex = payload.new.override_index; 
                        quizStartTimeStamp = payload.new.quiz_start_time;
                        let boardType = payload.new.force_leaderboard;
                        if (boardType && boardType !== 'none') window.showLeaderboard(boardType);
                        else window.hideLeaderboard();
                        lastRenderHash = ""; 
                        window.updateLiveDisplay(true); 
                    }
                ).subscribe();
        };

        function getLiveStatus(events) {
            const playableEvents = events.filter(e => {
                if (e.type === 'presentation' || e.type === 'break') return true;
                if (e.isOration && (e.speaker || '').trim() !== '') return true; 
                return false;
            });
            
            if (remoteOverrideIndex !== null) {
                if (remoteOverrideIndex < 0 && globalQuizzes.length > 0) {
                    return { currentEvent: globalQuizzes[Math.abs(remoteOverrideIndex) - 1], nextEvent: playableEvents[0] || null };
                }
                return { currentEvent: playableEvents[remoteOverrideIndex] || null, nextEvent: playableEvents[remoteOverrideIndex + 1] || null };
            }
            
            const now = new Date();
            const currentMins = now.getHours() * 60 + now.getMinutes();
            let currentEvent = null, nextEvent = null;
            
            for (let i = 0; i < playableEvents.length; i++) {
                const ev = playableEvents[i];
                const evStart = parseTimeToMinutes(ev.time);
                let evEnd = null;
                if (ev.time && ev.time.includes('-')) {
                    let parts = ev.time.split('-');
                    if (parts.length > 1) {
                        evEnd = parseTimeToMinutes(parts[1]);
                    }
                }
                if (evEnd === null && evStart !== null) {
                    evEnd = evStart + 15;
                }
                
                if (evStart !== null && evEnd !== null) {
                    if (currentMins >= evStart && currentMins < evEnd) {
                        currentEvent = ev; 
                        if (ev.type === 'break' && i > 0 && playableEvents[i-1].type !== 'break') { 
                            currentEvent = playableEvents[i-1]; 
                        }
                        if (i + 1 < playableEvents.length) {
                            nextEvent = playableEvents[i + 1]; 
                        }
                        break;
                    } else if (currentMins < evStart) { 
                        nextEvent = ev; 
                        break; 
                    }
                }
            }
            
            if (!currentEvent && playableEvents.length > 0) {
                currentEvent = playableEvents[playableEvents.length - 1];
            }
            
            return { currentEvent, nextEvent };
        }

        async function fetchMathLeaderboard(type) {
            try {
                const { data, error } = await supabaseClient.from('quiz_responses').select('*').order('created_at', { ascending: true });
                if (error) throw error;
                
                let filteredData = data;
                let titleText = "";

                if (type === '22a') { filteredData = data.filter(d => d.hall_id === '22a'); titleText = "Day 1: Hall A Leaderboard"; }
                else if (type === '22b') { filteredData = data.filter(d => d.hall_id === '22b'); titleText = "Day 1: Hall B Leaderboard"; }
                else if (type === '22c') { filteredData = data.filter(d => d.hall_id === '22c'); titleText = "Day 1: Hall C Leaderboard"; }
                else if (type === 'day1_cum') { filteredData = data.filter(d => ['22a','22b','22c'].includes(d.hall_id)); titleText = "Day 1 Cumulative Leaders"; }
                else if (type === '23a') { filteredData = data.filter(d => d.hall_id === '23a'); titleText = "Day 2: Hall A Leaderboard"; }
                else if (type === '23b') { filteredData = data.filter(d => d.hall_id === '23b'); titleText = "Day 2: Hall B Leaderboard"; }
                else if (type === '23c') { filteredData = data.filter(d => d.hall_id === '23c'); titleText = "Day 2: Hall C Leaderboard"; }
                else if (type === 'day2_cum') { filteredData = data.filter(d => ['23a','23b','23c'].includes(d.hall_id)); titleText = "Day 2 Cumulative Leaders"; }
                else { titleText = "Grand Conference Leaderboard"; }

                let scores = {};
                let names = {};
                filteredData.forEach(r => { 
                    scores[r.phone] = 0; 
                    if (r.name && !names[r.phone]) names[r.phone] = r.name;
                }); 
                
                let qGroups = {};
                filteredData.forEach(r => {
                    if (!r.is_correct) return;
                    let key = r.hall_id + "_" + r.question; 
                    if (!qGroups[key]) qGroups[key] = [];
                    if (!qGroups[key].some(x => x.phone === r.phone)) { qGroups[key].push(r); }
                });
                
                Object.values(qGroups).forEach(responses => {
                    responses.forEach((r, idx) => { scores[r.phone] += Math.max(10 - idx, 1); });
                });
                
                let sorted = Object.entries(scores).sort((a,b) => b[1] - a[1]);
                return { sorted, titleText, names };
            } catch(e) { return { sorted: [], titleText: "Error Loading Board", names: {} }; }
        }

                                    labelMarker = '<span class="bg-emerald-500 text-slate-950 px-3 py-1 rounded-md text-[10px] font-black uppercase tracking-wider ml-auto shadow"><i class="fas fa-check mr-1"></i> Correct</span>';
                                } else if (isCor && !isSel) {
                                    itemClass = "bg-amber-500/20 border-amber-500 text-amber-200 font-black ring-2 ring-amber-400/50";
                                    labelMarker = '<span class="bg-amber-500 text-slate-950 px-3 py-1 rounded-md text-[10px] font-black uppercase tracking-wider ml-auto shadow"><i class="fas fa-check mr-1"></i> Correct Answer</span>';
                                } else if (!isCor && isSel) {
                                    itemClass = "bg-rose-900/40 border-rose-500 text-rose-300 font-bold ring-1 ring-rose-500/50";
                                    labelMarker = '<span class="bg-rose-600 text-white px-3 py-1 rounded-md text-[10px] font-black uppercase tracking-wider ml-auto shadow"><i class="fas fa-times mr-1"></i> Incorrect</span>';
                                } else {
                                    itemClass = "bg-slate-900/40 border-slate-800 text-slate-500 line-through opacity-50";
                                }

                                return `<div class="border p-4 rounded-2xl text-sm flex items-center ${itemClass}"><span class="bg-slate-950 px-3 py-1 rounded mr-4 font-mono text-sm">${String.fromCharCode(65+idx)}</span>${opt}${labelMarker}</div>`;
                            }).join('');

                            let top5Nodes = top5.map((item, idx) => {
                                let name = mathResults.names[item[0]] || 'Delegate';
                                let last4 = item[0].length >= 4 ? item[0].slice(-4) : item[0];
                                return `
                                    <div class="flex justify-between items-center text-sm font-bold text-slate-300 bg-slate-800/50 px-4 py-2.5 rounded-lg border border-slate-700/50">
                                        <span class="truncate pr-2"><span class="${idx===0?'text-amber-400':idx===1?'text-slate-300':idx===2?'text-amber-700':'text-indigo-400'} mr-2">#${idx+1}</span> ${name} <span class="text-slate-400 font-mono text-xs">(••••${last4})</span></span>
                                        <span class="text-emerald-400 font-black tracking-wide flex-shrink-0">${item[1]} pts</span>
                                    </div>
                                `;
                            }).join('');

                            injectPoint.innerHTML = `
                                <div class="bg-slate-950 rounded-3xl border-2 border-red-600/40 p-6 sm:p-8 shadow-2xl mb-8">
                                    <span class="bg-red-600 text-white px-4 py-1.5 rounded-full text-xs font-black uppercase tracking-wider mb-6 inline-block shadow"><i class="fas fa-stopwatch mr-2"></i> Time Up!</span>
                                    <h3 class="text-xl font-bold text-slate-300 mb-6 leading-snug">${currentEvent.title}</h3>
                                    <div class="flex flex-col gap-3 mb-8">${optionNodes}</div>
                                    
                                    <div class="bg-gradient-to-br from-slate-900 to-slate-950 border border-slate-700/80 rounded-2xl p-5 sm:p-6 shadow-inner relative overflow-hidden">
                                        <div class="absolute top-0 right-0 w-32 h-32 bg-amber-500/5 rounded-full blur-3xl"></div>
                                        <h4 class="text-amber-500 font-black text-sm uppercase tracking-widest mb-4 flex items-center"><i class="fas fa-trophy mr-3 text-lg"></i>Live Hall Results</h4>
                                        <div class="flex flex-col gap-2 relative z-10">${top5Nodes}</div>
                                        ${myRank > 4 ? `
                                            <div class="mt-5 pt-4 border-t border-slate-700/80 text-sm text-white font-black flex justify-between items-center bg-slate-800/80 px-4 py-3 rounded-xl border border-slate-600 shadow-lg relative z-10">
                                                <span>🎯 YOUR RANK: <span class="text-amber-400 ml-1">#${myRank+1}</span></span>
                                                <span class="text-emerald-400">${sorted[myRank][1]} pts</span>
                                            </div>
                                        ` : (myRank !== -1 ? `
                                            <div class="mt-5 pt-4 border-t border-slate-700/80 text-sm text-emerald-400 font-black text-center bg-emerald-900/20 px-4 py-3 rounded-xl border border-emerald-500/30 relative z-10">
                                                🎯 Incredible! You are currently in the Top 5!
                                            </div>
                                        ` : '')}
                                    </div>
                                </div>`;
                        }, 50);
                    }
                } else if (currentEvent.type === 'break') {
                    if (currentEvent.adLink) {
                        let link = currentEvent.adLink, media = '';
                        if (link.includes('youtube.com') || link.includes('youtu.be')) {
                            let ytMatch = link.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
                            if (ytMatch) media = `<iframe class="w-full aspect-video rounded-3xl shadow-2xl border border-slate-700 pointer-events-none" src="https://www.youtube.com/embed/${ytMatch[1]}?autoplay=1&mute=1&loop=1&playlist=${ytMatch[1]}&controls=0&showinfo=0&modestbranding=1" frameborder="0" allow="autoplay; encrypted-media"></iframe>`;
                        } else if (link.includes('drive.google.com')) {
                            let fId = link.match(/[-\w]{25,}/);
                            if (fId) media = `<img src="https://lh3.googleusercontent.com/d/${fId[0]}" class="w-full h-auto max-h-[50vh] object-contain rounded-3xl bg-black border border-slate-700 shadow-2xl">`;
                        } else { media = `<img src="${link}" class="w-full h-auto max-h-[50vh] object-contain rounded-3xl bg-black border border-slate-700 shadow-2xl">`; }

                        html = `<div class="mb-8 p-6 sm:p-8 bg-slate-800 rounded-3xl border border-slate-700 shadow-2xl"><div class="flex items-center justify-between mb-6"><span class="bg-amber-500 text-slate-900 px-5 py-2 rounded-full text-sm font-black uppercase tracking-wider shadow"><i class="fas fa-play-circle mr-2"></i> ${currentEvent.title}</span><span class="text-xl font-bold text-slate-400 bg-slate-900 px-4 py-1.5 rounded-lg border border-slate-700 shadow-inner">${currentEvent.display_time}</span></div>${media}</div>`;
                    } else {
                        let breakIcon = "fa-coffee", iconColor = "text-amber-500";
                        const lowTitle = currentEvent.title.toLowerCase();
                        if (lowTitle.includes('lunch')) { breakIcon = "fa-utensils"; iconColor = "text-emerald-500"; }
                        else if (lowTitle.includes('banquet') || lowTitle.includes('dinner')) { breakIcon = "fa-glass-cheers"; iconColor = "text-purple-500"; }
                        else if (lowTitle.includes('registration')) { breakIcon = "fa-id-badge"; iconColor = "text-blue-400"; }

                        html = `<div class="text-center py-24 bg-slate-800/50 rounded-3xl border border-slate-700 my-8 shadow-inner"><i class="fas ${breakIcon} text-7xl sm:text-8xl mb-8 ${iconColor} animate-pulse drop-shadow-lg"></i><h2 class="text-4xl sm:text-5xl font-black text-white uppercase tracking-widest">${currentEvent.title}</h2><p class="text-2xl text-slate-400 mt-4 font-semibold">${currentEvent.display_time}</p></div>`;
                    }
                } else {
                    let bStyle = currentEvent.isOration ? "bg-rose-600" : "bg-indigo-600";
                    let pSess = currentEvent.parent_session && currentEvent.parent_session !== currentEvent.title && !currentEvent.parent_session.toLowerCase().includes('oration') ? `<div class="text-indigo-400 font-bold uppercase text-sm sm:text-base mb-3 flex items-center tracking-wider"><i class="fas fa-layer-group mr-2"></i>${currentEvent.parent_session}</div>` : '';
                    
                    html = `
                        <div class="bg-gradient-to-br from-slate-800 to-slate-800/80 border-2 border-slate-700/80 rounded-3xl p-6 sm:p-10 shadow-2xl mb-8">
                            <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
                                <span class="${bStyle} px-4 py-1.5 rounded-full text-xs sm:text-sm font-black uppercase tracking-widest flex items-center shadow-lg"><span class="w-2 h-2 sm:w-2.5 sm:h-2.5 bg-white rounded-full mr-2 sm:mr-2.5 animate-pulse"></span> LIVE NOW</span>
                                <span class="text-lg sm:text-xl font-bold text-slate-300 bg-slate-900/60 px-4 py-1.5 rounded-xl border border-slate-700/50 shadow-inner"><i class="far fa-clock mr-2 text-indigo-400"></i>${currentEvent.display_time}</span>
                            </div>
                            ${pSess}
                            <h1 class="text-3xl sm:text-4xl lg:text-5xl font-black text-white leading-tight mb-8">${currentEvent.title}</h1>
                            ${currentEvent.speaker ? `
                                <div class="flex items-center bg-slate-900/90 p-4 sm:p-5 rounded-2xl border border-slate-700/80 shadow-inner inline-flex max-w-full">
                                    <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-xl bg-indigo-500/20 text-indigo-400 flex items-center justify-center text-2xl mr-4 flex-shrink-0 border border-indigo-500/30">
                                        <i class="fas fa-microphone"></i>
                                    </div>
                                    <div>
                                        <span class="block text-[10px] sm:text-xs uppercase tracking-widest text-slate-400 font-bold mb-0.5">Speaker</span>
                                        <span class="text-lg sm:text-2xl font-extrabold text-white leading-snug">${currentEvent.speaker}</span>
                                    </div>
                                </div>
                            ` : ''}
                        </div>`;
                }
            }

            let upNextHtml = '';
            if (nextEvent && nextEvent.type !== 'quiz') {
                upNextHtml = `
                    <div class="bg-slate-800/40 border border-slate-700/60 rounded-2xl p-6 sm:p-8 flex flex-col sm:flex-row sm:items-center justify-between gap-4 shadow-lg mb-4">
                        <div class="flex-1"><span class="text-xs font-black uppercase tracking-widest text-amber-400 block mb-1.5 flex items-center"><i class="fas fa-step-forward mr-2"></i>Coming Up Next &bull; ${nextEvent.display_time}</span><h4 class="text-xl sm:text-2xl font-bold text-slate-200 leading-snug">${nextEvent.title}</h4>${nextEvent.speaker ? `<p class="text-slate-400 font-semibold text-base mt-2 flex items-center"><i class="fas fa-user-md mr-2 text-indigo-400"></i>${nextEvent.speaker}</p>` : ''}</div>
                        <div class="sm:text-right flex-shrink-0"><span class="inline-block bg-slate-800 text-slate-400 font-bold text-xs px-3 py-1.5 rounded-lg border border-slate-700 uppercase tracking-wider shadow-inner">${nextEvent.type === 'break' ? 'Break' : 'Session'}</span></div>
                    </div>`;
            }

            document.getElementById('dynamicContentWrapper').innerHTML = html + upNextHtml;
        };

        window.initLiveDashboard = function() { 
            supabaseClient.channel('global-radar-feed')
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'hall_states' }, (payload) => {
                    let changedHall = payload.new.hall_id;
                    let oIdx = payload.new.override_index;
                    let lBoard = payload.new.force_leaderboard;
                    
                    if (changedHall === liveHall) {
                        if (lBoard && lBoard !== 'none') window.showLeaderboard(lBoard);
                        else window.hideLeaderboard();
                    } else {
                        if (oIdx !== null && oIdx < 0) {
                            document.getElementById('hijackMessage').innerText = `A high-stakes quiz is running in another hall!`;
                            document.getElementById('hijackJoinBtn').onclick = () => window.switchDelegateHall(changedHall);
                            document.getElementById('globalHijackOverlay').classList.remove('hidden');
                        } else if (oIdx === null || oIdx >= 0) {
                            document.getElementById('globalHijackOverlay').classList.add('hidden');
                        }
                    }
                }).subscribe();

            if (liveUpdateTimer) clearInterval(liveUpdateTimer);
            if (tickerTimer) clearInterval(tickerTimer);

            liveUpdateTimer = setInterval(() => {
                if (remoteOverrideIndex === null || remoteOverrideIndex >= 0) { window.updateLiveDisplay(false); }
                window.updatePersistentFooter(); 
            }, 15000); 
            
            tickerTimer = setInterval(() => {
                let clk = document.getElementById('liveDigitalClock');
                if(clk) clk.innerText = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });

                if (remoteOverrideIndex !== null && remoteOverrideIndex < 0 && quizStartTimeStamp) {
                    let diff = Math.floor((new Date() - new Date(quizStartTimeStamp)) / 1000);
                    let secondsLeft = Math.max(0, 45 - diff);
                    
                    if (secondsLeft <= 0) {
                        if (!window.quizExpiredRendered) {
                            window.quizExpiredRendered = true;
                            window.updateLiveDisplay(true); 
                        }
                    } else {
                        window.quizExpiredRendered = false;
                        let timerEl = document.getElementById('quizCountdownTimer');
                        if (timerEl && timerEl.dataset.expired === "false") {
                            timerEl.innerHTML = `<i class="fas fa-hourglass-half mr-2 animate-spin"></i>${secondsLeft}s`;
                        }
                    }
                } else {
                    window.quizExpiredRendered = false;
                }
            }, 1000);
            
            window.subscribeToHall(liveHall); 
            window.updatePersistentFooter();
        };

        async function bootApp() {
            try {
                window.refreshIdentityStateUI();
                try { await window.syncMyAnswers(); } catch(e){}
                document.getElementById('liveDigitalClock').innerText = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
                
                const cachedData = localStorage.getItem(CACHE_KEY);
                if (cachedData) {
                    let parsed = JSON.parse(cachedData);
                    appData = parsed.halls || {};
                    globalQuizzes = parsed.quizzes || [];
                    document.getElementById('loadingState').classList.add('hidden');
                    document.getElementById('staticHeader').classList.remove('hidden');
                    window.initLiveDashboard();
                    window.fetchLiveSchedule(true);
                } else { 
                    window.fetchLiveSchedule(false); 
                }
            } catch(e) {
                console.error("Boot Error", e);
                window.fetchLiveSchedule(false);
            }
        }

        bootApp();
    </script>
</body>
</html>
