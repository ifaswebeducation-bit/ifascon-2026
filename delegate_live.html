<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IFASCON 2026 - Live</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .animate-live { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 font-sans selection:bg-indigo-500/30 min-h-screen flex flex-col hide-scrollbar">

    <div id="globalHijackOverlay" class="hidden fixed inset-0 z-[100] bg-slate-950/95 backdrop-blur-xl flex flex-col items-center justify-center p-6">
        <div class="bg-gradient-to-br from-rose-900/40 to-slate-900 border border-rose-500/30 p-8 sm:p-12 rounded-3xl text-center max-w-lg shadow-[0_0_50px_rgba(225,29,72,0.15)]">
            <i class="fas fa-exclamation-triangle text-6xl text-rose-500 mb-6 animate-pulse"></i>
            <h2 class="text-3xl font-black text-white mb-4">Quiz Hijack!</h2>
            <p id="hijackMessage" class="text-xl text-slate-300 mb-8 font-semibold"></p>
            <button id="hijackJoinBtn" class="w-full max-w-sm bg-rose-600 hover:bg-rose-500 text-white text-xl font-black px-6 py-4 rounded-2xl shadow-[0_0_20px_rgba(225,29,72,0.5)] transition mb-4">Jump to Hall & Play</button>
            <button onclick="document.getElementById('globalHijackOverlay').classList.add('hidden')" class="text-slate-500 underline font-semibold">Ignore, stay in current hall</button>
        </div>
    </div>

    <div id="leaderboardModal" class="hidden fixed inset-0 z-[80] bg-slate-950/95 backdrop-blur-xl flex flex-col">
        <div class="p-6 bg-slate-900/80 border-b border-slate-800 flex justify-between items-center sticky top-0 z-10 shadow-lg">
            <div>
                <h2 id="lbTitle" class="text-2xl font-black text-white uppercase tracking-widest"><i class="fas fa-trophy mr-3 text-amber-400"></i>Live Leaderboard</h2>
                <p id="lbSub" class="text-slate-400 text-sm mt-1"></p>
            </div>
            <button onclick="document.getElementById('leaderboardModal').classList.add('hidden')" class="w-10 h-10 bg-slate-800 rounded-full flex items-center justify-center text-slate-400 hover:text-white transition"><i class="fas fa-times text-xl"></i></button>
        </div>
        <div id="leaderboardList" class="flex-1 overflow-y-auto p-4 sm:p-8 space-y-3 pb-32">
            </div>
    </div>

    <div id="loadingState" class="fixed inset-0 z-[60] flex flex-col items-center justify-center p-6 bg-slate-950">
        <div class="w-16 h-16 border-4 border-slate-800 border-t-indigo-500 rounded-full animate-spin mb-6 shadow-[0_0_30px_rgba(99,102,241,0.2)]"></div>
        <p class="text-indigo-400 font-semibold text-lg animate-pulse" id="loadingText">Loading Conference Dashboard...</p>
    </div>

    <div id="staticHeader" class="hidden flex flex-col shrink-0 sticky top-0 z-40 shadow-xl bg-slate-950/80 backdrop-blur-md border-b border-slate-800">
        <div class="flex justify-between items-center px-4 py-2 bg-indigo-950/30 border-b border-indigo-900/50">
            <div id="identityLoggedOutState" class="flex items-center gap-2">
                <input type="tel" id="topPhoneRegisterInput" class="bg-slate-900 border border-slate-700 rounded text-white px-2 py-1 text-xs w-32 outline-none focus:border-indigo-500" placeholder="Mobile Number">
                <button onclick="window.saveTopBannerIdentity()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1 rounded text-xs font-bold transition">Login to Play</button>
            </div>
            <div id="identityLoggedInState" class="hidden flex items-center">
                <span class="text-emerald-400 text-xs font-bold flex items-center bg-emerald-900/30 px-2.5 py-1 rounded-full border border-emerald-800/50"><i class="fas fa-user-check mr-1.5"></i> <span id="identityBannerLabel"></span></span>
                <button onclick="window.clearDelegateIdentity()" class="ml-3 text-[10px] text-slate-500 underline">Logout</button>
            </div>
            <div class="text-slate-400 font-mono text-sm font-bold bg-slate-900 px-3 py-1 rounded shadow-inner border border-slate-800" id="liveDigitalClock">--:--</div>
        </div>

        <div class="px-2 py-3 overflow-x-auto hide-scrollbar whitespace-nowrap border-b border-slate-800 flex items-center gap-2">
            <span class="text-xs font-black uppercase text-slate-500 tracking-widest pl-2 mr-2 sticky left-0 bg-slate-950/90 py-1 pr-2"><i class="fas fa-broadcast-tower mr-1"></i> Live</span>
            
            <button onclick="switchDelegateHall('ao_seminar')" data-hall="ao_seminar" class="feed-btn px-3 py-1.5 rounded-lg text-xs font-bold transition-colors flex-shrink-0">21 Aug: AO Sem</button>
            <button onclick="switchDelegateHall('workshop_diabetic')" data-hall="workshop_diabetic" class="feed-btn px-3 py-1.5 rounded-lg text-xs font-bold transition-colors flex-shrink-0">21 Aug: Diabetic Foot</button>
            <button onclick="switchDelegateHall('workshop_mis')" data-hall="workshop_mis" class="feed-btn px-3 py-1.5 rounded-lg text-xs font-bold transition-colors flex-shrink-0">21 Aug: MIS</button>
            
            <button onclick="switchDelegateHall('22a')" data-hall="22a" class="feed-btn px-3 py-1.5 rounded-lg text-xs font-bold transition-colors flex-shrink-0">22 Aug: Hall A</button>
            <button onclick="switchDelegateHall('22b')" data-hall="22b" class="feed-btn px-3 py-1.5 rounded-lg text-xs font-bold transition-colors flex-shrink-0">22 Aug: Hall B</button>
            <button onclick="switchDelegateHall('22c')" data-hall="22c" class="feed-btn px-3 py-1.5 rounded-lg text-xs font-bold transition-colors flex-shrink-0">22 Aug: Hall C</button>
            
            <button onclick="switchDelegateHall('23a')" data-hall="23a" class="feed-btn px-3 py-1.5 rounded-lg text-xs font-bold transition-colors flex-shrink-0">23 Aug: Hall A</button>
            <button onclick="switchDelegateHall('23b')" data-hall="23b" class="feed-btn px-3 py-1.5 rounded-lg text-xs font-bold transition-colors flex-shrink-0">23 Aug: Hall B</button>
            <button onclick="switchDelegateHall('23c')" data-hall="23c" class="feed-btn px-3 py-1.5 rounded-lg text-xs font-bold transition-colors flex-shrink-0">23 Aug: Hall C</button>
        </div>
        
        <div class="px-5 py-4">
            <h3 class="text-indigo-500 font-black uppercase text-xs tracking-[0.2em] mb-1" id="headerSub"></h3>
            <h1 class="text-2xl font-black text-white tracking-tight font-sans" id="headerTitle"></h1>
        </div>
    </div>

    <div class="flex-1 overflow-y-auto p-4 sm:p-6 pb-32 w-full max-w-4xl mx-auto" id="dynamicContentWrapper">
        </div>

    <div id="persistentLeaderboard" class="fixed bottom-0 left-0 right-0 bg-slate-950 border-t border-slate-800 p-3 sm:p-4 text-center z-40 overflow-x-auto hide-scrollbar whitespace-nowrap flex items-center justify-start sm:justify-center text-xs sm:text-sm shadow-[0_-10px_30px_rgba(2,6,23,0.8)]">
        </div>

    <script>
        const supabaseUrl = 'YOUR_SUPABASE_URL_HERE';
        const supabaseKey = 'YOUR_SUPABASE_KEY_HERE';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        const sheetLinks = {
            'quizzes': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTSXW-U_qQZinazbfDmwxFT4VdZ_3OzNaBH29daT9Vm0pzwHu9kVZUTNK5stzUkfvp6gTKbIoM6KH1k/pub?gid=0&single=true&output=csv',
            'ao': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTRQ3g-iv-ZNPmsFq_zInPnhzbraxuMfJNEHsUro3i7C_eNIHWmAc261FSqBcmuNFmDlLVl0-8jKNJ_/pub?gid=189655281&single=true&output=csv',
            '22a': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTRQ3g-iv-ZNPmsFq_zInPnhzbraxuMfJNEHsUro3i7C_eNIHWmAc261FSqBcmuNFmDlLVl0-8jKNJ_/pub?gid=0&single=true&output=csv',
            '22b': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTRQ3g-iv-ZNPmsFq_zInPnhzbraxuMfJNEHsUro3i7C_eNIHWmAc261FSqBcmuNFmDlLVl0-8jKNJ_/pub?gid=660947078&single=true&output=csv',
            '22c': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTRQ3g-iv-ZNPmsFq_zInPnhzbraxuMfJNEHsUro3i7C_eNIHWmAc261FSqBcmuNFmDlLVl0-8jKNJ_/pub?gid=127806642&single=true&output=csv',
            '23a': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTRQ3g-iv-ZNPmsFq_zInPnhzbraxuMfJNEHsUro3i7C_eNIHWmAc261FSqBcmuNFmDlLVl0-8jKNJ_/pub?gid=1579973346&single=true&output=csv',
            '23b': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTRQ3g-iv-ZNPmsFq_zInPnhzbraxuMfJNEHsUro3i7C_eNIHWmAc261FSqBcmuNFmDlLVl0-8jKNJ_/pub?gid=239334255&single=true&output=csv',
            '23c': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTRQ3g-iv-ZNPmsFq_zInPnhzbraxuMfJNEHsUro3i7C_eNIHWmAc261FSqBcmuNFmDlLVl0-8jKNJ_/pub?gid=1095375546&single=true&output=csv'
        };

        const configTitles = { 
            'ao_seminar': "21st August 2026 - AO Seminar",
            'workshop_diabetic': "21st August 2026 - Diabetic Foot", 
            'workshop_mis': "21st August 2026 - MIS Workshop", 
            '22a': "22nd August 2026 - Hall A", 
            '22b': "22nd August 2026 - Hall B", 
            '22c': "22nd August 2026 - Hall C", 
            '23a': "23rd August 2026 - Hall A", 
            '23b': "23rd August 2026 - Hall B", 
            '23c': "23rd August 2026 - Hall C" 
        };

        const buttonLabels = { 
            'ao_seminar': "AO Sem",
            'workshop_diabetic': "Diabetic", 
            'workshop_mis': "MIS", 
            '22a': "Hall A", 
            '22b': "Hall B", 
            '22c': "Hall C", 
            '23a': "Hall A", 
            '23b': "Hall B", 
            '23c': "Hall C" 
        };

        // 1. --- CORE UTILS (Must run first) --- 
        function cleanText(val) { 
            return val ? val.toString().replace(/\u00A0/g, ' ').replace(/\s+/g, ' ').trim() : ""; 
        }

        function normalizeHallId(val) { 
            if (!val) return ""; 
            let str = cleanText(val).toLowerCase().replace(/[^a-z0-9]/g, '');
            if (str.includes('ao') || str.includes('sem')) return 'ao_seminar'; 
            if (str.includes('diabet')) return 'workshop_diabetic'; 
            if (str.includes('mis')) return 'workshop_mis'; 
            if (str.includes('22a') || (str.includes('22') && str.includes('a'))) return '22a';
            if (str.includes('22b') || (str.includes('22') && str.includes('b'))) return '22b'; 
            if (str.includes('22c') || (str.includes('22') && str.includes('c'))) return '22c';
            if (str.includes('23a') || (str.includes('23') && str.includes('a'))) return '23a'; 
            if (str.includes('23b') || (str.includes('23') && str.includes('b'))) return '23b';
            if (str.includes('23c') || (str.includes('23') && str.includes('c'))) return '23c'; 
            return str;
        }

        function parseTimeToMinutes(timeStr) {
            if (!timeStr) return null;
            const parts = cleanText(timeStr).split('-')[0].trim().split(/[.:]/);
            if (parts.length < 2) return null;
            return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
        }

        function checkIfCorrect(optionText, correctAnswer, index) { 
            let optClean = cleanText(optionText).toLowerCase(); 
            let corClean = cleanText(correctAnswer).toLowerCase(); 
            let letter = String.fromCharCode(65 + index).toLowerCase(); 
            return optClean === corClean || corClean === letter || corClean === `option ${letter}` || corClean === `option-${letter}` || corClean === `${letter}.` || corClean === `(${letter})`; 
        }

        // --- STATE VARIABLES ---
        let remoteOverrideIndex = null; 
        let quizStartTimeStamp = null; 
        let tickerTimer = null;
        let liveUpdateTimer = null; 
        let lastRenderHash = "";
        let liveHall = new URLSearchParams(window.location.search).get('hall') ? normalizeHallId(new URLSearchParams(window.location.search).get('hall')) : '22a';
        const CACHE_KEY = 'ifascon_schedule_cache_delegate_v87';
        let appData = {}; 
        let globalQuizzes = [];

        // --- AMNESIA FIX & SYNC --- 
        window.syncMyAnswers = async function() { 
            let phone = localStorage.getItem('delegate_phone');
            if(!phone) return; 
            const { data } = await supabaseClient.from('quiz_responses').select('question, hall_id').eq('phone', phone); 
            if(data) { 
                data.forEach(d => { 
                    let cleanKey = (d.hall_id + "" + d.question).replace(/\W/g, '');
                    localStorage.setItem('answered' + cleanKey, 'true'); 
                });
            } 
        };

        window.refreshIdentityStateUI = function() { 
            let num = localStorage.getItem('delegate_phone'); 
            let loggedInView = document.getElementById('identityLoggedInState');
            let loggedOutView = document.getElementById('identityLoggedOutState'); 
            if (num && loggedInView && loggedOutView) { 
                loggedOutView.classList.add('hidden');
                loggedInView.classList.remove('hidden');
                document.getElementById('identityBannerLabel').innerText = num;
            } else if (loggedInView && loggedOutView) { 
                loggedInView.classList.add('hidden');
                loggedOutView.classList.remove('hidden'); 
            } 
        };

        window.saveTopBannerIdentity = async function() { 
            let val = document.getElementById('topPhoneRegisterInput').value.trim();
            if (val.length >= 7) { 
                localStorage.setItem('delegate_phone', val);
                window.refreshIdentityStateUI(); 
                await window.syncMyAnswers();
                window.updateLiveDisplay(true); 
                window.updatePersistentFooter(); 
            } else {
                alert('Please supply a valid telephone number.'); 
            } 
        };

        window.clearDelegateIdentity = function() {
            localStorage.removeItem('delegate_phone'); 
            window.refreshIdentityStateUI();
            window.updateLiveDisplay(true); 
            window.updatePersistentFooter(); 
        };

        // --- FETCH & PARSE WITH SMART CSV LOGIC --- 
        window.fetchLiveSchedule = async function(isBackground = false) { 
            let fetchedData = {};
            let quizzesLoaded = [];
            
            for (const [key, link] of Object.entries(sheetLinks)) { 
                if(!link || link.trim() === '') continue;
                try { 
                    const response = await fetch(link); 
                    if(!response.ok) continue; 
                    const csvText = await response.text();
                    let parsedCsv = Papa.parse(csvText, { header: false, skipEmptyLines: true }).data;

                    if (key === 'quizzes') { 
                        let colOffset = 0;
                        if (parsedCsv.length > 1) { 
                            let firstRow = parsedCsv[1]; let cell0 = cleanText(firstRow[0]); 
                            if (/^\d{1,4}$/.test(cell0) || cell0.includes('/')) colOffset = 1;
                        }
                        parsedCsv.forEach((r, idx) => { 
                            if (idx === 0 || !r || r.length < 3) return;
                            let rawHall = cleanText(r[0 + colOffset]); 
                            let rawSymp = cleanText(r[1 + colOffset]); 
                            let rawTitle = cleanText(r[2 + colOffset]);
                            if (!rawTitle || rawTitle.toLowerCase() === 'question' || rawTitle.toLowerCase() === 'title') return;
                            
                            quizzesLoaded.push({ 
                                hall_id: normalizeHallId(rawHall), 
                                symposium: rawSymp || 'General', 
                                title: rawTitle, 
                                options: [cleanText(r[3 + colOffset]), cleanText(r[4 + colOffset]), cleanText(r[5 + colOffset]), cleanText(r[6 + colOffset])].filter(Boolean), 
                                correct: cleanText(r[7 + colOffset]),
                                type: 'quiz'
                            });
                        }); 
                    } else if (key === 'ao') { 
                        const allAo = parseRawData(parsedCsv, "21 Aug");
                        let sem = [], dia = [], mis = []; 
                        let isWs = false, track = 'diabetic';
                        
                        allAo.forEach(ev => { 
                            let matchStr = `${ev.title} ${ev.time} ${ev.parent_session}`.toLowerCase(); 
                            if (/\b(workshop|16:15|16.15)\b/i.test(matchStr)) isWs = true; 
                            
                            if (isWs) { 
                                if (matchStr.includes('diabetic') || matchStr.includes('nebula')) track = 'diabetic'; 
                                else if (matchStr.includes('mis') || matchStr.includes('arthrex')) track = 'mis'; 
                                
                                if (track === 'diabetic') { ev.hall = "Diabetic Foot Hall"; dia.push(ev); } 
                                else { ev.hall = "MIS Hall"; mis.push(ev); } 
                            } else { 
                                ev.hall = "AO Seminar Hall"; sem.push(ev);
                            } 
                        });
                        
                        fetchedData['ao_seminar'] = { title: configTitles['ao_seminar'], events: sem };
                        fetchedData['workshop_diabetic'] = { title: configTitles['workshop_diabetic'], events: dia };
                        fetchedData['workshop_mis'] = { title: configTitles['workshop_mis'], events: mis }; 
                    } else { 
                        fetchedData[key] = { title: configTitles[key], events: parseRawData(parsedCsv, configTitles[key]) };
                    } 
                } catch(err) {} 
            }
            
            if(Object.keys(fetchedData).length === 0) {
                document.getElementById('loadingText').innerText = "Network Error. Check CSV Links."; 
                return; 
            }

            appData = fetchedData; 
            globalQuizzes = quizzesLoaded;
            localStorage.setItem(CACHE_KEY, JSON.stringify({ halls: appData, quizzes: globalQuizzes }));

            if (!isBackground && document.getElementById('loadingState')) {
                document.getElementById('loadingState').classList.add('hidden');
                document.getElementById('staticHeader').classList.remove('hidden');
                window.initLiveDashboard(); 
            } else { 
                window.updateLiveDisplay(true); 
            } 
        };

        function convertTo12HourFormat(timeStr) { 
            if (!timeStr) return ""; 
            if (/[aApP][mM]/.test(timeStr)) return timeStr; 
            return timeStr.replace(/\b([01]?[0-9]|2[0-3])[:.]([0-5][0-9])(?:[:.][0-9]{2})?\b/g, function(match, p1, p2) { 
                let h = parseInt(p1, 10); 
                let ampm = h >= 12 ? 'PM' : 'AM';
                h = h % 12; h = h ? h : 12;
                let paddedH = h < 10 ? '0' + h : h; 
                return paddedH + ':' + p2 + ' ' + ampm; 
            });
        }

        function parseRawData(rows, hallTitle) { 
            let events = [], current_session = "";
            const breakRegex = /\b(break|lunch|banquet|gbm|valedictory|inauguration|registration|tea|coffee|sponsor|commercial|ad|video)\b/;
            
            rows.forEach(r => { 
                while(r.length < 12) r.push(""); 
                r = r.map(x => cleanText(x)); 
                let col0 = r[0], col1 = r[1], col2 = r[2], col3 = r[3]; 
                let colTitle = r[4] || r[5] || "", colSpeaker = r[4] ? r[5] : r[6]; 
                let colChair1 = r[4] ? r[6] : r[7], colChair2 = r[4] ? r[7] : r[8], colChair3 = r[4] ? r[8] : r[9]; 
                let row_text = r.join(" ").toLowerCase();

                if (row_text.includes("position:absolute") || row_text.includes("docs-drivelogo") || row_text.includes("<!doctype html>")) return; 
                if (col0.toLowerCase().includes("duration") && col1.toLowerCase().includes("from")) return;
                if (hallTitle && !hallTitle.toLowerCase().includes('hall c')) { 
                    if (row_text.includes("hall c") && !row_text.includes("hall a") && !row_text.includes("hall b")) return;
                }

                if (!col0 && !col1 && !col2 && !col3 && !colTitle) return;

                let isBreakOrAd = breakRegex.test(row_text) && !row_text.includes("symposium") && !row_text.includes("session");
                
                if (isBreakOrAd) { 
                    let text = colTitle || col3 || col0; 
                    if (row_text.includes("registration")) text = "Registration"; 
                    else if (row_text.includes("lunch")) text = "Lunch"; 
                    else if (/\btea\b|\bcoffee\b/.test(row_text) && !row_text.includes("sponsor") && !row_text.includes("ad")) text = "Tea / Coffee Break";
                    
                    let time_raw = (col1 && col2) ? `${col1} - ${col2}` : (col1 || col0); 
                    let display_time = convertTo12HourFormat(time_raw);
                    let adLink = r.find(c => c.toLowerCase().includes('http')) || ""; 
                    events.push({ type: 'break', title: text, time: time_raw, display_time: display_time, speaker: '', hall: hallTitle, parent_session: '', adLink: adLink });
                    return; 
                }

                let isQA = col3.toLowerCase().includes("q&a") || colTitle.toLowerCase().includes("discussion"); 
                let isPlenary = col3.toLowerCase().includes("plenary") || colTitle.toLowerCase().includes("plenary"); 
                let isSession = false, isOration = false;

                if (row_text.includes('oration')) { isSession = true; isOration = true; } 
                else if (!isQA && !isPlenary) { 
                    if (!col1 && !col2 && !col0) isSession = true;
                    else if (!col0 && col1 && col2 && !colTitle) isSession = true; 
                    else if (col3 && !colTitle && !colSpeaker) isSession = true;
                    else if (row_text.includes('symposium') || row_text.includes('session') || row_text.includes('workshop')) isSession = true;
                }

                if (isSession) { 
                    let topic = colTitle || col3 || (isOration ? "Oration" : "Session"); 
                    if (colTitle && col3 && colTitle.toLowerCase() !== col3.toLowerCase()) { 
                        if (colTitle.toLowerCase().includes(col3.toLowerCase())) topic = colTitle;
                        else if (col3.toLowerCase().includes(colTitle.toLowerCase())) topic = col3; 
                        else topic = col3 + ": " + colTitle; 
                    }
                    
                    let chairsArr = [isOration ? "" : colSpeaker, colChair1, colChair2, colChair3].filter(c => c && !["nan", "speaker", "chairperson"].includes(c.toLowerCase())); 
                    current_session = topic;
                    let time_raw = (col1 && col2) ? `${col1} - ${col2}` : (col1 || col0); 
                    let display_time = convertTo12HourFormat(time_raw);
                    events.push({ type: 'session', isOration: isOration, time: time_raw, display_time: display_time, title: topic, speaker: isOration ? (colSpeaker || "") : chairsArr.join(", "), hall: hallTitle, parent_session: current_session });
                    return; 
                }

                if (col1 || colTitle || isQA || isPlenary) { 
                    let speaker = ["nan", "tbd"].includes(colSpeaker.toLowerCase()) ? "" : colSpeaker;
                    let time_raw = (col1 && col2) ? `${col1} - ${col2}` : (col1 || col0); 
                    if (col0 && !col0.toLowerCase().includes('duration')) { time_raw = time_raw ? `${time_raw} (${col0.trim()})` : col0.trim(); }

                    let display_time = convertTo12HourFormat(time_raw); 
                    let displayTitle = (isQA && !colTitle) ? col3 : (colTitle || col3); 
                    events.push({ type: 'presentation', time: time_raw, display_time: display_time, tag: (isQA && !colTitle) ? "Discussion" : col3, title: displayTitle, speaker: speaker, hall: hallTitle, parent_session: current_session });
                } 
            }); 
            return events; 
        }

        // --- NAVIGATION & Sync --- 
        window.switchDelegateHall = function(newHall) { 
            let radar = document.getElementById('quizRadarBanner'); 
            if (radar) radar.classList.add('hidden');

            let hijack = document.getElementById('globalHijackOverlay'); 
            if (hijack) hijack.classList.add('hidden');

            if (typeof window.hideLeaderboard === 'function') window.hideLeaderboard();

            liveHall = normalizeHallId(newHall); 
            remoteOverrideIndex = null;
            quizStartTimeStamp = null;
            lastRenderHash = "";

            try { 
                const newUrl = new URL(window.location); 
                newUrl.searchParams.set('hall', liveHall); 
                window.history.pushState({}, '', newUrl); 
            } catch (e) {}

            window.subscribeToHall(liveHall); 
            window.updateLiveDisplay(true);
            window.updatePersistentFooter();
        };

        window.subscribeToHall = function(hall_id) { 
            if (window.currentSubscription) supabaseClient.removeChannel(window.currentSubscription);

            supabaseClient.from('hall_states').select('override_index, quiz_start_time, force_leaderboard').eq('hall_id', hall_id).single().then(({ data }) => { 
                if (data) { 
                    remoteOverrideIndex = data.override_index; 
                    quizStartTimeStamp = data.quiz_start_time; 
                    if (typeof window.hideLeaderboard === 'function') window.hideLeaderboard(); 
                } 
                lastRenderHash = "";
                window.updateLiveDisplay(true); 
            });
            
            window.currentSubscription = supabaseClient.channel('delegate-feed-' + hall_id).on('postgres_changes', { 
                event: 'UPDATE', schema: 'public', table: 'hall_states', filter: `hall_id=eq.${hall_id}` 
            }, (payload) => {
                remoteOverrideIndex = payload.new.override_index; 
                quizStartTimeStamp = payload.new.quiz_start_time;

                let boardType = payload.new.force_leaderboard; 
                if (boardType && boardType !== 'none') {
                    if (typeof window.showLeaderboard === 'function') window.showLeaderboard(boardType); 
                } else {
                    if (typeof window.hideLeaderboard === 'function') window.hideLeaderboard();
                }

                lastRenderHash = ""; 
                window.updateLiveDisplay(true); 
            }).subscribe(); 
        };

        function getLiveStatus(events) { 
            const playableEvents = events.filter(e => { 
                if (e.type === 'presentation' || e.type === 'break') return true; 
                if (e.isOration && (e.speaker || '').trim() !== '') return true; 
                return false; 
            });
            
            if (remoteOverrideIndex !== null) { 
                if (remoteOverrideIndex < 0 && globalQuizzes.length > 0) { 
                    return { 
                        currentEvent: globalQuizzes[Math.abs(remoteOverrideIndex) - 1], 
                        nextEvent: playableEvents[0] || null 
                    }; 
                } 
                return { 
                    currentEvent: playableEvents[remoteOverrideIndex] || null, 
                    nextEvent: playableEvents[remoteOverrideIndex + 1] || null 
                }; 
            }

            const currentMins = new Date().getHours() * 60 + new Date().getMinutes();
            let currentEvent = null, nextEvent = null; 
            
            for (let i = 0; i < playableEvents.length; i++) { 
                const ev = playableEvents[i];
                const evStart = parseTimeToMinutes(ev.time); 
                let evEnd = null; 
                
                if (ev.time && ev.time.includes('-')) { 
                    let endParts = ev.time.split('-')[1].split('(')[0].trim().split(/[.:]/); 
                    if(endParts.length >= 2) evEnd = parseInt(endParts[0], 10) * 60 + parseInt(endParts[1], 10); 
                }
                if(evEnd === null && evStart !== null) evEnd = evStart + 15;

                if (evStart !== null && evEnd !== null) { 
                    if (currentMins >= evStart && currentMins < evEnd) { 
                        currentEvent = ev; 
                        if (ev.type === 'break' && i > 0 && playableEvents[i-1].type !== 'break') currentEvent = playableEvents[i-1];
                        if (i + 1 < playableEvents.length) nextEvent = playableEvents[i + 1]; 
                        break;
                    } else if (currentMins < evStart && !nextEvent) { 
                        nextEvent = ev; 
                    } 
                } 
            } 
            return { currentEvent, nextEvent };
        }

        async function fetchMathLeaderboard(type) { 
            try { 
                const { data, error } = await supabaseClient.from('quiz_responses').select('*').order('created_at', { ascending: true }); 
                if (error) throw error;
                
                let filteredData = data; 
                let titleText = "";

                if (type === '22a') { filteredData = data.filter(d => d.hall_id === '22a'); titleText = "Day 1: Hall A Leaderboard"; } 
                else if (type === '22b') { filteredData = data.filter(d => d.hall_id === '22b'); titleText = "Day 1: Hall B Leaderboard"; } 
                else if (type === '22c') { filteredData = data.filter(d => d.hall_id === '22c'); titleText = "Day 1: Hall C Leaderboard"; } 
                else if (type === 'day1_cum') { filteredData = data.filter(d => ['22a','22b','22c'].includes(d.hall_id)); titleText = "Day 1 Cumulative Leaders"; } 
                else if (type === '23a') { filteredData = data.filter(d => d.hall_id === '23a'); titleText = "Day 2: Hall A Leaderboard"; } 
                else if (type === '23b') { filteredData = data.filter(d => d.hall_id === '23b'); titleText = "Day 2: Hall B Leaderboard"; } 
                else if (type === '23c') { filteredData = data.filter(d => d.hall_id === '23c'); titleText = "Day 2: Hall C Leaderboard"; } 
                else if (type === 'day2_cum') { filteredData = data.filter(d => ['23a','23b','23c'].includes(d.hall_id)); titleText = "Day 2 Cumulative Leaders"; } 
                else { titleText = "Grand Conference Leaderboard"; }

                let scores = {}; 
                filteredData.forEach(r => { scores[r.phone] = 0; });

                let qGroups = {}; 
                filteredData.forEach(r => { 
                    if (!r.is_correct) return; 
                    let key = r.hall_id + "_" + r.question; 
                    if (!qGroups[key]) qGroups[key] = []; 
                    if (!qGroups[key].some(x => x.phone === r.phone)) { qGroups[key].push(r); } 
                });

                Object.values(qGroups).forEach(responses => { 
                    responses.forEach((r, idx) => { scores[r.phone] += Math.max(10 - idx, 1); }); 
                });

                let sorted = Object.entries(scores).sort((a,b) => b[1] - a[1]); 
                return { sorted, titleText }; 
            } catch(e) { 
                return { sorted: [], titleText: "Error Loading Board" }; 
            } 
        }

        window.submitDelegateQuiz = async function(encOpt, encCor, encTit, optIdx) { 
            let phone = localStorage.getItem('delegate_phone'); 
            if (!phone) { alert("Please login first to submit."); return; }

            let optionText = decodeURIComponent(encOpt);
            let correctAnswer = decodeURIComponent(encCor); 
            let questionText = decodeURIComponent(encTit);

            let cleanKey = (liveHall + "" + questionText).replace(/\W/g, '');
            localStorage.setItem('marked' + cleanKey, optionText);
            localStorage.setItem('answered_' + cleanKey, 'true');

            window.updateLiveDisplay(true);

            let isCorrect = checkIfCorrect(optionText, correctAnswer, optIdx);
            
            try { 
                await supabaseClient.from('quiz_responses').insert([{ phone: phone, question: questionText, hall_id: liveHall, is_correct: isCorrect }]); 
            } catch(e) {} 
            
            window.updatePersistentFooter(); 
        };

        window.updatePersistentFooter = async function() { 
            let phone = localStorage.getItem('delegate_phone'); 
            let el = document.getElementById('persistentLeaderboard'); 
            if (!el) return;
            
            if (!phone) { 
                el.innerHTML = `<span class="text-[10px] sm:text-xs font-black text-amber-500 uppercase tracking-widest sticky left-0 bg-slate-950 px-2 py-1 z-10 shadow-[10px_0_10px_-5px_rgba(2,6,23,1)]"><i class="fas fa-trophy mr-1"></i> Your Ranks:</span><span class="text-slate-500 text-[10px] sm:text-xs font-semibold ml-2">Login to track your position</span>`;
                return; 
            }

            let hallName = configTitles[liveHall] ? (configTitles[liveHall].split('-').length > 1 ? configTitles[liveHall].split('-')[1].trim() : configTitles[liveHall]) : "Local Room";

            let localMath = await fetchMathLeaderboard(liveHall);
            let localRank = localMath.sorted.findIndex(x => x[0] === phone); 
            let localText = localRank !== -1 ? `<span class="text-emerald-400 font-bold mr-1">#${localRank + 1}</span> ${localMath.sorted[localRank][1]}pt` : `Unranked`;

            let grandMath = await fetchMathLeaderboard('grand'); 
            let grandRank = grandMath.sorted.findIndex(x => x[0] === phone); 
            let grandText = grandRank !== -1 ? `<span class="text-amber-400 font-bold mr-1">#${grandRank + 1}</span> ${grandMath.sorted[grandRank][1]}pt` : `<span class="text-slate-500">Unranked</span>`;

            el.innerHTML = `Your Live Ranks: ${hallName} ${localText} | Overall Conf ${grandText}`; 
        };

        window.updateLiveDisplay = function(forceRender = false) { 
            const data = appData[liveHall]; 
            if (!data) return;
            
            document.querySelectorAll('.feed-btn').forEach(btn => { 
                let targetHall = btn.dataset.hall; 
                if (targetHall === liveHall) { 
                    btn.className = "feed-btn px-3 py-1.5 rounded-lg text-xs font-bold transition-colors flex-shrink-0 bg-indigo-600 text-white border-indigo-500 shadow-md"; 
                } else { 
                    btn.className = "feed-btn px-3 py-1.5 rounded-lg text-xs font-bold transition-colors flex-shrink-0 bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700"; 
                } 
            });

            let mobileSelect = document.getElementById('mobileHallSelect'); 
            if (mobileSelect) { mobileSelect.value = liveHall; }

            document.getElementById('headerSub').innerText = data.title.split(' - ')[0];
            document.getElementById('headerTitle').innerText = data.title.split(' - ')[1] || data.title;

            const { currentEvent, nextEvent } = getLiveStatus(data.events);

            let newHash = (currentEvent ? currentEvent.title + currentEvent.time : "none") + "|" + (nextEvent ? nextEvent.title : "none") + "|" + remoteOverrideIndex; 
            if (!forceRender && newHash === lastRenderHash) { return; } 
            lastRenderHash = newHash;

            let html = `<h2 class="text-3xl font-bold text-slate-400 text-center py-12">No Session Currently Active</h2>`;

            if (currentEvent) { 
                if (currentEvent.type === 'quiz') { 
                    let phone = localStorage.getItem('delegate_phone');
                    let cleanKey = (liveHall + "" + currentEvent.title).replace(/\W/g, ''); 
                    let hasAnswered = localStorage.getItem('answered_' + cleanKey); 
                    let mySelection = localStorage.getItem('marked_' + cleanKey) || '';
                    let secondsLeft = 45; 
                    
                    if (quizStartTimeStamp) { 
                        let diff = Math.floor((new Date() - new Date(quizStartTimeStamp)) / 1000);
                        secondsLeft = 45 - diff; 
                        if (secondsLeft < 0) secondsLeft = 0; 
                    }

                    if (!phone) { 
                        html = `
                        <div class="mb-8 p-6 sm:p-8 bg-slate-800 rounded-3xl border border-slate-700 shadow-2xl flex flex-col items-center text-center my-6 relative z-10">
                            <i class="fas fa-user-circle text-6xl text-indigo-500 mb-4 animate-pulse"></i>
                            <h3 class="text-2xl font-black text-white mb-2">Live Quiz Active!</h3>
                            <p class="text-slate-400 mb-6">Enter your mobile number to participate in this live quiz and climb the leaderboard. You can also ignore this and change halls above.</p>
                            <input type="tel" id="delegatePhoneInline" class="w-full max-w-sm bg-slate-900 border border-slate-600 rounded-xl px-4 py-3 text-white text-center text-xl tracking-widest mb-4 font-mono shadow-inner outline-none focus:border-indigo-500" placeholder="Mobile Number">
                            <button onclick="let v = document.getElementById('delegatePhoneInline').value; if(v.length>6){ localStorage.setItem('delegate_phone', v); window.updateLiveDisplay(true); window.updatePersistentFooter(); }else{alert('Invalid number');}" class="w-full max-w-sm bg-indigo-600 hover:bg-indigo-500 text-white text-lg font-black py-4 rounded-xl shadow-lg transition active:scale-95">Submit & Join</button>
                        </div>`;
                    } else if (!hasAnswered && secondsLeft > 0) {
                        html = `<div class="text-center font-bold mb-4 border border-red-500/50 text-rose-500 font-mono text-xl font-black px-4 py-1.5 rounded-xl">${secondsLeft}s</div>`;
                        html += currentEvent.options.map((opt, idx) => {
                            let sOpt = encodeURIComponent(opt);
                            let sCor = encodeURIComponent(currentEvent.correct);
                            let sTit = encodeURIComponent(currentEvent.title);
                            return `<button onclick="window.submitDelegateQuiz('${sOpt}', '${sCor}', '${sTit}', ${idx})" class="w-full bg-slate-800 hover:bg-indigo-600 border border-slate-600 hover:border-indigo-500 text-white font-semibold py-4 px-5 rounded-2xl text-left transition text-base flex items-center shadow-md active:scale-95"><span class="bg-slate-900 px-3 py-1 rounded-md text-indigo-400 mr-4 font-black shadow-inner">${String.fromCharCode(65+idx)}</span> ${opt}</button>`;
                        }).join('');
                    } else {
                        html = `<div class="mb-4 text-center text-emerald-400 font-bold"><i class="fas fa-bolt mr-2"></i> Live Trivia ${secondsLeft}s</div>`;
                        html += currentEvent.options.map((opt, idx) => { 
                            let isCor = checkIfCorrect(opt, currentEvent.correct, idx); 
                            let isSel = (cleanText(opt).toLowerCase() === cleanText(mySelection).toLowerCase());
                            let itemClass = ""; 
                            let badgeHtml = "";
                            
                            if (isCor && isSel) { 
                                itemClass = "bg-emerald-500/20 border-emerald-500 text-emerald-300 font-black ring-2 ring-emerald-400/50"; 
                                badgeHtml = ' <span class="ml-auto">Correct</span>'; 
                            } else if (isCor && !isSel) { 
                                itemClass = "bg-amber-500/20 border-amber-500 text-amber-200 font-black ring-2 ring-amber-400/50";
                                badgeHtml = ' <span class="ml-auto">Correct Answer</span>'; 
                            } else if (!isCor && isSel) { 
                                itemClass = "bg-rose-900/40 border-rose-500 text-rose-300 font-bold ring-1 ring-rose-500/50";
                                badgeHtml = ' <span class="ml-auto"><i class="fas fa-times mr-1"></i> Incorrect</span>'; 
                            } else { 
                                itemClass = "bg-slate-900/40 border-slate-800 text-slate-500 line-through opacity-50"; 
                            }
                            return `<div class="border p-4 sm:p-5 rounded-2xl text-base flex items-center ${itemClass} mb-3"><span class="bg-slate-950 px-3 py-1.5 rounded-md text-sm mr-4 font-mono">${String.fromCharCode(65+idx)}</span>${opt}${badgeHtml}</div>`;
                        }).join('');
                    }
                } else if (currentEvent.type === 'break' && currentEvent.adLink) {
                    let link = currentEvent.adLink;
                    let media = '';
                    let ytMatch = link.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
                    
                    if (ytMatch) {
                        media = `<iframe class="w-full aspect-video rounded-3xl shadow-2xl border border-slate-700 pointer-events-none" src="https://www.youtube.com/embed/${ytMatch[1]}?autoplay=1&mute=1&loop=1&playlist=${ytMatch[1]}&controls=0&showinfo=0&modestbranding=1" frameborder="0" allow="autoplay; encrypted-media"></iframe>`;
                    } else if (link.includes('drive.google.com')) { 
                        let fId = link.match(/[-\w]{25,}/); 
                        if (fId) media = `<img src="https://lh3.googleusercontent.com/d/$${fId[0]}" class="w-full h-auto max-h-[50vh] object-contain rounded-3xl bg-black border border-slate-700 shadow-2xl">`;
                    } else { 
                        media = `<img src="${link}" class="w-full h-auto max-h-[50vh] object-contain rounded-3xl bg-black border border-slate-700 shadow-2xl">`; 
                    }

                    html = `<div class="mb-8 p-6 sm:p-8 bg-slate-800 rounded-3xl border border-slate-700 shadow-2xl"><div class="flex items-center justify-between mb-6"><span class="bg-amber-500 text-slate-900 px-5 py-2 rounded-full text-sm font-black uppercase tracking-wider shadow"><i class="fas fa-play-circle mr-2"></i> ${currentEvent.title}</span><span class="text-xl font-bold text-slate-400 bg-slate-900 px-4 py-1.5 rounded-lg border border-slate-700 shadow-inner">${currentEvent.display_time}</span></div>${media}</div>`; 
                } else if (currentEvent.type === 'break') { 
                    let breakIcon = "fa-coffee", iconColor = "text-amber-500"; 
                    const lowTitle = currentEvent.title.toLowerCase(); 
                    if (lowTitle.includes('lunch')) { breakIcon = "fa-utensils"; iconColor = "text-emerald-500"; } 
                    else if (lowTitle.includes('banquet') || lowTitle.includes('dinner')) { breakIcon = "fa-glass-cheers"; iconColor = "text-purple-500"; } 
                    else if (lowTitle.includes('registration')) { breakIcon = "fa-id-badge"; iconColor = "text-blue-400"; }

                    html = `<div class="text-center py-24 bg-slate-800/50 rounded-3xl border border-slate-700 my-8 shadow-inner"><i class="fas ${breakIcon} text-7xl sm:text-8xl mb-8 ${iconColor} animate-pulse drop-shadow-lg"></i><h2 class="text-4xl sm:text-5xl font-black text-white uppercase tracking-widest">${currentEvent.title}</h2><p class="text-2xl text-slate-400 mt-4 font-semibold">${currentEvent.display_time}</p></div>`; 
                } else { 
                    let bStyle = currentEvent.isOration ? "bg-rose-600" : "bg-indigo-600"; 
                    let pSess = currentEvent.parent_session && currentEvent.parent_session !== currentEvent.title && !currentEvent.parent_session.toLowerCase().includes('oration') ? `<div class="text-indigo-400 font-bold uppercase text-sm sm:text-base mb-3 flex items-center tracking-wider">${currentEvent.parent_session}</div>` : '';

                    html = `${pSess}<h1 class="text-3xl font-bold text-white mb-2">${currentEvent.title}</h1><p class="text-slate-400 mb-6 text-xl">${currentEvent.display_time}</p><div class="text-indigo-300 text-lg font-semibold"><i class="fas fa-microphone mr-2"></i> ${currentEvent.speaker}</div>`;
                }
            }

            let upNextHtml = ''; 
            if (nextEvent && nextEvent.type !== 'quiz') { 
                upNextHtml = `<div class="mt-8 p-4 bg-slate-900 border border-slate-700 rounded-xl"><h4 class="text-slate-500 uppercase tracking-widest text-xs font-bold mb-2">Up Next</h4><h3 class="text-white font-semibold">${nextEvent.title}</h3>${nextEvent.speaker ? `<p class="text-sm text-slate-400 mt-1">${nextEvent.speaker}</p>` : ''}</div>`;
            }

            document.getElementById('dynamicContentWrapper').innerHTML = html + upNextHtml;
        };

        window.initLiveDashboard = function() {
            supabaseClient.channel('global-radar-feed').on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'hall_states' }, (payload) => { 
                let changedHall = payload.new.hall_id; 
                let oIdx = payload.new.override_index; 
                let lBoard = payload.new.force_leaderboard;

                if (changedHall === liveHall) { 
                    if (lBoard && lBoard !== 'none') {
                        if(typeof window.showLeaderboard === 'function') window.showLeaderboard(lBoard);
                    } else {
                        if(typeof window.hideLeaderboard === 'function') window.hideLeaderboard();
                    }
                } else { 
                    if (oIdx !== null && oIdx < 0) { 
                        document.getElementById('hijackMessage').innerText = `A high-stakes quiz is running in ${buttonLabels[changedHall]}!`;
                        document.getElementById('hijackJoinBtn').onclick = () => window.switchDelegateHall(changedHall);
                        document.getElementById('globalHijackOverlay').classList.remove('hidden'); 
                    } else if (oIdx === null || oIdx >= 0) {
                        document.getElementById('globalHijackOverlay').classList.add('hidden'); 
                    } 
                } 
            }).subscribe();

            if (liveUpdateTimer) clearInterval(liveUpdateTimer);
            if (tickerTimer) clearInterval(tickerTimer);

            liveUpdateTimer = setInterval(() => { 
                if (remoteOverrideIndex === null || remoteOverrideIndex >= 0) { 
                    window.updateLiveDisplay(false);
                } 
                window.updatePersistentFooter(); 
            }, 15000);
            
            tickerTimer = setInterval(() => { 
                let clk = document.getElementById('liveDigitalClock'); 
                if(clk) clk.innerText = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });

                if (remoteOverrideIndex !== null && remoteOverrideIndex < 0 && quizStartTimeStamp) { 
                    let diff = Math.floor((new Date() - new Date(quizStartTimeStamp)) / 1000); 
                    let secondsLeft = 45 - diff;

                    if (secondsLeft <= 0) { 
                        if (!window.quizExpiredRendered) {
                            window.quizExpiredRendered = true; 
                            window.updateLiveDisplay(true); 
                        } 
                    } else {
                        window.quizExpiredRendered = false; 
                        let timerEl = document.getElementById('quizCountdownTimer'); 
                        if (timerEl && timerEl.dataset.expired === "false") { 
                            timerEl.innerHTML = `<i class="fas fa-hourglass-half mr-2 animate-spin"></i>${secondsLeft}s`;
                        } 
                    } 
                } else {
                    window.quizExpiredRendered = false; 
                } 
            }, 1000);

            window.subscribeToHall(liveHall); 
            window.updatePersistentFooter(); 
        };

        async function bootApp() { 
            try { 
                window.refreshIdentityStateUI();
                try { await window.syncMyAnswers(); } catch(e){}
                
                document.getElementById('liveDigitalClock').innerText = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });

                const cachedData = localStorage.getItem(CACHE_KEY); 
                if (cachedData) { 
                    let parsed = JSON.parse(cachedData);
                    appData = parsed.halls || {}; 
                    globalQuizzes = parsed.quizzes || [];
                    document.getElementById('loadingState').classList.add('hidden');
                    document.getElementById('staticHeader').classList.remove('hidden');
                    window.initLiveDashboard(); 
                    window.fetchLiveSchedule(true); 
                } else {
                    window.fetchLiveSchedule(false); 
                } 
            } catch(e) { 
                console.error("Boot Error", e);
                window.fetchLiveSchedule(false); 
            } 
        }

        bootApp();
    </script>
