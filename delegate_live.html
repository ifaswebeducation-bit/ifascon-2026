<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IFASCON 2026 - Live Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        .loader { border: 3px solid #334155; border-top: 3px solid #6366f1; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .animate-live { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100__ { opacity: 1; } 50% { opacity: 0.6; } }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex flex-col h-screen bg-slate-900 overflow-hidden">

    <div id="identityControlBanner" class="w-full bg-slate-950 border-b border-slate-800 p-3 flex justify-between items-center z-50 flex-shrink-0">
        <div id="identityLoggedOutState" class="w-full flex flex-row items-center gap-2">
            <i class="fas fa-user-circle text-xl text-slate-500"></i>
            <input type="tel" id="topPhoneRegisterInput" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white max-w-[160px] font-mono outline-none focus:border-indigo-500" placeholder="Mobile Number">
            <button onclick="saveTopBannerIdentity()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs px-3 py-1.5 rounded-lg transition ml-auto">Login to Play</button>
        </div>
        <div id="identityLoggedInState" class="w-full hidden flex flex-row items-center justify-between">
            <div class="flex items-center gap-2 text-xs font-semibold text-emerald-400">
                <i class="fas fa-check-circle"></i>
                <span>Logged In: <span id="identityBannerLabel" class="font-mono text-white"></span></span>
            </div>
            <button onclick="clearDelegateIdentity()" class="text-slate-400 hover:text-rose-400 text-xs font-bold px-2 py-1 border border-slate-700 hover:border-rose-900 rounded-md transition"><i class="fas fa-sign-out-alt mr-1"></i>Logout</button>
        </div>
    </div>

    <main class="flex-1 overflow-y-auto p-4 relative w-full max-w-4xl mx-auto" id="contentContainer">
        <div id="loadingState" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900 z-50">
            <div class="loader mb-4"></div>
            <p class="text-slate-400 font-semibold text-lg animate-pulse">Loading Conference Dashboard...</p>
        </div>
    </main>

    <script>
        const supabaseUrl = 'https://iiqxxxamsprzhzggsrer.supabase.co';
        const supabaseKey = 'sb_publishable_eYTrqO8dPDZj0mjbv3Csqg_dMrY2h3k';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        let remoteOverrideIndex = null;
        let quizStartTimeStamp = null;
        let currentSubscription = null;
        let tickerTimer = null;

        const sheetLinks = {
            'quizzes': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTRQ3g-iv-ZNPmsFq_zInPnhzbraxuMfJNEHsUro3i7C_eNIHWmAc261FSqBcmuNFmDlLVl0-8jKNJ_/pub?gid=2142278070&single=true&output=csv',
            'ao': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTRQ3g-iv-ZNPmsFq_zInPnhzbraxuMfJNEHsUro3i7C_eNIHWmAc261FSqBcmuNFmDlLVl0-8jKNJ_/pub?gid=189655281&single=true&output=csv',
            '22a': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTRQ3g-iv-ZNPmsFq_zInPnhzbraxuMfJNEHsUro3i7C_eNIHWmAc261FSqBcmuNFmDlLVl0-8jKNJ_/pub?gid=0&single=true&output=csv',
            '22b': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTRQ3g-iv-ZNPmsFq_zInPnhzbraxuMfJNEHsUro3i7C_eNIHWmAc261FSqBcmuNFmDlLVl0-8jKNJ_/pub?gid=660947078&single=true&output=csv',
            '23a': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTRQ3g-iv-ZNPmsFq_zInPnhzbraxuMfJNEHsUro3i7C_eNIHWmAc261FSqBcmuNFmDlLVl0-8jKNJ_/pub?gid=1579973346&single=true&output=csv',
            '23b': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTRQ3g-iv-ZNPmsFq_zInPnhzbraxuMfJNEHsUro3i7C_eNIHWmAc261FSqBcmuNFmDlLVl0-8jKNJ_/pub?gid=239334255&single=true&output=csv'
        };

        const configTitles = {
            'ao_seminar': "21 Aug - AO Seminar", 'workshop_diabetic': "21 Aug - Diabetic WS", 'workshop_mis': "21 Aug - MIS WS",
            '22a': "22 Aug - Hall A", '22b': "22 Aug - Hall B", '23a': "23 Aug - Hall A", '23b': "23 Aug - Hall B"
        };

        // FIXED: Re-instated explicit configuration bindings for hall selections mapping array loops correctly
        const buttonLabels = {
            'ao_seminar': "21 Aug: AO Seminar", 'workshop_diabetic': "21 Aug: Diabetic Foot", 'workshop_mis': "21 Aug: MIS",
            '22a': "22 Aug: Hall A", '22b': "22 Aug: Hall B", '23a': "23 Aug: Hall A", '23b': "23 Aug: Hall B"
        };

        let appData = {};
        let globalQuizzes = [];
        const CACHE_KEY = 'ifascon_schedule_cache_delegate_v13'; 
        const container = document.getElementById('contentContainer');
        
        async function initializeApp() {
            refreshIdentityStateUI();
            const cachedData = localStorage.getItem(CACHE_KEY);
            if (cachedData) {
                try {
                    let parsed = JSON.parse(cachedData);
                    appData = parsed.halls || {};
                    globalQuizzes = parsed.quizzes || [];
                    document.getElementById('loadingState').classList.add('hidden');
                    initLiveDashboard();
                    fetchLiveSchedule(true);
                } catch (e) { fetchLiveSchedule(false); }
            } else { fetchLiveSchedule(false); }
        }

        function refreshIdentityStateUI() {
            let num = localStorage.getItem('delegate_phone');
            let loggedInView = document.getElementById('identityLoggedInState');
            let loggedOutView = document.getElementById('identityLoggedOutState');
            if (num && loggedInView && loggedOutView) {
                loggedOutView.classList.add('hidden');
                loggedInView.classList.remove('hidden');
                document.getElementById('identityBannerLabel').innerText = num;
            } else if (loggedInView && loggedOutView) {
                loggedInView.classList.add('hidden');
                loggedOutView.classList.remove('hidden');
            }
        }

        window.saveTopBannerIdentity = function() {
            let val = document.getElementById('topPhoneRegisterInput').value.trim();
            if (val.length >= 7) {
                localStorage.setItem('delegate_phone', val);
                refreshIdentityStateUI();
                updateLiveDisplay();
            } else { alert('Please supply a valid telephone number.'); }
        };

        window.clearDelegateIdentity = function() {
            localStorage.removeItem('delegate_phone');
            refreshIdentityStateUI();
            updateLiveDisplay();
        };

        async function fetchLiveSchedule(isBackground = false) {
            let fetchedData = {};
            let quizzesLoaded = [];
            for (const [key, link] of Object.entries(sheetLinks)) {
                try {
                    const response = await fetch(link);
                    const csvText = await response.text();
                    let parsedCsv = Papa.parse(csvText, { header: false }).data;
                    
                    if (key === 'quizzes') {
                        quizzesLoaded = parseQuizData(parsedCsv);
                    } else if (key === 'ao') {
                        const allAo = parseRawData(parsedCsv, "21 Aug");
                        let sem = [], dia = [], mis = [];
                        let isWs = false, track = 'diabetic';
                        allAo.forEach(ev => {
                            let matchStr = `${ev.title} ${ev.time} ${ev.parent_session}`.toLowerCase();
                            if (/\b(workshop|16:15|16\.15)\b/i.test(matchStr)) isWs = true;
                            if (isWs) {
                                if (matchStr.includes('diabetic') || matchStr.includes('nebula')) track = 'diabetic';
                                else if (matchStr.includes('mis') || matchStr.includes('arthrex')) track = 'mis';
                                if (track === 'diabetic') { ev.hall = "Diabetic Foot Hall"; dia.push(ev); }
                                else { ev.hall = "MIS Hall"; mis.push(ev); }
                            } else { ev.hall = "AO Seminar Hall"; sem.push(ev); }
                        });
                        fetchedData['ao_seminar'] = { title: configTitles['ao_seminar'], events: sem };
                        fetchedData['workshop_diabetic'] = { title: configTitles['workshop_diabetic'], events: dia };
                        fetchedData['workshop_mis'] = { title: configTitles['workshop_mis'], events: mis };
                    } else {
                        fetchedData[key] = { title: configTitles[key], events: parseRawData(parsedCsv, configTitles[key]) };
                    }
                } catch(err) {}
            }
            if (Object.keys(fetchedData).length > 0) {
                appData = fetchedData;
                globalQuizzes = quizzesLoaded;
                localStorage.setItem(CACHE_KEY, JSON.stringify({ halls: appData, quizzes: globalQuizzes }));
                if (!isBackground) { document.getElementById('loadingState').classList.add('hidden'); initLiveDashboard(); } 
                else { updateLiveDisplay(); }
            }
        }

        function parseQuizData(rows) {
            let list = [];
            rows.forEach(r => {
                if(!r[0] || r[0].toLowerCase().includes('question')) return;
                list.push({
                    type: 'quiz',
                    title: r[0].trim(),
                    options: [r[1], r[2], r[3], r[4]].map(x => (x || "").trim()).filter(Boolean),
                    correct: (r[5] || "").trim()
                });
            });
            return list;
        }

        function parseRawData(rows, hallTitle) {
            let events = [], current_session = "";
            rows.forEach(r => {
                while(r.length < 12) r.push("");
                r = r.map(x => (x || "").trim());
                let col0 = r[0], col1 = r[1], col2 = r[2], col3 = r[3];
                let colTitle = r[4] || r[5] || "", colSpeaker = r[4] ? r[5] : r[6];
                let colChair1 = r[4] ? r[6] : r[7], colChair2 = r[4] ? r[7] : r[8], colChair3 = r[4] ? r[8] : r[9];
                let row_text = r.join(" ").toLowerCase();

                if (row_text.includes("position:absolute") || row_text.includes("docs-drivelogo") || row_text.includes("<!doctype html>")) return; 
                if (col0.toLowerCase().includes("duration") && col1.toLowerCase().includes("from")) return;
                if (!col0 && !col1 && !col2 && !col3 && !colTitle) return;

                const breaks = ["break", "lunch", "banquet", "gbm", "valedictory", "inauguration"];
                let isBreakRow = breaks.some(b => row_text.includes(b)) && !row_text.includes("symposium") && !row_text.includes("session");
                
                if (isBreakRow || /\btea\b|\bcoffee\b/.test(row_text)) {
                    let text = colTitle || col3 || col0;
                    if (row_text.includes("registration")) text = "Registration";
                    else if (row_text.includes("lunch")) text = "Lunch";
                    else if (/\btea\b|\bcoffee\b/.test(row_text)) text = "Tea / Coffee Break";

                    let adLink = r.find(c => c.toLowerCase().includes('http')) || "";
                    events.push({ type: 'break', title: text, time: (col1 && col2) ? `${col1} - ${col2}` : (col1 || col0), speaker: '', hall: hallTitle, parent_session: '', adLink: adLink });
                    return;
                }

                let isQA = col3.toLowerCase().includes("q&a") || colTitle.toLowerCase().includes("discussion");
                let isPlenary = col3.toLowerCase().includes("plenary") || colTitle.toLowerCase().includes("plenary");
                let isSession = false, isOration = false;

                if (row_text.includes('oration')) { isSession = true; isOration = true; } 
                else if (!isQA && !isPlenary) {
                    if (!col1 && !col2 && !col0) isSession = true; 
                    else if (!col0 && col1 && col2 && !colTitle) isSession = true; 
                    else if (col3 && !colTitle && !colSpeaker) isSession = true; 
                    else if (row_text.includes('symposium') || row_text.includes('session') || row_text.includes('workshop')) isSession = true;
                }

                if (isSession) {
                    let topic = colTitle || col3 || (isOration ? "Oration" : "Session");
                    if (colTitle && col3 && colTitle.toLowerCase() !== col3.toLowerCase()) {
                        if (colTitle.toLowerCase().includes(col3.toLowerCase())) topic = colTitle;
                        else if (col3.toLowerCase().includes(colTitle.toLowerCase())) topic = col3;
                        else topic = col3 + ": " + colTitle;
                    }
                    let chairsArr = [isOration ? "" : colSpeaker, colChair1, colChair2, colChair3].filter(c => c && !["nan", "speaker", "chairperson"].includes(c.toLowerCase()));
                    current_session = topic; 
                    events.push({ type: 'session', isOration: isOration, time: (col1 && col2) ? `${col1} - ${col2}` : (col1 || col0), title: topic, speaker: isOration ? (colSpeaker || "") : chairsArr.join(", "), chairpersons: isOration ? chairsArr.join(", ") : "", hall: hallTitle, parent_session: current_session });
                    return;
                }

                if (col1 || colTitle || isQA || isPlenary) {
                    let speaker = ["nan", "tbd"].includes(colSpeaker.toLowerCase()) ? "" : colSpeaker;
                    let time_display = (col1 && col2) ? `${col1} - ${col2}` : col1;
                    if (col0) {
                        let cleanDur = col0.replace(/[^0-9]/g, ''); 
                        time_display = time_display ? `${time_display} (${cleanDur ? cleanDur + ' mins' : col0})` : (cleanDur ? cleanDur + ' mins' : col0);
                    }
                    let displayTitle = (isQA && !colTitle) ? col3 : (colTitle || col3);
                    events.push({ type: 'presentation', time: time_display, tag: (isQA && !colTitle) ? "Discussion" : col3, title: displayTitle, speaker: speaker, hall: hallTitle, parent_session: current_session });
                }
            });
            return events;
        }

        function parseTimeToMinutes(timeStr) {
            if (!timeStr) return null;
            const parts = timeStr.split('-')[0].trim().split(/[.:]/);
            if (parts.length < 2) return null;
            return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
        }

        function subscribeToHall(hall_id) {
            if (currentSubscription) supabaseClient.removeChannel(currentSubscription);
            
            supabaseClient.from('hall_states').select('override_index, quiz_start_time').eq('hall_id', hall_id).single().then(({ data }) => {
                if (data) { 
                    remoteOverrideIndex = data.override_index; 
                    quizStartTimeStamp = data.quiz_start_time;
                }
                updateLiveDisplay();
            });

            currentSubscription = supabaseClient.channel('custom-delegate-channel')
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'hall_states', filter: `hall_id=eq.${hall_id}` },
                    (payload) => { 
                        remoteOverrideIndex = payload.new.override_index; 
                        quizStartTimeStamp = payload.new.quiz_start_time;
                        updateLiveDisplay(); 
                    }
                ).subscribe();
        }

        function getLiveStatus(events) {
            const playableEvents = events.filter(e => e.type === 'presentation' || e.type === 'break' || e.isOration);
            
            if (remoteOverrideIndex !== null) {
                if (remoteOverrideIndex < 0 && globalQuizzes.length > 0) {
                    return { currentEvent: globalQuizzes[Math.abs(remoteOverrideIndex) - 1], nextEvent: playableEvents[0] || null };
                }
                return { currentEvent: playableEvents[remoteOverrideIndex] || null, nextEvent: playableEvents[remoteOverrideIndex + 1] || null };
            }
            
            const currentMins = new Date().getHours() * 60 + new Date().getMinutes();
            let currentEvent = null, nextEvent = null;
            for (let i = 0; i < playableEvents.length; i++) {
                const ev = playableEvents[i];
                const evStart = parseTimeToMinutes(ev.time);
                let evEnd = (ev.time && ev.time.includes('-')) ? parseTimeToMinutes(ev.time.split('-')[1].trim()) : (evStart !== null ? evStart + 15 : null);
                
                if (evStart !== null && evEnd !== null) {
                    if (currentMins >= evStart && currentMins < evEnd) {
                        currentEvent = ev; 
                        if (ev.type === 'break' && i > 0 && playableEvents[i-1].type !== 'break') {
                            currentEvent = playableEvents[i-1];
                        }
                        if (i + 1 < playableEvents.length) nextEvent = playableEvents[i + 1]; 
                        break;
                    } else if (currentMins < evStart && !nextEvent) { nextEvent = ev; }
                }
            }
            return { currentEvent, nextEvent };
        }

        window.submitDelegateQuiz = async function(option, correctOption, questionText) {
            let phone = localStorage.getItem('delegate_phone');
            let cleanKey = questionText.replace(/\W/g, '');
            localStorage.setItem('marked_' + cleanKey, option); 
            
            try {
                await supabaseClient.from('quiz_responses').insert([{ phone: phone, question: questionText, is_correct: (option === correctOption) }]);
            } catch(e) {}
            
            localStorage.setItem('answered_' + cleanKey, 'true');
            updateLiveDisplay();
        };

        async function renderLeaderboardWidget() {
            try {
                const { data } = await supabaseClient.from('quiz_responses').select('phone').eq('is_correct', true);
                if (!data || data.length === 0) return '';
                let counts = {}; data.forEach(d => { counts[d.phone] = (counts[d.phone] || 0) + 1; });
                let sorted = Object.entries(counts).sort((a,b) => b[1] - a[1]).slice(0, 3);
                return `
                    <div class="mt-6 p-4 bg-slate-800/80 rounded-2xl border border-slate-700">
                        <h4 class="text-sm font-black text-amber-400 uppercase tracking-wider mb-3 flex items-center"><i class="fas fa-trophy mr-2"></i>Live Standings</h4>
                        <div class="flex flex-col gap-2">
                            ${sorted.map((item, idx) => `<div class="flex justify-between text-xs font-semibold text-slate-300"><span>#${idx+1} ${item[0].substring(0, 2) + '******' + item[0].slice(-2)}</span><span class="text-indigo-400 font-bold">${item[1]} pts</span></div>`).join('')}
                        </div>
                    </div>`;
            } catch(e) { return ''; }
        }

        async function updateLiveDisplay() {
            const data = appData[liveHall]; if (!data) return;
            const { currentEvent, nextEvent } = getLiveStatus(data.events);
            const nowStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            // FIXED: Injected explicit array button iterations using buttonLabels configuration mapping
            let hallSelectorHtml = `<div class="mb-6 pb-4 border-b border-slate-800"><span class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-3"><i class="fas fa-tv mr-1.5 text-indigo-400"></i>Select Hall to View:</span><div class="flex flex-wrap items-center gap-2">`;
            for (const [key, label] of Object.entries(buttonLabels)) {
                hallSelectorHtml += `<button onclick="switchDelegateHall('${key}')" class="px-3 py-1.5 rounded-lg text-xs sm:text-sm font-bold border transition-colors flex-shrink-0 ${key === liveHall ? 'bg-indigo-600 text-white border-indigo-500 shadow-md' : 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700'}">${label}</button>`;
            }
            hallSelectorHtml += `</div></div>`;

            let nowPlayingHtml = `<div class="text-center py-20 bg-slate-800/40 rounded-3xl border border-slate-800 my-8"><i class="fas fa-calendar-check text-5xl mb-4 text-slate-600"></i><h2 class="text-2xl font-bold text-slate-400">No Session Currently Active</h2></div>`;
            
            if (currentEvent) {
                if (currentEvent.type === 'quiz') {
                    let savedPhone = localStorage.getItem('delegate_phone');
                    let cleanKey = currentEvent.title.replace(/\W/g, '');
                    let hasAnswered = localStorage.getItem('answered_' + cleanKey);
                    let mySelection = localStorage.getItem('marked_' + cleanKey) || '';

                    let secondsLeft = 45;
                    if (quizStartTimeStamp) {
                        let diff = Math.floor((new Date() - new Date(quizStartTimeStamp)) / 1000);
                        secondsLeft = 45 - diff;
                        if (secondsLeft < 0) secondsLeft = 0;
                    }

                    // 1. GATED FORCE LOGIN STATE OVER QUIZ ACTIVE
                    if (!savedPhone) {
                        nowPlayingHtml = `
                            <div class="bg-gradient-to-b from-indigo-950 to-slate-950 p-6 rounded-3xl border-2 border-indigo-500 shadow-2xl text-center my-4 py-10">
                                <i class="fas fa-id-card text-5xl text-indigo-400 mb-4 animate-bounce"></i>
                                <h2 class="text-2xl font-black text-white mb-2">Quiz Gated Behind Identity</h2>
                                <p class="text-slate-300 mb-6 text-xs max-w-xs mx-auto">Input your mobile identifier token inside the box below to instantly unlock the running conference question module.</p>
                                <div class="max-w-xs mx-auto">
                                    <input type="tel" id="quizPhoneInput" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white text-center text-lg mb-4 font-mono outline-none focus:border-indigo-500" placeholder="Mobile Number">
                                    <button onclick="let v = document.getElementById('quizPhoneInput').value.trim(); if(v.length >= 7){ localStorage.setItem('delegate_phone', v); refreshIdentityStateUI(); updateLiveDisplay(); }else{alert('Invalid number');}" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl transition shadow-lg">Submit & Join</button>
                                </div>
                            </div>`;
                    } 
                    // 2. RUNNING STATE VOTING SCREEN
                    else if (secondsLeft > 0) {
                        if (hasAnswered) {
                            nowPlayingHtml = `
                                <div class="bg-slate-950 p-6 rounded-3xl border border-emerald-500/40 shadow-xl mb-8">
                                    <span class="bg-emerald-600/20 text-emerald-400 border border-emerald-500/30 px-3 py-1 rounded-full text-xs font-black uppercase tracking-wider block w-max mb-4"><i class="fas fa-lock mr-1.5"></i> Submission Frozen</span>
                                    <h2 class="text-xl font-bold text-slate-300 mb-6 leading-snug">${currentEvent.title}</h2>
                                    <div class="flex flex-col gap-2.5">
                                        ${currentEvent.options.map((opt, idx) => {
                                            let selected = (opt.trim().toLowerCase() === mySelection.trim().toLowerCase());
                                            let borderStyle = selected ? "border-indigo-500 bg-indigo-950/40 text-white font-bold" : "border-slate-800 bg-slate-900/40 text-slate-500 opacity-60";
                                            let checkTag = selected ? `<span class="bg-indigo-600 text-white px-2 py-0.5 rounded text-[10px] uppercase font-black ml-auto">Your Selection</span>` : '';
                                            return `<div class="border p-4 rounded-xl text-sm flex items-center ${borderStyle}"><span class="bg-slate-950 px-2.5 py-1 rounded text-xs mr-3 font-mono">${String.fromCharCode(65+idx)}</span>${opt}${checkTag}</div>`;
                                        }).join('')}
                                    </div>
                                    <div class="mt-5 text-center text-xs text-slate-400 font-medium">Awaiting live desk timer breakdown execution...</div>
                                </div>`;
                        } else {
                            let opHtml = currentEvent.options.map((opt, idx) => {
                                let sOpt = opt.replace(/'/g, "\\'").replace(/"/g, '"');
                                let sCorrect = currentEvent.correct.replace(/'/g, "\\'").replace(/"/g, '"');
                                let sTitle = currentEvent.title.replace(/'/g, "\\'").replace(/"/g, '"');
                                return `<button onclick="submitDelegateQuiz('${sOpt}', '${sCorrect}', '${sTitle}')" class="w-full bg-slate-800 hover:bg-indigo-600 border border-slate-600 text-white font-semibold py-3.5 px-4 rounded-xl text-left transition mb-2.5 text-sm flex items-center shadow"><span class="bg-slate-900 px-2.5 py-0.5 rounded text-indigo-400 mr-3 font-black shadow-inner">${String.fromCharCode(65+idx)}</span> ${opt}</button>`;
                            }).join('');
                            
                            nowPlayingHtml = `
                                <div class="bg-gradient-to-b from-slate-800 to-slate-900 rounded-3xl border border-indigo-500/50 p-5 shadow-2xl mb-8">
                                    <div class="flex justify-between items-center mb-5 border-b border-slate-700/50 pb-3">
                                        <span class="bg-rose-600 text-white px-3 py-1 rounded-full text-xs font-black uppercase tracking-widest animate-pulse"><i class="fas fa-bolt mr-1"></i> Live Trivia</span>
                                        <span class="bg-slate-950 border border-red-500/50 text-rose-500 font-mono text-sm font-black px-3 py-1 rounded-xl"><i class="fas fa-hourglass-half mr-1 animate-spin"></i>${secondsLeft}s</span>
                                    </div>
                                    <h2 class="text-xl font-black text-white leading-snug mb-6">${currentEvent.title}</h2>
                                    <div>${opHtml}</div>
                                </div>`;
                        }
                    } 
                    // 3. TIME-UP EXPIRED STATE
                    else {
                        let leaderboardWidget = await renderLeaderboardWidget();
                        nowPlayingHtml = `
                            <div class="bg-gradient-to-b from-slate-950 to-slate-900 rounded-3xl border-2 border-red-600/40 p-6 shadow-2xl mb-8">
                                <span class="bg-red-600 text-white px-3 py-1 rounded-full text-xs font-black uppercase tracking-wider mb-4 inline-block"><i class="fas fa-stopwatch mr-1"></i> Quiz Question Time Up!</span>
                                <h3 class="text-lg font-bold text-slate-400 mb-5 leading-snug">${currentEvent.title}</h3>
                                <div class="flex flex-col gap-2 mb-4">
                                    ${currentEvent.options.map((opt, idx) => {
                                        let isCorrect = (opt.trim().toLowerCase() === currentEvent.correct.trim().toLowerCase());
                                        let selected = (opt.trim().toLowerCase() === mySelection.trim().toLowerCase());
                                        let itemClass = isCorrect ? "bg-amber-500/20 border-amber-500 text-amber-200 font-black ring-1 ring-amber-400/30" : "bg-slate-900/40 border-slate-800 text-slate-500 line-through opacity-50";
                                        let labelMarker = isCorrect ? `<span class="bg-amber-500 text-slate-950 px-2 py-0.5 rounded text-[10px] font-black uppercase ml-auto">Correct Answer</span>` : selected ? `<span class="bg-slate-800 text-slate-400 px-2 py-0.5 rounded text-[10px] ml-auto">Your Guess</span>` : '';
                                        return `<div class="border p-3 rounded-xl text-xs flex items-center ${itemClass}"><span class="bg-slate-950 px-2 py-0.5 rounded mr-3 font-mono">${String.fromCharCode(65+idx)}</span>${opt}${labelMarker}</div>`;
                                    }).join('')}
                                </div>
                                ${leaderboardWidget}
                            </div>`;
                    }
                } else if (currentEvent.type === 'break') {
                    if (currentEvent.adLink) {
                        let link = currentEvent.adLink, media = '';
                        if (link.includes('youtube.com') || link.includes('youtu.be')) {
                            let ytMatch = link.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
                            if (ytMatch) media = `<iframe class="w-full aspect-video rounded-2xl" src="https://www.youtube.com/embed/${ytMatch[1]}?autoplay=1&mute=1&loop=1&playlist=${ytMatch[1]}&controls=0"></iframe>`;
                        } else if (link.includes('drive.google.com')) {
                            let fId = link.match(/[-\w]{25,}/);
                            if (fId) media = `<img src="https://lh3.googleusercontent.com/d/${fId[0]}" class="w-full h-auto rounded-2xl max-h-[50vh] object-contain bg-black border border-slate-700 shadow-2xl">`;
                        } else { media = `<img src="${link}" class="w-full h-auto rounded-2xl max-h-[50vh] object-contain bg-black border border-slate-700 shadow-2xl">`; }
                        nowPlayingHtml = `<div class="mb-8 p-6 bg-slate-800 rounded-3xl border border-slate-700 shadow-2xl"><div class="flex justify-between items-center mb-4"><span class="bg-amber-500 text-slate-900 px-4 py-1.5 rounded-full text-sm font-black"><i class="fas fa-mug-hot mr-2"></i> ${currentEvent.title}</span><span class="text-xl font-bold text-slate-400">${currentEvent.time}</span></div>${media}</div>`;
                    } else {
                        let breakIcon = "fa-coffee", iconColor = "text-amber-500";
                        const lowTitle = currentEvent.title.toLowerCase();
                        if (lowTitle.includes('lunch')) { breakIcon = "fa-utensils"; iconColor = "text-emerald-500"; }
                        else if (lowTitle.includes('banquet') || lowTitle.includes('dinner')) { breakIcon = "fa-glass-cheers"; iconColor = "text-purple-500"; }
                        else if (lowTitle.includes('registration')) { breakIcon = "fa-id-badge"; iconColor = "text-blue-400"; }
                        nowPlayingHtml = `<div class="text-center py-24 bg-slate-800/50 rounded-3xl border border-slate-700 my-8 shadow-inner"><i class="fas ${breakIcon} text-7xl mb-6 ${iconColor} animate-pulse"></i><h2 class="text-4xl font-black text-white uppercase tracking-widest">${currentEvent.title}</h2><p class="text-2xl text-slate-400 mt-3 font-semibold">${currentEvent.time}</p></div>`;
                    }
                } else {
                    let bStyle = currentEvent.isOration ? "bg-rose-600" : "bg-indigo-600";
                    nowPlayingHtml = `
                        <div class="bg-gradient-to-br from-slate-800 to-slate-800/80 border-2 border-slate-700/80 rounded-3xl p-6 shadow-2xl mb-8">
                            <span class="animate-live ${bStyle} px-4 py-1.5 rounded-full text-sm font-black uppercase tracking-widest flex items-center mb-6 w-max"><span class="w-2.5 h-2.5 bg-white rounded-full mr-2.5"></span> LIVE NOW</span>
                            ${currentEvent.parent_session && currentEvent.parent_session !== currentEvent.title ? `<div class="text-indigo-400 font-bold uppercase text-sm mb-2"><i class="fas fa-layer-group mr-2"></i>${currentEvent.parent_session}</div>` : ''}
                            <h1 class="text-2xl sm:text-4xl font-black text-white leading-tight mb-8">${currentEvent.title}</h1>
                            ${currentEvent.speaker ? `<div class="flex items-center bg-slate-900/90 p-4 rounded-2xl border border-slate-700/80 shadow-inner"><div class="w-10 h-10 rounded-2xl bg-indigo-500/20 text-indigo-400 flex items-center justify-center text-xl mr-4 flex-shrink-0"><i class="fas fa-microphone"></i></div><div><span class="block text-[10px] uppercase text-slate-400 font-bold mb-0.5">Speaker</span><span class="text-lg sm:text-xl font-extrabold text-white">${currentEvent.speaker}</span></div></div>` : ''}
                        </div>`;
                }
            }

            let upNextHtml = '';
            if (nextEvent && nextEvent.type !== 'quiz') {
                upNextHtml = `
                    <div class="bg-slate-800/40 border border-slate-700/60 rounded-2xl p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div class="flex-1"><span class="text-xs font-black uppercase tracking-widest text-amber-400 block mb-1.5 flex items-center"><i class="fas fa-step-forward mr-2"></i>Coming Up Next • ${nextEvent.time}</span><h4 class="text-lg font-bold text-slate-200">${nextEvent.title}</h4>${nextEvent.speaker ? `<p class="text-slate-400 text-sm mt-1.5"><i class="fas fa-user-md mr-2 text-indigo-400"></i>${nextEvent.speaker}</p>` : ''}</div>
                    </div>`;
            }

            container.innerHTML = `
                <div class="max-w-4xl mx-auto pt-2">
                    ${hallSelectorHtml}
                    <div class="flex flex-col sm:flex-row justify-between items-center pb-6 mb-4 gap-4">
                        <div class="flex-1 w-full sm:w-auto text-left">
                            <h2 class="text-xl sm:text-2xl font-black text-white tracking-tight">${data.title.split(' - ')[1] || data.title}</h2>
                        </div>
                        <div class="flex-shrink-0 order-first sm:order-none mb-4 sm:mb-0 mx-2">
                            <div class="bg-white/95 p-2 rounded-2xl shadow-xl inline-block">
                                <img src="IFASCON chd logo.jpg" alt="IFASCON Logo" class="h-24 sm:h-32 w-auto object-contain" onerror="this.src='https://via.placeholder.com/150x50?text=IFASCON'">
                            </div>
                        </div>
                        <div class="flex-1 w-full sm:w-auto flex justify-start sm:justify-end">
                            <div class="bg-slate-800/50 border border-slate-700 px-4 py-2 rounded-xl flex items-center gap-3"><i class="far fa-clock text-slate-500"></i><div class="text-xl font-black text-white font-mono tracking-wider">${nowStr}</div></div>
                        </div>
                    </div>
                    ${nowPlayingHtml}
                    ${upNextHtml}
                </div>`;
        }

        function initLiveDashboard() { 
            subscribeToHall(liveHall); 
            if(liveUpdateTimer) clearInterval(liveUpdateTimer);
            if(tickerTimer) clearInterval(tickerTimer);
            liveUpdateTimer = setInterval(updateLiveDisplay, 15000); 
            tickerTimer = setInterval(() => {
                if(remoteOverrideIndex !== null && remoteOverrideIndex < 0) updateLiveDisplay();
            }, 1000);
        }
        
        initializeApp();
    </script>
</body>
</html>
