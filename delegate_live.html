    <script>
        const supabaseUrl = 'https://iiqxxxamsprzhzggsrer.supabase.co';

        let remoteOverrideIndex = null;

        const sheetLinks = {

            '23b': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTRQ3g-iv-ZNPmsFq_zInPnhzbraxuMfJNEHsUro3i7C_eNIHWmAc261FSqBcmuNFmDlLVl0-8jKNJ_/pub?gid=239334255&single=true&output=csv'
        };

        const configTitles = {
            'ao_seminar': "21st August 2026 - AO Seminar",
            'workshop_diabetic': "21st August 2026 - Diabetic Foot",
            'workshop_mis': "21st August 2026 - MIS Workshop",
            '22a': "22nd August 2026 - Hall A",

        };

        const buttonLabels = {
            'ao_seminar': "21 Aug: AO Seminar", 'workshop_diabetic': "21 Aug: Diabetic Foot", 'workshop_mis': "21 Aug: MIS",
            '22a': "22 Aug: Hall A", '22b': "22 Aug: Hall B", '23a': "23 Aug: Hall A", '23b': "23 Aug: Hall B"
        };

        let appData = {};
        let globalQuizzes = [];
        const CACHE_KEY = 'ifascon_schedule_cache_delegate_v40'; 
        const container = document.getElementById('contentContainer');
        let liveHall = new URLSearchParams(window.location.search).get('hall') || '22a'; 

        // MULTI-TIERED MATH ENGINE FOR DELEGATE APP
        async function fetchMathLeaderboard(type) {
            try {
                // Build a scoped Supabase query so only relevant rows are returned.
                let query = supabaseClient.from('quiz_responses').select('*').order('created_at', { ascending: true });

                // Scope by single hall or by grouped halls for cumulative views
                if (type === 'day1_cum') {
                    query = query.in('hall_id', ['22a','22b']);
                } else if (type === 'day2_cum') {
                    query = query.in('hall_id', ['23a','23b']);
                } else if (['22a','22b','23a','23b','ao_seminar','workshop_diabetic','workshop_mis'].includes(type)) {
                    query = query.eq('hall_id', type);
                } // else leave unfiltered for grand leaderboard

                const { data, error } = await query;
                if (error) throw error;

                let filteredData = data || [];
                let titleText = "";

                if (type === '22a') { titleText = "Day 1: Hall A Leaderboard"; }
                else if (type === '22b') { titleText = "Day 1: Hall B Leaderboard"; }
                else if (type === 'day1_cum') { titleText = "Day 1 Cumulative Leaders"; }
                else if (type === '23a') { titleText = "Day 2: Hall A Leaderboard"; }
                else if (type === '23b') { titleText = "Day 2: Hall B Leaderboard"; }
                else if (type === 'day2_cum') { titleText = "Day 2 Cumulative Leaders"; }
                else { titleText = "Grand Conference Leaderboard"; }

                let scores = {};
                filteredData.forEach(r => { scores[r.phone] = 0; }); 
                
                // Group correct responses by (hall + question) and de-duplicate by phone
                let qGroups = {};
                filteredData.forEach(r => {
                    if (!r.is_correct) return;
                    let key = (r.hall_id || 'none') + "___" + r.question; 
                    if (!qGroups[key]) qGroups[key] = [];
                    if (!qGroups[key].some(x => x.phone === r.phone)) {
                        qGroups[key].push(r);
                    }
                });
                
                Object.values(qGroups).forEach(responses => {
                    responses.forEach((r, idx) => {
                        let pts = Math.max(10 - idx, 1);
                        scores[r.phone] = (scores[r.phone] || 0) + pts;
                    });
                });
                
                let sorted = Object.entries(scores).sort((a,b) => b[1] - a[1]);
                return { sorted, titleText };
            } catch(e) { console.error(e); return { sorted: [], titleText: "Error Loading Board" }; }
        }

        function refreshIdentityStateUI() {
            let num = localStorage.getItem('delegate_phone');
            let loggedInView = document.getElementById('identityLoggedInState');
            let loggedOutView = document.getElementById('identityLoggedOutState');
            if (num && loggedInView && loggedOutView) {
                loggedOutView.classList.add('hidden');
                loggedInView.classList.remove('hidden');
                document.getElementById('identityBannerLabel').innerText = num;
            } else if (loggedInView && loggedOutView) {
                loggedInView.classList.add('hidden');
                loggedOutView.classList.remove('hidden');
            }
        }

        // Migrate legacy localStorage keys: remove answered_/marked_ entries that are NOT hall-scoped
        function migrateLocalStorageKeys() {
            try {
                const halls = Object.keys(configTitles);
                const keys = [];
                for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k) keys.push(k); }
                keys.forEach(k => {
                    if (!k) return;
                    if (k.startsWith('answered_') || k.startsWith('marked_')) {
                        // if key already includes one of the hall ids, keep it
                        const hasHall = halls.some(h => k.includes(h + '_') || k.includes('_' + h + '_'));
                        if (!hasHall) {
                            console.info('Migrating legacy key:', k, '-- removing to avoid stale lock');
                            localStorage.removeItem(k);
                        }
                    }
                });
            } catch (e) { console.warn('Migration failed', e); }
        }

        window.saveTopBannerIdentity = function() {
            let val = document.getElementById('topPhoneRegisterInput').value.trim();
            if (val.length >= 7) {
                localStorage.setItem('delegate_phone', val);
                refreshIdentityStateUI();
                updateLiveDisplay(true);
                updatePersistentFooter();
            } else { alert('Please supply a valid telephone number.'); }
        };

        window.clearDelegateIdentity = function() {
            localStorage.removeItem('delegate_phone');
            refreshIdentityStateUI();
            updateLiveDisplay(true);
            updatePersistentFooter();
        };

        async function initializeApp() {
            // Run migration to clear legacy non-hall-scoped cache so answers are not frozen
            migrateLocalStorageKeys();

            refreshIdentityStateUI();
            document.getElementById('liveDigitalClock').innerText = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });

            const cachedData = localStorage.getItem(CACHE_KEY);
            if (cachedData) {
                try {
                    let parsed = JSON.parse(cachedData);
                    appData = parsed.halls || {};
                    globalQuizzes = parsed.quizzes || [];
                    document.getElementById('loadingState').classList.add('hidden');
                    document.getElementById('staticHeader').classList.remove('hidden');
                    initLiveDashboard();
                    fetchLiveSchedule(true);
                } catch (e) { fetchLiveSchedule(false); }
            } else { fetchLiveSchedule(false); }
        }

        async function fetchLiveSchedule(isBackground = false) {
            let fetchedData = {};
            let quizzesLoaded = [];
            for (const [key, link] of Object.entries(sheetLinks)) {
                try {
                    const response = await fetch(link);
                    const csvText = await response.text();
                    let parsedCsv = Papa.parse(csvText, { header: false }).data;
                    
                    if (key === 'quizzes') {
                        quizzesLoaded = parseQuizData(parsedCsv);
                    } else if (key === 'ao') {
                        const allAo = parseRawData(parsedCsv, "21 Aug");
                        let sem = [], dia = [], mis = [];
                        let isWs = false, track = 'diabetic';
                        allAo.forEach(ev => {
                            let matchStr = `${ev.title} ${ev.time} ${ev.parent_session}`.toLowerCase();
                            if (/\b(workshop|16:15|16\.15)\b/i.test(matchStr)) isWs = true;
                            if (isWs) {
                                if (matchStr.includes('diabetic') || matchStr.includes('nebula')) track = 'diabetic';
                                else if (matchStr.includes('mis') || matchStr.includes('arthrex')) track = 'mis';
                                if (track === 'diabetic') { ev.hall = "Diabetic Foot Hall"; dia.push(ev); }
                                else { ev.hall = "MIS Hall"; mis.push(ev); }
                            } else { ev.hall = "AO Seminar Hall"; sem.push(ev); }
                        });
                        fetchedData['ao_seminar'] = { title: configTitles['ao_seminar'], events: sem };
                        fetchedData['workshop_diabetic'] = { title: configTitles['workshop_diabetic'], events: dia };
                        fetchedData['workshop_mis'] = { title: configTitles['workshop_mis'], events: mis };
                    } else {
                        fetchedData[key] = { title: configTitles[key], events: parseRawData(parsedCsv, configTitles[key]) };
                    }
                } catch(err) {}
            }
            if (Object.keys(fetchedData).length > 0) {
                appData = fetchedData;
                globalQuizzes = quizzesLoaded;
                localStorage.setItem(CACHE_KEY, JSON.stringify({ halls: appData, quizzes: globalQuizzes }));
                if (!isBackground && document.getElementById('loadingState')) { 
                    document.getElementById('loadingState').classList.add('hidden');
                    document.getElementById('staticHeader').classList.remove('hidden'); 
                    initLiveDashboard(); 
                } else { updateLiveDisplay(true); }
            }
        }

        function convertTo12HourFormat(timeStr) {
            if (!timeStr) return "";
            if (/[aApP][mM]/.test(timeStr)) { return timeStr; }
            return timeStr.replace(/\b([01]?[0-9]|2[0-3])[:.]([0-5][0-9])(?:[:.][0-9]{2})?\b/g, function(match, p1, p2) {
                let h = parseInt(p1, 10);
                let ampm = h >= 12 ? 'PM' : 'AM';
                h = h % 12;
                h = h ? h : 12; 
                let paddedH = h < 10 ? '0' + h : h;
                return paddedH + ':' + p2 + ' ' + ampm;
            });
        }

        function parseQuizData(rows) {
            let list = [];
            rows.forEach(r => {
                // Skip header row or empty rows
                if(!r[1] || r[1].toLowerCase().includes('question')) return;
                
                list.push({ 
                    type: 'quiz', 
                    hall_id: r[0].trim(), // New Column A
                    title: r[1].trim(),   // Column B
                    options: [r[2], r[3], r[4], r[5]].map(x => (x || "").trim()).filter(Boolean), // Columns C-F
                    correct: (r[6] || "").trim() // Column G
                });
            });
            return list;
        }
        function parseRawData(rows, hallTitle) {
            let events = [], current_session = "";
            rows.forEach(r => {
                while(r.length < 12) r.push("");
                r = r.map(x => (x || "").trim());
                let col0 = r[0], col1 = r[1], col2 = r[2], col3 = r[3];
                let colTitle = r[4] || r[5] || "", colSpeaker = r[4] ? r[5] : r[6];
                let colChair1 = r[4] ? r[6] : r[7], colChair2 = r[4] ? r[7] : r[8], colChair3 = r[4] ? r[8] : r[9];
                let row_text = r.join(" ").toLowerCase();

                if (row_text.includes("position:absolute") || row_text.includes("docs-drivelogo") || row_text.includes("<!doctype html>")) return; 
                if (col0.toLowerCase().includes("duration") && col1.toLowerCase().includes("from")) return;
                if (!col0 && !col1 && !col2 && !col3 && !colTitle) return;

                const breaks = ["break", "lunch", "banquet", "gbm", "valedictory", "inauguration", "registration"];
                let isBreakRow = breaks.some(b => row_text.includes(b)) && !row_text.includes("symposium") && !row_text.includes("session");
                
                if (isBreakRow || /\btea\b|\bcoffee\b/.test(row_text)) {
                    let text = colTitle || col3 || col0;
                    if (row_text.includes("registration")) text = "Registration";
                    else if (row_text.includes("lunch")) text = "Lunch";
                    else if (/\btea\b|\bcoffee\b/.test(row_text)) text = "Tea / Coffee Break";

                    let time_raw = (col1 && col2) ? `${col1} - ${col2}` : (col1 || col0);
                    let display_time = convertTo12HourFormat(time_raw);

                    let adLink = r.find(c => c.toLowerCase().includes('http')) || "";
                    events.push({ type: 'break', title: text, time: time_raw, display_time: display_time, speaker: '', chairpersons: '', hall: hallTitle, parent_session: '', adLink: adLink });
                    return;
                }

                let isQA = col3.toLowerCase().includes("q&a") || colTitle.toLowerCase().includes("discussion");
                let isPlenary = col3.toLowerCase().includes("plenary") || colTitle.toLowerCase().includes("plenary");
                let isSession = false, isOration = false;

                if (row_text.includes('oration')) { isSession = true; isOration = true; } 
                else if (!isQA && !isPlenary) {
                    if (!col1 && !col2 && !col0) isSession = true; 
                    else if (!col0 && col1 && col2 && !colTitle) isSession = true; 
                    else if (col3 && !colTitle && !colSpeaker) isSession = true; 
                    else if (row_text.includes('symposium') || row_text.includes('session') || row_text.includes('workshop')) isSession = true;
                }

                if (isSession) {
                    let topic = colTitle || col3 || (isOration ? "Oration" : "Session");
                    if (colTitle && col3 && colTitle.toLowerCase() !== col3.toLowerCase()) {
                        if (colTitle.toLowerCase().includes(col3.toLowerCase())) topic = colTitle;
                        else if (col3.toLowerCase().includes(colTitle.toLowerCase())) topic = col3;
                        else topic = col3 + ": " + colTitle;
                    }
                    let chairsArr = [isOration ? "" : colSpeaker, colChair1, colChair2, colChair3].filter(c => c && !["nan", "speaker", "chairperson"].includes(c.toLowerCase()));
                    current_session = topic; 
                    
                    let time_raw = (col1 && col2) ? `${col1} - ${col2}` : (col1 || col0);
                    let display_time = convertTo12HourFormat(time_raw);

                    events.push({ type: 'session', isOration: isOration, time: time_raw, display_time: display_time, title: topic, speaker: isOration ? (colSpeaker || "") : chairsArr.join(", "), chairpersons: isOration ? chairsArr.join(", ") : "", hall: hallTitle, parent_session: current_session });
                    return;
                }

                if (col1 || colTitle || isQA || isPlenary) {
                    let speaker = ["nan", "tbd"].includes(colSpeaker.toLowerCase()) ? "" : colSpeaker;
                    let time_raw = (col1 && col2) ? `${col1} - ${col2}` : (col1 || col0);
                    
                    if (col0 && !col0.toLowerCase().includes('duration')) {
                        time_raw = time_raw ? `${time_raw} (${col0.trim()})` : col0.trim();
                    }
                    
                    let display_time = convertTo12HourFormat(time_raw);
                    let displayTitle = (isQA && !colTitle) ? col3 : (colTitle || col3);

                    events.push({ type: 'presentation', time: time_raw, display_time: display_time, tag: (isQA && !colTitle) ? "Discussion" : col3, title: displayTitle, speaker: speaker, hall: hallTitle, parent_session: current_session });
                }
            });
            return events;
        }

        function parseTimeToMinutes(timeStr) {
            if (!timeStr) return null;
            const parts = timeStr.split('-')[0].trim().split(/[.:]/);
            if (parts.length < 2) return null;
            return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
        }

        function switchDelegateHall(newHall) {
            document.getElementById('quizRadarBanner').classList.add('hidden'); // Hide radar on shift
            liveHall = newHall;
            remoteOverrideIndex = null;
            quizStartTimeStamp = null;
            lastRenderHash = ""; 
            const newUrl = new URL(window.location); newUrl.searchParams.set('hall', newHall); window.history.pushState({}, '', newUrl);
            subscribeToHall(newHall); 
            updateLiveDisplay(true);
            updatePersistentFooter();
        }

        function subscribeToHall(hall_id) {
            if (window.currentSubscription) supabaseClient.removeChannel(window.currentSubscription);
            
            supabaseClient.from('hall_states').select('override_index, quiz_start_time, force_leaderboard').eq('hall_id', hall_id).single().then(({ data }) => {
                if (data) { 
                    remoteOverrideIndex = data.override_index; 
                    quizStartTimeStamp = data.quiz_start_time;
                    if (data.force_leaderboard && data.force_leaderboard !== 'none') showLeaderboard(data.force_leaderboard);
                    else hideLeaderboard();
                }
                lastRenderHash = ""; 
                updateLiveDisplay(true);
            });

            window.currentSubscription = supabaseClient.channel('delegate-feed-' + hall_id + '-' + Math.random().toString(36).substring(7))
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'hall_states', filter: `hall_id=eq.${hall_id}` },
                    (payload) => { 
                        remoteOverrideIndex = payload.new.override_index; 
                        quizStartTimeStamp = payload.new.quiz_start_time;
                        
                        let boardType = payload.new.force_leaderboard;
                        if (boardType && boardType !== 'none') showLeaderboard(boardType);
                        else hideLeaderboard();

                        lastRenderHash = ""; 
                        updateLiveDisplay(true); 
                    }
                ).subscribe();
        }

        function getLiveStatus(events) {
            const playableEvents = events.filter(e => {
                if (e.type === 'presentation' || e.type === 'break') return true;
                if (e.isOration && (e.speaker || '').trim() !== '') return true; 
                return false;
            });
            
            if (remoteOverrideIndex !== null) {
                if (remoteOverrideIndex < 0 && globalQuizzes.length > 0) {
                    return { currentEvent: globalQuizzes[Math.abs(remoteOverrideIndex) - 1], nextEvent: playableEvents[0] || null };
                }
                return { currentEvent: playableEvents[remoteOverrideIndex] || null, nextEvent: playableEvents[remoteOverrideIndex + 1] || null };
            }
            
            const currentMins = new Date().getHours() * 60 + new Date().getMinutes();
            let currentEvent = null, nextEvent = null;
            for (let i = 0; i < playableEvents.length; i++) {
                const ev = playableEvents[i];
                const evStart = parseTimeToMinutes(ev.time);
                
                let evEnd = null;
                if (ev.time && ev.time.includes('-')) {
                    let endStr = ev.time.split('-')[1].split('(')[0].trim();
                    let endParts = endStr.split(/[.:]/);
                    if(endParts.length >= 2) evEnd = parseInt(endParts[0], 10) * 60 + parseInt(endParts[1], 10);
                }
                if(evEnd === null && evStart !== null) evEnd = evStart + 15;
                
                if (evStart !== null && evEnd !== null) {
                    if (currentMins >= evStart && currentMins < evEnd) {
                        currentEvent = ev; 
                        if (ev.type === 'break' && i > 0 && playableEvents[i-1].type !== 'break') {
                            currentEvent = playableEvents[i-1];
                        }
                        if (i + 1 < playableEvents.length) nextEvent = playableEvents[i + 1]; 
                        break;
                    } else if (currentMins < evStart && !nextEvent) { nextEvent = ev; }
                }
            }
            return { currentEvent, nextEvent };
        }

        window.submitDelegateQuiz = async function(option, correctOption, questionText) {
    let phone = localStorage.getItem('delegate_phone');
    if (!phone) { alert("Please login first"); return; }
    
    // Key is now hall-specific so delegates can answer different quizzes
    let cleanKey = (liveHall + "_" + questionText).replace(/\W/g, '');
    localStorage.setItem('marked_' + cleanKey, option); 
    localStorage.setItem('answered_' + cleanKey, 'true');
    
    try {
        await supabaseClient.from('quiz_responses').insert([{ 
            phone: phone, 
            question: questionText, 
            hall_id: liveHall, // Explicitly saved
            is_correct: (option === correctOption) 
        }]);
    } catch(e) { console.error(e); }
    
    updateLiveDisplay(true);
    updatePersistentFooter();
};

        function initLiveDashboard() { 
            if (liveUpdateTimer) clearInterval(liveUpdateTimer);
            if (tickerTimer) clearInterval(tickerTimer);
            
            // NEW: Global Quiz Radar Background Listener!
            supabaseClient.channel('global-radar-feed')
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'hall_states' }, (payload) => {
                    let changedHall = payload.new.hall_id;
                    let oIdx = payload.new.override_index;
                    let lBoard = payload.new.force_leaderboard;
                    
                    if (changedHall === liveHall) {
                        // Leaderboard Force Command
                        if (lBoard && lBoard !== 'none') showLeaderboard(lBoard);
                        else hideLeaderboard();
                    } else {
                        // Remote Hall Quiz Alert Radar
                        if (oIdx !== null && oIdx < 0) {
                            document.getElementById('radarMessage').innerText = `A question just activated in ${buttonLabels[changedHall]}!`;
                            document.getElementById('radarJoinBtn').onclick = () => switchDelegateHall(changedHall);
                            document.getElementById('quizRadarBanner').classList.remove('hidden');
                        } else if (oIdx === null || oIdx >= 0) {
                            document.getElementById('quizRadarBanner').classList.add('hidden');
                        }
                    }
                }).subscribe();

            liveUpdateTimer = setInterval(() => {
                if (remoteOverrideIndex === null || remoteOverrideIndex >= 0) { updateLiveDisplay(false); }
                updatePersistentFooter(); 
            }, 15000); 
            
            tickerTimer = setInterval(() => {
                let clk = document.getElementById('liveDigitalClock');
                if(clk) clk.innerText = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });

                if (remoteOverrideIndex !== null && remoteOverrideIndex < 0 && quizStartTimeStamp) {
                    let diff = Math.floor((new Date() - new Date(quizStartTimeStamp)) / 1000);
                    let secondsLeft = 45 - diff;
                    let timerEl = document.getElementById('quizCountdownTimer');
                    
                    if (secondsLeft <= 0) {
                        if (timerEl && timerEl.dataset.expired !== "true") {
                            updateLiveDisplay(true); 
                        }
                    } else if (timerEl && timerEl.dataset.expired === "false") {
                        timerEl.innerHTML = `<i class="fas fa-hourglass-half mr-2 animate-spin"></i>${secondsLeft}s`;
                    }
                }
            }, 1000);
            
            subscribeToHall(liveHall); 
            updatePersistentFooter();
        }
