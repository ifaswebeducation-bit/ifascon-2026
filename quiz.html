<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFASCON Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-white p-6">
    <div id="hallSelect" class="flex flex-col gap-4">
        <h2 class="text-2xl font-bold mb-4">Which Hall are you in?</h2>
        <button onclick="setHall('22a')" class="bg-indigo-600 p-4 rounded-xl font-bold">Hall A</button>
        <button onclick="setHall('22b')" class="bg-indigo-600 p-4 rounded-xl font-bold">Hall B</button>
    </div>

    <div id="quizArea" class="hidden">
        <div id="statusMsg" class="text-center text-slate-400 mt-10">Waiting for AV to start quiz...</div>
        <div id="quizForm"></div>
    </div>

    <script>
        const supabaseClient = window.supabase.createClient('https://iiqxxxamsprzhzggsrer.supabase.co', 'sb_publishable_eYTrqO8dPDZj0mjbv3Csqg_dMrY2h3k');
        
        function setHall(hallId) {
            localStorage.setItem('user_hall', hallId);
            document.getElementById('hallSelect').classList.add('hidden');
            document.getElementById('quizArea').classList.remove('hidden');
            listenToQuiz(hallId);
        }

        function listenToQuiz(hallId) {
            supabaseClient.channel('quiz-sync')
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'hall_states', filter: `hall_id=eq.${hallId}` },
                    (payload) => {
                        if (payload.new.override_index < 0) {
                            renderQuiz(payload.new.override_index);
                        } else {
                            document.getElementById('quizForm').innerHTML = "";
                            document.getElementById('statusMsg').innerText = "Waiting for next quiz...";
                        }
                    }
                ).subscribe();
        }

        function renderQuiz(index) {
            // Logic to fetch quiz from cached CSV data and render
            document.getElementById('statusMsg').innerText = "Quiz Active!";
            // Render buttons here...
        }
    </script>
</body>
</html>
