<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IFASCON 2026 - AV Cockpit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .loader { border: 3px solid #334155; border-top: 3px solid #6366f1; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .animate-live { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        .audit-scroll::-webkit-scrollbar { width: 4px; }
        .audit-scroll::-webkit-scrollbar-thumb { background: #475569; rounded: 4px; }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden bg-slate-900">

    <!-- Auth Gate -->
    <div id="authGateFrame" class="fixed inset-0 bg-slate-950 z-[100] flex flex-col items-center justify-center p-6">
        <div class="bg-slate-900 border border-slate-700 p-8 rounded-3xl max-w-md w-full shadow-2xl text-center">
            <i class="fas fa-lock text-5xl text-indigo-400 mb-4"></i>
            <h3 class="text-2xl font-black mb-2 text-white">Event Cockpit</h3>
            <p class="text-slate-400 text-sm mb-6">Enter your assigned secure PIN.</p>
            <input type="password" id="gatePassInput" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white text-center text-2xl tracking-widest mb-4 font-mono outline-none focus:border-indigo-500" placeholder="••••">
            <button onclick="verifyGatePass()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl transition">Authenticate</button>
        </div>
    </div>

    <!-- AV Command Center -->
    <div id="masterToolbarSuite" class="hidden w-full bg-slate-950 border-b border-slate-700 p-4 shadow-2xl flex flex-col gap-3 text-white z-40 flex-shrink-0">
        
        <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-3 border-b border-slate-800 pb-3">
            <div class="flex items-center gap-2 flex-wrap w-full md:w-auto">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider mr-2"><i class="fas fa-user-shield mr-1"></i> <span id="mgrNameDisplay"></span>:</span>
                
                <!-- Hall Selector (Hidden for Floor Managers) -->
                <div id="adminHallNav" class="flex flex-wrap gap-1 hidden">
                    <button onclick="switchHallFeed('ao_seminar')" data-hall="ao_seminar" class="feed-btn px-2.5 py-1 rounded text-xs font-bold bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700">AO Sem</button>
                    <button onclick="switchHallFeed('workshop_diabetic')" data-hall="workshop_diabetic" class="feed-btn px-2.5 py-1 rounded text-xs font-bold bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700">Diabetic</button>
                    <button onclick="switchHallFeed('workshop_mis')" data-hall="workshop_mis" class="feed-btn px-2.5 py-1 rounded text-xs font-bold bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700">MIS</button>
                    <button onclick="switchHallFeed('22a')" data-hall="22a" class="feed-btn px-2.5 py-1 rounded text-xs font-bold bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700">22A</button>
                    <button onclick="switchHallFeed('22b')" data-hall="22b" class="feed-btn px-2.5 py-1 rounded text-xs font-bold bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700">22B</button>
                    <button onclick="switchHallFeed('23a')" data-hall="23a" class="feed-btn px-2.5 py-1 rounded text-xs font-bold bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700">23A</button>
                    <button onclick="switchHallFeed('23b')" data-hall="23b" class="feed-btn px-2.5 py-1 rounded text-xs font-bold bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700">23B</button>
                </div>
                <div id="floorManagerRoomLabel" class="text-sm font-black text-emerald-400 hidden uppercase tracking-widest bg-emerald-900/30 px-3 py-1 rounded-md border border-emerald-500/30">Locked to Room</div>
                <button onclick="logoutManager()" class="ml-auto md:ml-4 text-xs text-rose-400 font-bold border border-rose-900 px-2 py-1 rounded hover:bg-rose-900/50">Logout</button>
            </div>

            <div class="flex items-center gap-2 flex-wrap ml-auto">
                <button onclick="manualShift(-1)" class="bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg font-bold border border-slate-600 active:scale-95 transition text-xs">⬅ Prev</button>
                <button onclick="manualShift(1)" class="bg-indigo-600 hover:bg-indigo-500 px-3 py-1.5 rounded-lg font-bold shadow active:scale-95 transition text-xs">Next Talk ➔</button>
                <button onclick="resumeAutoSync()" class="bg-emerald-600/20 text-emerald-400 hover:bg-emerald-600/30 px-3 py-1.5 rounded-lg font-bold border border-emerald-500/30 active:scale-95 transition text-xs">Resume Auto</button>
            </div>
        </div>
        
        <div class="flex flex-col lg:flex-row gap-4">
            <!-- Left Side: Quiz & Leaderboard -->
            <div class="flex-1 flex flex-col gap-3 border-r border-slate-800 pr-4">
                <div id="quizControlBar" class="flex flex-col gap-2 pt-1">
                    <div class="flex items-center justify-between flex-wrap gap-2 mb-1">
                        <span class="text-xs font-bold text-rose-400 uppercase tracking-wider"><i class="fas fa-bolt mr-1.5"></i>Quiz Launcher:</span>
                        <div class="flex gap-2 w-full md:w-auto">
                            <select id="symposiumFilter" onchange="renderQuizCockpit()" class="bg-slate-900 border border-slate-700 text-white text-xs px-2 py-1.5 rounded outline-none font-bold w-full md:w-40">
                                <option value="ALL">All Symposiums</option>
                            </select>
                            <button onclick="terminateActiveQuiz()" class="bg-rose-600 text-white hover:bg-rose-500 px-3 py-1.5 rounded-lg font-bold active:scale-95 transition text-xs flex-shrink-0 shadow-lg">Clear Quiz</button>
                        </div>
                    </div>
                    <div id="quizButtonsContainer" class="w-full grid grid-cols-1 md:grid-cols-2 gap-2 max-h-32 overflow-y-auto pr-2"></div>
                </div>

                <div class="flex items-center gap-2 pt-2 border-t border-slate-800 flex-wrap">
                    <span class="text-xs font-bold text-amber-400 uppercase tracking-wider"><i class="fas fa-trophy mr-1.5"></i>Board:</span>
                    <button onclick="forceLeaderboardLocal(liveHall)" class="bg-amber-600 hover:bg-amber-500 text-slate-950 px-3 py-1.5 rounded-lg font-black shadow active:scale-95 transition text-xs">Force (This Hall)</button>
                    <button onclick="forceLeaderboardLocal('none')" class="bg-slate-800 text-rose-400 hover:bg-slate-700 px-3 py-1.5 rounded-lg font-bold border border-slate-700 active:scale-95 transition text-xs">Clear (This Hall)</button>
                </div>
            </div>

            <!-- Right Side: Master Audit Log (Admin Only) -->
            <div id="adminAuditPanel" class="w-full lg:w-1/3 hidden flex-col">
                <span class="text-xs font-bold text-emerald-400 uppercase tracking-wider mb-2"><i class="fas fa-satellite-dish mr-1"></i> Live Command Feed:</span>
                <div id="auditLogContainer" class="bg-slate-900 border border-slate-700 rounded-lg p-2 h-32 overflow-y-auto audit-scroll flex flex-col gap-1 text-[10px] font-mono text-slate-300">
                    <div class="text-slate-500 italic">Listening for floor commands...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Live Monitor (Same as before, trimmed for space here) -->
    <main class="flex-1 overflow-y-auto p-4 sm:p-10 relative max-w-7xl mx-auto w-full" id="contentContainer">
        <div id="loadingState" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900 z-30">
            <div class="loader mb-4"></div>
            <p class="text-slate-400 font-semibold text-lg animate-pulse mt-4">Syncing Engine...</p>
        </div>
        <div id="staticHeader" class="hidden flex justify-between items-center pb-6 mb-4 border-b border-slate-800">
            <h2 id="headerTitle" class="text-3xl lg:text-5xl font-black text-white leading-tight"></h2>
            <div class="text-3xl font-black text-white font-mono tracking-wider ml-auto bg-slate-800/80 px-5 py-3 rounded-2xl shadow-lg border border-slate-700" id="liveDigitalClock"></div>
        </div>
        <div id="dynamicContentWrapper"></div>
    </main>

    <script>
        const supabaseUrl = 'https://iiqxxxamsprzhzggsrer.supabase.co';
        const supabaseKey = 'sb_publishable_eYTrqO8dPDZj0mjbv3Csqg_dMrY2h3k';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        const sheetLinks = {
            'quizzes': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTRQ3g-iv-ZNPmsFq_zInPnhzbraxuMfJNEHsUro3i7C_eNIHWmAc261FSqBcmuNFmDlLVl0-8jKNJ_/pub?gid=1820023798&single=true&output=csv', 
            'ao': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTRQ3g-iv-ZNPmsFq_zInPnhzbraxuMfJNEHsUro3i7C_eNIHWmAc261FSqBcmuNFmDlLVl0-8jKNJ_/pub?gid=189655281&single=true&output=csv',
            '22a': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTRQ3g-iv-ZNPmsFq_zInPnhzbraxuMfJNEHsUro3i7C_eNIHWmAc261FSqBcmuNFmDlLVl0-8jKNJ_/pub?gid=0&single=true&output=csv',
            '22b': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTRQ3g-iv-ZNPmsFq_zInPnhzbraxuMfJNEHsUro3i7C_eNIHWmAc261FSqBcmuNFmDlLVl0-8jKNJ_/pub?gid=660947078&single=true&output=csv',
            '23a': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTRQ3g-iv-ZNPmsFq_zInPnhzbraxuMfJNEHsUro3i7C_eNIHWmAc261FSqBcmuNFmDlLVl0-8jKNJ_/pub?gid=1579973346&single=true&output=csv',
            '23b': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTRQ3g-iv-ZNPmsFq_zInPnhzbraxuMfJNEHsUro3i7C_eNIHWmAc261FSqBcmuNFmDlLVl0-8jKNJ_/pub?gid=239334255&single=true&output=csv'
        };

        const configTitles = {
            'ao_seminar': "21 Aug - AO Seminar", 'workshop_diabetic': "21 Aug - Diabetic Foot", 'workshop_mis': "21 Aug - MIS Workshop",
            '22a': "22 Aug - Hall A", '22b': "22 Aug - Hall B", '23a': "23 Aug - Hall A", '23b': "23 Aug - Hall B"
        };
        const allHallsList = Object.keys(configTitles);

        let appData = {};
        let globalQuizzes = [];
        let liveHall = new URLSearchParams(window.location.search).get('hall') || '22a';
        
        let manualOverrideIndex = null;
        let quizStartTimeStamp = null;
        let lastRenderHash = ""; 
        let liveUpdateTimer = null;
        let tickerTimer = null;

        // RBAC State
        let myName = "";
        let myRole = "";

        async function verifyGatePass() {
            let pin = document.getElementById('gatePassInput').value.trim();
            const { data, error } = await supabaseClient.from('event_managers').select('*').eq('pin', pin).single();
            
            if (data) {
                localStorage.setItem('mgr_pin', pin);
                localStorage.setItem('mgr_name', data.name);
                localStorage.setItem('mgr_role', data.role);
                localStorage.setItem('mgr_hall', data.assigned_hall);
                loadManagerContext();
            } else { alert('Invalid PIN or account not found.'); }
        }

        function loadManagerContext() {
            let pin = localStorage.getItem('mgr_pin');
            if(!pin) return;
            
            myName = localStorage.getItem('mgr_name');
            myRole = localStorage.getItem('mgr_role');
            let assignedHall = localStorage.getItem('mgr_hall');

            document.getElementById('mgrNameDisplay').innerText = myName;
            document.getElementById('authGateFrame').classList.add('hidden');
            document.getElementById('masterToolbarSuite').classList.remove('hidden');

            if(myRole === 'floor_manager') {
                liveHall = assignedHall; // Force lock
                document.getElementById('floorManagerRoomLabel').classList.remove('hidden');
                document.getElementById('floorManagerRoomLabel').innerText = "Locked to " + configTitles[liveHall];
            } else if (myRole === 'admin') {
                document.getElementById('adminHallNav').classList.remove('hidden');
                document.getElementById('adminAuditPanel').classList.remove('hidden');
                document.getElementById('adminAuditPanel').classList.add('flex');
                initAuditLogListener();
            }
            
            logAction("Logged into system.");
            fetchLiveSchedule();
        }

        function logoutManager() {
            localStorage.clear();
            location.reload();
        }

        async function logAction(actionDesc) {
            await supabaseClient.from('audit_logs').insert([{ manager_name: myName, action: actionDesc, hall_id: liveHall }]);
        }

        function initAuditLogListener() {
            supabaseClient.channel('custom-audit-channel')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'audit_logs' }, (payload) => {
                    let cont = document.getElementById('auditLogContainer');
                    let time = new Date(payload.new.created_at).toLocaleTimeString();
                    cont.innerHTML = `<div><span class="text-slate-500">[${time}]</span> <span class="text-amber-300">${payload.new.manager_name}</span> &gt; ${payload.new.action} (${payload.new.hall_id})</div>` + cont.innerHTML;
                }).subscribe();
        }

        // --- Standard Parsers (Includes Ad Engine Fix) ---
        async function fetchLiveSchedule() {
            let fetchedData = {};
            for (const [key, link] of Object.entries(sheetLinks)) {
                try {
                    const response = await fetch(link);
                    const csvText = await response.text();
                    let parsedCsv = Papa.parse(csvText, { header: false }).data;
                    
                    if (key === 'quizzes') {
                        parsedCsv.forEach(r => {
                            if(!r[0] || r[2] === undefined || r[2].toLowerCase().includes('question')) return;
                            globalQuizzes.push({ hall_id: (r[0]||"").trim(), symposium: (r[1]||"").trim(), title: (r[2]||"").trim(), options: [r[3], r[4], r[5], r[6]].map(x => (x||"").trim()).filter(Boolean), correct: (r[7]||"").trim(), type: 'quiz' });
                        });
                    } else if (key === 'ao') {
                        const allAo = parseRawData(parsedCsv, "21 Aug");
                        let sem = [], dia = [], mis = [];
                        allAo.forEach(ev => {
                            let m = `${ev.title} ${ev.time} ${ev.parent_session}`.toLowerCase();
                            if (/\b(workshop|16:15|16\.15)\b/i.test(m)) { (m.includes('diabetic') || m.includes('nebula')) ? dia.push(ev) : mis.push(ev); } 
                            else { sem.push(ev); }
                        });
                        fetchedData['ao_seminar'] = { title: configTitles['ao_seminar'], events: sem };
                        fetchedData['workshop_diabetic'] = { title: configTitles['workshop_diabetic'], events: dia };
                        fetchedData['workshop_mis'] = { title: configTitles['workshop_mis'], events: mis };
                    } else {
                        fetchedData[key] = { title: configTitles[key], events: parseRawData(parsedCsv, configTitles[key]) };
                    }
                } catch(err) {}
            }
            appData = fetchedData;
            
            let symps = [...new Set(globalQuizzes.map(q => q.symposium))].filter(Boolean);
            let dd = document.getElementById('symposiumFilter');
            symps.forEach(s => { dd.innerHTML += `<option value="${s}">${s}</option>`; });

            document.getElementById('loadingState').classList.add('hidden');
            document.getElementById('staticHeader').classList.remove('hidden');
            initLiveKiosk();
        }

        function convertTo12HourFormat(timeStr) {
            if (!timeStr) return "";
            if (/[aApP][mM]/.test(timeStr)) { return timeStr; }
            return timeStr.replace(/\b([01]?[0-9]|2[0-3])[:.]([0-5][0-9])(?:[:.][0-9]{2})?\b/g, function(match, p1, p2) {
                let h = parseInt(p1, 10);
                let ampm = h >= 12 ? 'PM' : 'AM';
                h = h % 12;
                return (h < 10 ? '0' + h : h) + ':' + p2 + ' ' + ampm;
            });
        }

        function parseRawData(rows, hallTitle) {
            let events = [], current_session = "";
            rows.forEach(r => {
                while(r.length < 12) r.push("");
                r = r.map(x => (x || "").trim());
                let col0 = r[0], col1 = r[1], col2 = r[2], col3 = r[3];
                let colTitle = r[4] || r[5] || "", colSpeaker = r[4] ? r[5] : r[6];
                let row_text = r.join(" ").toLowerCase();

                if (row_text.includes("position:absolute") || row_text.includes("docs-drivelogo") || row_text.includes("<!doctype html>")) return; 
                if (col0.toLowerCase().includes("duration") && col1.toLowerCase().includes("from")) return;
                if (!col0 && !col1 && !col2 && !col3 && !colTitle) return;

                const breaks = ["break", "lunch", "banquet", "inauguration", "registration"];
                if (breaks.some(b => row_text.includes(b)) && !row_text.includes("symposium") || /\btea\b|\bcoffee\b/.test(row_text)) {
                    let text = colTitle || col3 || col0;
                    if (row_text.includes("registration")) text = "Registration";
                    else if (row_text.includes("lunch")) text = "Lunch";
                    else if (/\btea\b|\bcoffee\b/.test(row_text)) text = "Tea / Coffee Break";
                    
                    let time_raw = (col1 && col2) ? `${col1} - ${col2}` : (col1 || col0);
                    let adLink = r.find(c => c.toLowerCase().includes('http')) || ""; // AD ENGINE FIX
                    events.push({ type: 'break', title: text, time: time_raw, display_time: convertTo12HourFormat(time_raw), hall: hallTitle, parent_session: '', adLink: adLink });
                    return;
                }

                let isQA = col3.toLowerCase().includes("q&a") || colTitle.toLowerCase().includes("discussion");
                let isSession = (!isQA && (!col1 && !col2 && !col0 || row_text.includes('symposium') || row_text.includes('session')));

                if (isSession) {
                    current_session = colTitle || col3 || "Session";
                    events.push({ type: 'session', time: (col1 && col2) ? `${col1} - ${col2}` : (col1 || col0), display_time: convertTo12HourFormat((col1 && col2) ? `${col1} - ${col2}` : (col1 || col0)), title: current_session, speaker: colSpeaker, hall: hallTitle, parent_session: current_session });
                    return;
                }

                if (col1 || colTitle || isQA) {
                    let time_raw = (col1 && col2) ? `${col1} - ${col2}` : (col1 || col0);
                    events.push({ type: 'presentation', time: time_raw, display_time: convertTo12HourFormat(time_raw), title: (isQA && !colTitle) ? col3 : (colTitle || col3), speaker: ["nan", "tbd"].includes(colSpeaker.toLowerCase()) ? "" : colSpeaker, hall: hallTitle, parent_session: current_session });
                }
            });
            return events;
        }

        // --- Commands ---
        window.renderQuizCockpit = function(activeSympName = "") {
            let container = document.getElementById('quizButtonsContainer');
            let filter = document.getElementById('symposiumFilter').value;
            let hallQuizzes = globalQuizzes.filter(q => q.hall_id === liveHall);
            if (filter !== 'ALL') hallQuizzes = hallQuizzes.filter(q => q.symposium === filter);

            if (hallQuizzes.length > 0) {
                let dashHtml = ``;
                hallQuizzes.forEach(q => {
                    let isRecommended = (activeSympName && (q.symposium||"").toLowerCase().trim() === activeSympName);
                    let globalIdx = globalQuizzes.findIndex(gx => gx === q);
                    dashHtml += `<button onclick="launchQuizByGlobalIndex(${globalIdx}, '${q.title.replace(/'/g, "\\'")}')" class="${isRecommended ? 'bg-amber-600/30 border-amber-500' : 'bg-slate-900 border-slate-600'} hover:bg-rose-600 border text-slate-300 hover:text-white px-2 py-1.5 rounded-lg text-[11px] font-bold transition text-left truncate w-full shadow-inner"><i class="fas fa-play text-rose-500 mr-1.5"></i> ${q.symposium ? `[${q.symposium}] ` : ''}${q.title}</button>`;
                });
                container.innerHTML = dashHtml;
            } else { container.innerHTML = `<span class="text-slate-500 text-xs italic">No quizzes routed here.</span>`; }
        };

        window.launchQuizByGlobalIndex = async function(idx, title) {
            manualOverrideIndex = -(idx + 1);
            let isoTime = new Date().toISOString();
            quizStartTimeStamp = isoTime; 
            updateLiveDisplay(true);
            logAction(`Launched Quiz: ${title}`);
            await supabaseClient.from('hall_states').update({ override_index: manualOverrideIndex, quiz_start_time: isoTime, force_leaderboard: null }).eq('hall_id', liveHall);
        };

        async function manualShift(step) {
            // Simplified logic: finds current index and moves
            const data = appData[liveHall]; if (!data) return;
            const playable = data.events.filter(e => e.type === 'presentation' || e.type === 'break');
            
            if (manualOverrideIndex === null || manualOverrideIndex < 0) {
                // Approximate current if null
                manualOverrideIndex = 0; 
            }
            let newIndex = Math.max(0, Math.min(manualOverrideIndex + step, playable.length - 1));
            manualOverrideIndex = newIndex;
            updateLiveDisplay(true);
            logAction(`Manually shifted schedule timeline to override index ${newIndex}`);
            await supabaseClient.from('hall_states').update({ override_index: manualOverrideIndex, quiz_start_time: null, force_leaderboard: null }).eq('hall_id', liveHall);
        }

        async function terminateActiveQuiz() {
            manualOverrideIndex = null; quizStartTimeStamp = null; updateLiveDisplay(true);
            logAction(`Cleared active quiz`);
            await supabaseClient.from('hall_states').update({ override_index: null, quiz_start_time: null }).eq('hall_id', liveHall);
        }

        async function resumeAutoSync() {
            manualOverrideIndex = null; quizStartTimeStamp = null; updateLiveDisplay(true);
            logAction(`Resumed Auto-Sync`);
            await supabaseClient.from('hall_states').update({ override_index: null, quiz_start_time: null, force_leaderboard: null }).eq('hall_id', liveHall);
        }

        window.forceLeaderboardLocal = async function(type) {
            logAction(`Forced Leaderboard command: ${type}`);
            await supabaseClient.from('hall_states').update({ force_leaderboard: type }).eq('hall_id', liveHall);
        };

        function switchHallFeed(newHall) {
            if(myRole === 'floor_manager') return; // Enforce lock
            liveHall = newHall; manualOverrideIndex = null; quizStartTimeStamp = null;
            lastRenderHash = ""; 
            try { const newUrl = new URL(window.location); newUrl.searchParams.set('hall', newHall); window.history.pushState({}, '', newUrl); } catch(e){}
            updateLiveDisplay(true);
        }

        function parseTimeToMinutes(timeStr) {
            if (!timeStr) return null;
            const parts = timeStr.split('-')[0].trim().split(/[.:]/);
            if (parts.length < 2) return null;
            return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
        }

        function getLiveStatus(events) {
            const playableEvents = events.filter(e => e.type === 'presentation' || e.type === 'break');
            if (manualOverrideIndex !== null) {
                if (manualOverrideIndex < 0 && globalQuizzes.length > 0) { return { currentEvent: globalQuizzes[Math.abs(manualOverrideIndex) - 1], nextEvent: playableEvents[0] || null }; }
                return { currentEvent: playableEvents[manualOverrideIndex] || null, nextEvent: playableEvents[manualOverrideIndex + 1] || null };
            }
            
            const currentMins = new Date().getHours() * 60 + new Date().getMinutes();
            let currentEvent = null, nextEvent = null;
            for (let i = 0; i < playableEvents.length; i++) {
                const evStart = parseTimeToMinutes(playableEvents[i].time);
                let evEnd = playableEvents[i].time.includes('-') ? parseTimeToMinutes(playableEvents[i].time.split('-')[1]) : (evStart !== null ? evStart + 15 : null);
                if (evStart !== null && evEnd !== null && currentMins >= evStart && currentMins < evEnd) {
                    currentEvent = playableEvents[i]; 
                    if (i + 1 < playableEvents.length) nextEvent = playableEvents[i + 1]; 
                    break;
                }
            }
            return { currentEvent, nextEvent };
        }

        function updateLiveDisplay(forceRender = false) {
            const data = appData[liveHall]; if (!data) return;
            
            document.querySelectorAll('.feed-btn').forEach(btn => {
                btn.className = "feed-btn px-2.5 py-1 rounded text-xs font-bold " + (btn.dataset.hall === liveHall ? "bg-indigo-600 text-white border border-indigo-500 shadow-md" : "bg-slate-800 text-slate-400 border border-slate-700 hover:bg-slate-700");
            });

            document.getElementById('headerTitle').innerText = data.title;
            const { currentEvent, nextEvent } = getLiveStatus(data.events);
            renderQuizCockpit(currentEvent && currentEvent.parent_session ? currentEvent.parent_session.toLowerCase().trim() : "");

            let newHash = (currentEvent ? currentEvent.title + currentEvent.time : "none") + "|" + (nextEvent ? nextEvent.title : "none") + "|" + manualOverrideIndex;
            if (!forceRender && newHash === lastRenderHash) return;
            lastRenderHash = newHash;

            let html = `<div class="text-center py-20 bg-slate-800/40 rounded-3xl border border-slate-800 my-8"><i class="fas fa-calendar-check text-6xl mb-4 text-slate-600"></i><h2 class="text-3xl font-bold text-slate-400">No Session Active</h2></div>`;
            
            if (currentEvent) {
                if (currentEvent.type === 'quiz') {
                    let secondsLeft = quizStartTimeStamp ? Math.max(0, 45 - Math.floor((new Date() - new Date(quizStartTimeStamp)) / 1000)) : 45;
                    if (secondsLeft > 0) {
                        html = `<div class="bg-gradient-to-b from-indigo-900/80 to-slate-900 rounded-3xl p-10 shadow-2xl mb-8 border-2 border-indigo-500"><div class="flex justify-between items-center mb-6"><span class="bg-rose-600 text-white px-4 py-1.5 rounded-full text-sm font-black uppercase"><i class="fas fa-bolt mr-2"></i> Live Quiz</span><span id="quizCountdownTimer" data-expired="false" class="bg-slate-950 border border-red-500 text-rose-500 font-mono text-3xl font-black px-5 py-2 rounded-2xl"><i class="fas fa-hourglass-half mr-2 animate-spin"></i>${secondsLeft}s</span></div><h1 class="text-5xl font-black text-white leading-tight mb-10">${currentEvent.title}</h1></div>`;
                    } else {
                        html = `<div class="bg-gradient-to-b from-slate-950 to-slate-900 rounded-3xl border-2 border-red-600 p-10 shadow-2xl mb-8"><span class="bg-red-600 text-white px-4 py-1.5 rounded-full text-sm font-black uppercase tracking-widest flex w-max"><i class="fas fa-stopwatch mr-2"></i> Time Up!</span><h1 class="text-3xl font-black text-slate-400 mt-6">${currentEvent.title}</h1></div>`;
                    }
                } else if (currentEvent.type === 'break') {
                    if (currentEvent.adLink) {
                        let link = currentEvent.adLink, media = '';
                        if (link.includes('youtube.com') || link.includes('youtu.be')) {
                            let ytMatch = link.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
                            if (ytMatch) media = `<iframe class="w-full aspect-video rounded-2xl pointer-events-none" src="https://www.youtube.com/embed/${ytMatch[1]}?autoplay=1&mute=1&loop=1&playlist=${ytMatch[1]}&controls=0&showinfo=0" frameborder="0" allow="autoplay"></iframe>`;
                        } else { media = `<img src="${link}" class="w-full h-auto max-h-[50vh] object-contain rounded-2xl bg-black">`; }
                        html = `<div class="mb-8 p-6 bg-slate-800 rounded-3xl">${media}</div>`;
                    } else {
                        html = `<div class="text-center py-24 bg-slate-800/50 rounded-3xl border border-slate-700 my-8 shadow-inner"><i class="fas fa-coffee text-7xl mb-6 text-amber-500 animate-pulse"></i><h2 class="text-4xl font-black text-white uppercase tracking-widest">${currentEvent.title}</h2></div>`;
                    }
                } else {
                    html = `<div class="bg-gradient-to-br from-slate-800 to-slate-800/80 border-2 border-slate-700/80 rounded-3xl p-10 shadow-2xl mb-8"><span class="bg-indigo-600 px-4 py-1.5 rounded-full text-sm font-black uppercase tracking-widest text-white shadow-lg mb-4 inline-block">LIVE NOW</span><h1 class="text-4xl font-black text-white leading-tight mb-8">${currentEvent.title}</h1><div class="text-2xl text-slate-300"><i class="fas fa-microphone text-indigo-400 mr-3"></i> ${currentEvent.speaker}</div></div>`;
                }
            }
            document.getElementById('dynamicContentWrapper').innerHTML = html;
        }

        function initLiveKiosk() {
            supabaseClient.from('hall_states').select('override_index, quiz_start_time').eq('hall_id', liveHall).single().then(({ data }) => {
                if (data) { manualOverrideIndex = data.override_index; quizStartTimeStamp = data.quiz_start_time; }
                updateLiveDisplay(true);
            });

            supabaseClient.channel('custom-live-channel')
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'hall_states', filter: `hall_id=eq.${liveHall}` },
                    (payload) => { manualOverrideIndex = payload.new.override_index; quizStartTimeStamp = payload.new.quiz_start_time; updateLiveDisplay(true); }
                ).subscribe();
            
            if (liveUpdateTimer) clearInterval(liveUpdateTimer);
            if (tickerTimer) clearInterval(tickerTimer);
            
            liveUpdateTimer = setInterval(() => { if (manualOverrideIndex === null || manualOverrideIndex >= 0) updateLiveDisplay(false); }, 15000);
            
            tickerTimer = setInterval(() => {
                let clk = document.getElementById('liveDigitalClock');
                if(clk) clk.innerText = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });

                if (manualOverrideIndex !== null && manualOverrideIndex < 0 && quizStartTimeStamp) {
                    let diff = Math.floor((new Date() - new Date(quizStartTimeStamp)) / 1000);
                    let secondsLeft = 45 - diff;
                    let timerEl = document.getElementById('quizCountdownTimer');
                    
                    if (secondsLeft <= 0 && timerEl && timerEl.dataset.expired !== "true") { updateLiveDisplay(true); } 
                    else if (timerEl && timerEl.dataset.expired === "false") { timerEl.innerHTML = `<i class="fas fa-hourglass-half mr-2 animate-spin"></i>${secondsLeft}s`; }
                }
            }, 1000);
        }

        if(localStorage.getItem('mgr_pin')) { loadManagerContext(); }
    </script>
</body>
</html>
