<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IFASCON 2026 - AV Cockpit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .loader { border: 3px solid #334155; border-top: 3px solid #6366f1; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .animate-live { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        .audit-scroll::-webkit-scrollbar { width: 4px; }
        .audit-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden bg-slate-900">

    <!-- Auth Gate -->
    <div id="authGateFrame" class="fixed inset-0 bg-slate-950 z-[100] flex flex-col items-center justify-center p-6">
        <div class="bg-slate-900 border border-slate-700 p-8 rounded-3xl max-w-md w-full shadow-2xl text-center">
            <i class="fas fa-lock text-5xl text-indigo-400 mb-4"></i>
            <h3 class="text-2xl font-black mb-2 text-white">Event Cockpit</h3>
            <p class="text-slate-400 text-sm mb-6">Enter your assigned secure PIN.</p>
            <input type="password" id="gatePassInput" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white text-center text-2xl tracking-widest mb-4 font-mono outline-none focus:border-indigo-500" placeholder="••••">
            <button onclick="verifyGatePass()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl transition shadow-lg">Authenticate</button>
        </div>
    </div>

    <!-- AV Command Center -->
    <div id="masterToolbarSuite" class="hidden w-full bg-slate-950 border-b border-slate-700 p-4 shadow-2xl flex flex-col gap-3 text-white z-40 flex-shrink-0">
        
        <!-- Top Row: Hall Selector & Timeline Controls -->
        <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-3 border-b border-slate-800 pb-3">
            <div class="flex items-center gap-2 flex-wrap w-full md:w-auto">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider mr-2"><i class="fas fa-user-shield mr-1"></i> <span id="mgrNameDisplay"></span>:</span>
                
                <div id="adminHallNav" class="flex flex-wrap gap-1 hidden">
                    <button onclick="switchHallFeed('ao_seminar')" data-hall="ao_seminar" class="feed-btn px-2.5 py-1 rounded text-xs font-bold bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700">AO Sem</button>
                    <button onclick="switchHallFeed('workshop_diabetic')" data-hall="workshop_diabetic" class="feed-btn px-2.5 py-1 rounded text-xs font-bold bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700">Diabetic</button>
                    <button onclick="switchHallFeed('workshop_mis')" data-hall="workshop_mis" class="feed-btn px-2.5 py-1 rounded text-xs font-bold bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700">MIS</button>
                    <button onclick="switchHallFeed('22a')" data-hall="22a" class="feed-btn px-2.5 py-1 rounded text-xs font-bold bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700">22A</button>
                    <button onclick="switchHallFeed('22b')" data-hall="22b" class="feed-btn px-2.5 py-1 rounded text-xs font-bold bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700">22B</button>
                    <button onclick="switchHallFeed('23a')" data-hall="23a" class="feed-btn px-2.5 py-1 rounded text-xs font-bold bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700">23A</button>
                    <button onclick="switchHallFeed('23b')" data-hall="23b" class="feed-btn px-2.5 py-1 rounded text-xs font-bold bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700">23B</button>
                </div>
                <div id="floorManagerRoomLabel" class="text-xs font-black text-emerald-400 hidden uppercase tracking-widest bg-emerald-900/30 px-2 py-1 rounded-md border border-emerald-500/30 ml-2">Authorized Scope Only</div>
                <button onclick="logoutManager()" class="ml-auto md:ml-4 text-xs text-rose-400 font-bold border border-rose-900 px-3 py-1 rounded hover:bg-rose-900/50 transition">Logout</button>
            </div>

            <div class="flex items-center gap-2 flex-wrap ml-auto w-full md:w-auto mt-2 md:mt-0">
                <button onclick="manualShift(-1)" class="bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg font-bold border border-slate-600 active:scale-95 transition text-xs">⬅ Prev</button>
                <button onclick="manualShift(1)" class="bg-indigo-600 hover:bg-indigo-500 px-3 py-1.5 rounded-lg font-bold shadow active:scale-95 transition text-xs">Next Talk ➔</button>
                <button onclick="resumeAutoSync()" class="bg-emerald-600/20 text-emerald-400 hover:bg-emerald-600/30 px-3 py-1.5 rounded-lg font-bold border border-emerald-500/30 active:scale-95 transition text-xs">Resume Auto</button>
            </div>
        </div>

        <!-- Quick Jump Engine -->
        <div class="flex flex-col sm:flex-row sm:items-center gap-2 pb-3 border-b border-slate-800">
            <span class="text-xs font-bold text-slate-400 uppercase tracking-wider w-32 flex-shrink-0"><i class="fas fa-search-location mr-1.5 text-indigo-400"></i>Jump to Event:</span>
            <select id="eventJumpSelect" onchange="jumpToEvent(this.value)" class="bg-slate-900 border border-slate-700 text-white text-xs px-3 py-2 rounded-lg outline-none font-bold w-full max-w-xl shadow-inner appearance-none">
                <option value="">-- Select an event to jump timeline directly --</option>
            </select>
        </div>
        
        <div class="flex flex-col lg:flex-row gap-6 pt-1">
            <!-- Left Side: Quiz & Media -->
            <div class="flex-1 flex flex-col gap-3 border-r border-slate-800 pr-4">
                
                <div id="quizControlBar" class="flex flex-col gap-2">
                    <div class="flex items-center justify-between flex-wrap gap-2 mb-1">
                        <span class="text-xs font-bold text-rose-400 uppercase tracking-wider"><i class="fas fa-bolt mr-1.5"></i>Smart Quiz Launcher:</span>
                        <div class="flex gap-2 w-full md:w-auto">
                            <select id="symposiumFilter" onchange="renderQuizCockpit()" class="bg-slate-900 border border-slate-700 text-white text-xs px-3 py-2 rounded-lg outline-none font-bold w-full md:w-48 shadow-inner">
                                <option value="ALL">All Symposiums</option>
                            </select>
                            <input type="text" id="quizSearch" onkeyup="renderQuizCockpit()" placeholder="Search..." class="bg-slate-900 border border-slate-700 text-white text-xs px-3 py-2 rounded-lg outline-none w-full md:w-32 shadow-inner">
                            <button onclick="terminateActiveQuiz()" class="bg-rose-600 text-white hover:bg-rose-500 px-4 py-2 rounded-lg font-bold active:scale-95 transition text-xs flex-shrink-0 shadow-lg">Clear Active Quiz</button>
                        </div>
                    </div>
                    <div id="quizButtonsContainer" class="w-full grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 max-h-32 overflow-y-auto pr-2"></div>
                </div>

                <!-- Sponsor Quick Play Media Buttons -->
                <div class="flex items-start gap-3 pt-3 border-t border-slate-800 flex-col sm:flex-row">
                    <span class="text-xs font-bold text-purple-400 uppercase tracking-wider pt-1 flex-shrink-0"><i class="fas fa-play-circle mr-1.5"></i>Sponsor Media:</span>
                    <div id="sponsorAdsContainer" class="flex flex-wrap gap-2 w-full"></div>
                </div>

                <div class="flex items-center gap-3 pt-3 border-t border-slate-800 flex-wrap">
                    <span class="text-xs font-bold text-amber-400 uppercase tracking-wider"><i class="fas fa-trophy mr-1.5"></i>Leaderboard:</span>
                    <button onclick="forceLeaderboardLocal(liveHall)" class="bg-amber-600 hover:bg-amber-500 text-slate-950 px-4 py-1.5 rounded-lg font-black shadow active:scale-95 transition text-xs">Force (This Hall)</button>
                    <button onclick="forceLeaderboardLocal('none')" class="bg-slate-800 text-rose-400 hover:bg-slate-700 px-4 py-1.5 rounded-lg font-bold border border-slate-700 active:scale-95 transition text-xs">Clear (This Hall)</button>
                    
                    <div id="adminGlobalBoardControls" class="hidden items-center gap-2 ml-auto">
                        <select id="boardTypeSelect" class="bg-slate-900 border border-slate-700 text-white text-xs px-2 py-1.5 rounded outline-none font-bold">
                            <option value="22a">Day 1: Hall A</option>
                            <option value="22b">Day 1: Hall B</option>
                            <option value="day1_cum">Day 1: Cumulative</option>
                            <option value="23a">Day 2: Hall A</option>
                            <option value="23b">Day 2: Hall B</option>
                            <option value="day2_cum">Day 2: Cumulative</option>
                            <option value="grand">Grand Overall</option>
                        </select>
                        <button onclick="showLeaderboard(document.getElementById('boardTypeSelect').value)" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-lg font-bold border border-indigo-500 active:scale-95 transition text-xs shadow">Show TV</button>
                    </div>
                </div>
            </div>

            <!-- Right Side: Master Audit Log -->
            <div id="adminAuditPanel" class="w-full lg:w-1/3 hidden flex-col">
                <span class="text-xs font-bold text-emerald-400 uppercase tracking-wider mb-2"><i class="fas fa-satellite-dish mr-1"></i> Live Command Feed:</span>
                <div id="auditLogContainer" class="bg-slate-950 border border-slate-700 rounded-lg p-3 h-48 overflow-y-auto audit-scroll flex flex-col gap-1.5 text-[11px] font-mono text-slate-300 shadow-inner">
                    <div class="text-slate-500 italic">Listening for floor commands...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Live Leaderboard Modal -->
    <div id="leaderboardModal" class="hidden fixed inset-0 bg-slate-950/95 backdrop-blur z-[60] flex flex-col items-center justify-center p-6">
        <h2 id="lbTitle" class="text-4xl lg:text-6xl font-black text-amber-500 mb-2 drop-shadow-lg"><i class="fas fa-trophy mr-4"></i>Top Performers</h2>
        <p id="lbSub" class="text-slate-400 font-bold tracking-widest uppercase mb-8">Calculating Live Database Weights...</p>
        <div id="leaderboardList" class="w-full max-w-3xl flex flex-col gap-4 max-h-[60vh] overflow-y-auto pr-4"></div>
        <button onclick="hideLeaderboard()" class="mt-10 bg-slate-800 hover:bg-slate-700 text-white border border-slate-600 px-8 py-4 rounded-xl font-bold text-xl shadow-lg transition">Close TV Board</button>
    </div>

    <main class="flex-1 overflow-y-auto p-6 sm:p-10 relative max-w-7xl mx-auto w-full" id="contentContainer">
        <div id="loadingState" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900 z-30">
            <div class="loader mb-4"></div>
            <p class="text-slate-400 font-semibold text-lg animate-pulse mt-4">Syncing Engine Schedule Database...</p>
        </div>

        <div id="staticHeader" class="hidden flex flex-col sm:flex-row justify-between items-center pb-6 mb-4 border-b border-slate-800 gap-4">
            <div class="flex-1 w-full sm:w-auto text-left">
                <h2 id="headerTitle" class="text-3xl sm:text-4xl lg:text-5xl font-black text-white tracking-tight leading-tight font-sans"></h2>
            </div>
            <div class="flex-shrink-0 mx-4">
                <div class="bg-white/95 p-3 rounded-2xl shadow-xl ring-1 ring-white/10 inline-block">
                    <img src="IFASCON chd logo.jpg" alt="IFASCON Logo" class="h-24 sm:h-32 w-auto object-contain" onerror="this.src='https://via.placeholder.com/250x80?text=IFASCON'">
                </div>
            </div>
            <div class="flex-1 w-full flex justify-end">
                <div class="bg-slate-800/80 border border-slate-700 px-6 py-4 rounded-2xl flex items-center shadow-lg">
                    <div class="text-3xl sm:text-4xl font-black text-white font-mono tracking-wider" id="liveDigitalClock"></div>
                </div>
            </div>
        </div>

        <div id="dynamicContentWrapper"></div>
    </main>

    <script>
        const supabaseUrl = 'https://iiqxxxamsprzhzggsrer.supabase.co';
        const supabaseKey = 'sb_publishable_eYTrqO8dPDZj0mjbv3Csqg_dMrY2h3k';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        const sheetLinks = {
            'quizzes': 'YOUR_CORRECT_QUIZ_CSV_LINK_HERE', // <--- PASTE YOUR QUIZ LINK HERE
            'ao': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTRQ3g-iv-ZNPmsFq_zInPnhzbraxuMfJNEHsUro3i7C_eNIHWmAc261FSqBcmuNFmDlLVl0-8jKNJ_/pub?gid=189655281&single=true&output=csv',
            '22a': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTRQ3g-iv-ZNPmsFq_zInPnhzbraxuMfJNEHsUro3i7C_eNIHWmAc261FSqBcmuNFmDlLVl0-8jKNJ_/pub?gid=0&single=true&output=csv',
            '22b': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTRQ3g-iv-ZNPmsFq_zInPnhzbraxuMfJNEHsUro3i7C_eNIHWmAc261FSqBcmuNFmDlLVl0-8jKNJ_/pub?gid=660947078&single=true&output=csv',
            '23a': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTRQ3g-iv-ZNPmsFq_zInPnhzbraxuMfJNEHsUro3i7C_eNIHWmAc261FSqBcmuNFmDlLVl0-8jKNJ_/pub?gid=1579973346&single=true&output=csv',
            '23b': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTRQ3g-iv-ZNPmsFq_zInPnhzbraxuMfJNEHsUro3i7C_eNIHWmAc261FSqBcmuNFmDlLVl0-8jKNJ_/pub?gid=239334255&single=true&output=csv'
        };

        const configTitles = {
            'ao_seminar': "21st August 2026 - AO Seminar", 'workshop_diabetic': "21st August 2026 - Diabetic Foot Workshop", 'workshop_mis': "21st August 2026 - MIS Workshop",
            '22a': "22nd August 2026 - Hall A", '22b': "22nd August 2026 - Hall B", '23a': "23rd August 2026 - Hall A", '23b': "23rd August 2026 - Hall B"
        };
        const allHallsList = Object.keys(configTitles);

        let appData = {};
        let globalQuizzes = [];
        let liveHall = new URLSearchParams(window.location.search).get('hall') || '22a';
        let manualOverrideIndex = null;
        let quizStartTimeStamp = null;
        let lastRenderHash = ""; 
        let liveUpdateTimer = null;
        let tickerTimer = null;

        let myName = "";
        let myRole = "";
        let myAllowedHalls = [];

        // --- Utility Functions ---
        function cleanText(val) { return val ? val.toString().replace(/\u00A0/g, ' ').replace(/\s+/g, ' ').trim() : ""; }
        
        function normalizeHallId(val) {
            if (!val) return "";
            let str = cleanText(val).toLowerCase().replace(/[^a-z0-9]/g, '');
            if (str.includes('ao') || str.includes('sem')) return 'ao_seminar';
            if (str.includes('diabet')) return 'workshop_diabetic';
            if (str.includes('mis')) return 'workshop_mis';
            if (str.includes('22a') || (str.includes('22') && str.includes('a'))) return '22a';
            if (str.includes('22b') || (str.includes('22') && str.includes('b'))) return '22b';
            if (str.includes('23a') || (str.includes('23') && str.includes('a'))) return '23a';
            if (str.includes('23b') || (str.includes('23') && str.includes('b'))) return '23b';
            return str;
        }

        // SMART ANSWER CHECKER
        function checkIfCorrect(optionText, correctAnswer, index) {
            let optClean = cleanText(optionText).toLowerCase();
            let corClean = cleanText(correctAnswer).toLowerCase();
            let letter = String.fromCharCode(65 + index).toLowerCase(); // a, b, c, d
            return optClean === corClean || corClean === letter || corClean === `option ${letter}` || corClean === `option-${letter}` || corClean === `${letter}.` || corClean === `${letter})`;
        }

        // --- AUTH & RBAC ---
        async function verifyGatePass() {
            let pin = document.getElementById('gatePassInput').value.trim();
            const { data, error } = await supabaseClient.from('event_managers').select('*').eq('pin', pin).single();
            if (data) {
                localStorage.setItem('mgr_pin', pin);
                localStorage.setItem('mgr_name', data.name);
                localStorage.setItem('mgr_role', data.role);
                localStorage.setItem('mgr_hall', data.assigned_hall);
                loadManagerContext();
            } else { alert('Invalid PIN or account not found.'); }
        }

        function loadManagerContext() {
            let pin = localStorage.getItem('mgr_pin');
            if(!pin) return;
            
            myName = localStorage.getItem('mgr_name');
            myRole = localStorage.getItem('mgr_role');
            let assignedHallRaw = localStorage.getItem('mgr_hall');
            
            myAllowedHalls = assignedHallRaw.split(',').map(s => normalizeHallId(s.trim()));

            document.getElementById('mgrNameDisplay').innerText = myName;
            document.getElementById('authGateFrame').classList.add('hidden');
            document.getElementById('masterToolbarSuite').classList.remove('hidden');

            if (myRole === 'admin' || assignedHallRaw === 'ALL') {
                document.getElementById('adminHallNav').classList.remove('hidden');
                document.getElementById('adminAuditPanel').classList.remove('hidden');
                document.getElementById('adminAuditPanel').classList.add('flex');
                document.getElementById('adminGlobalBoardControls').classList.remove('hidden');
                document.getElementById('adminGlobalBoardControls').classList.add('flex');
                initAuditLogListener();
            } 
            else if (myRole === 'floor_manager') {
                document.getElementById('adminHallNav').classList.remove('hidden');
                document.querySelectorAll('#adminHallNav .feed-btn').forEach(btn => {
                    if (!myAllowedHalls.includes(btn.dataset.hall)) btn.classList.add('hidden');
                });
                if (!myAllowedHalls.includes(liveHall)) liveHall = myAllowedHalls[0];
                document.getElementById('floorManagerRoomLabel').classList.remove('hidden');
            }
            logAction("Logged into system.");
            fetchLiveSchedule();
        }

        function logoutManager() { localStorage.clear(); location.reload(); }
        async function logAction(actionDesc) { await supabaseClient.from('audit_logs').insert([{ manager_name: myName, action: actionDesc, hall_id: liveHall }]); }

        function initAuditLogListener() {
            supabaseClient.channel('custom-audit-channel')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'audit_logs' }, (payload) => {
                    let cont = document.getElementById('auditLogContainer');
                    let time = new Date(payload.new.created_at).toLocaleTimeString();
                    cont.innerHTML = `<div class="border-b border-slate-800 pb-1.5 mb-1.5"><span class="text-slate-500">[${time}]</span> <span class="text-amber-300 font-bold">${payload.new.manager_name}</span> &gt; ${payload.new.action} <span class="text-slate-500">(${payload.new.hall_id})</span></div>` + cont.innerHTML;
                }).subscribe();
        }

        // --- MATH ENGINE ---
        async function fetchMathLeaderboard(type) {
            try {
                const { data, error } = await supabaseClient.from('quiz_responses').select('*').order('created_at', { ascending: true });
                if (error) throw error;
                let filteredData = data;
                let titleText = "";

                if (type === '22a') { filteredData = data.filter(d => d.hall_id === '22a'); titleText = "Day 1: Hall A Leaderboard"; }
                else if (type === '22b') { filteredData = data.filter(d => d.hall_id === '22b'); titleText = "Day 1: Hall B Leaderboard"; }
                else if (type === 'day1_cum') { filteredData = data.filter(d => d.hall_id === '22a' || d.hall_id === '22b'); titleText = "Day 1 Cumulative Leaders"; }
                else if (type === '23a') { filteredData = data.filter(d => d.hall_id === '23a'); titleText = "Day 2: Hall A Leaderboard"; }
                else if (type === '23b') { filteredData = data.filter(d => d.hall_id === '23b'); titleText = "Day 2: Hall B Leaderboard"; }
                else if (type === 'day2_cum') { filteredData = data.filter(d => d.hall_id === '23a' || d.hall_id === '23b'); titleText = "Day 2 Cumulative Leaders"; }
                else { titleText = "Grand Conference Leaderboard"; }

                let scores = {};
                filteredData.forEach(r => { scores[r.phone] = 0; }); 
                let qGroups = {};
                filteredData.forEach(r => {
                    if (!r.is_correct) return;
                    let key = r.hall_id + "_" + r.question; 
                    if (!qGroups[key]) qGroups[key] = [];
                    if (!qGroups[key].some(x => x.phone === r.phone)) { qGroups[key].push(r); }
                });
                Object.values(qGroups).forEach(responses => { responses.forEach((r, idx) => { scores[r.phone] += Math.max(10 - idx, 1); }); });
                return { sorted: Object.entries(scores).sort((a,b) => b[1] - a[1]), titleText };
            } catch(e) { return { sorted: [], titleText: "Error Loading Board" }; }
        }

        window.showLeaderboard = async function(presetType) {
            let type = presetType || document.getElementById('boardTypeSelect').value;
            document.getElementById('leaderboardModal').classList.remove('hidden');
            document.getElementById('leaderboardList').innerHTML = '<div class="loader mt-6"></div>';
            let mathResults = await fetchMathLeaderboard(type);
            document.getElementById('lbTitle').innerHTML = `<i class="fas fa-trophy mr-4 text-amber-400"></i> ${mathResults.titleText}`;
            document.getElementById('lbSub').innerText = "Real-time Rankings Computed";
            let sorted = mathResults.sorted;
            if (sorted.length === 0) { document.getElementById('leaderboardList').innerHTML = '<div class="text-center text-slate-400 text-2xl font-bold py-10">No scores logged yet.</div>'; return; }
            document.getElementById('leaderboardList').innerHTML = sorted.map((item, index) => {
                let ob = item[0].substring(0, 2) + '******' + item[0].slice(-2);
                let trophy = index === 0 ? 'text-amber-400' : index === 1 ? 'text-slate-300' : index === 2 ? 'text-amber-700' : 'text-indigo-400';
                return `<div class="flex justify-between items-center bg-slate-800 p-5 rounded-2xl border border-slate-600 shadow-xl"><div class="text-2xl font-bold text-white"><i class="fas fa-medal mr-4 ${trophy}"></i>${ob}</div><div class="text-3xl font-black text-emerald-400">${item[1]} pts</div></div>`;
            }).join('');
        };
        window.hideLeaderboard = function() { document.getElementById('leaderboardModal').classList.add('hidden'); };

        // --- PARSING ---
        async function fetchLiveSchedule() {
            let fetchedData = {};
            let quizzesLoaded = [];
            for (const [key, link] of Object.entries(sheetLinks)) {
                try {
                    const response = await fetch(link);
                    const csvText = await response.text();
                    let parsedCsv = Papa.parse(csvText, { header: false, skipEmptyLines: true }).data;
                    
                    if (key === 'quizzes') {
                        let colOffset = 0;
                        if (parsedCsv.length > 1) {
                            let firstRow = parsedCsv[1];
                            let cell0 = cleanText(firstRow[0]);
                            if (/^\d{1,4}$/.test(cell0) || cell0.includes('/')) colOffset = 1;
                        }

                        parsedCsv.forEach((r, idx) => {
                            if (idx === 0 || !r || r.length < 3) return;
                            
                            let rawHall = cleanText(r[0 + colOffset]);
                            let rawSymp = cleanText(r[1 + colOffset]);
                            let rawTitle = cleanText(r[2 + colOffset]);

                            if (!rawTitle || rawTitle.toLowerCase() === 'question' || rawTitle.toLowerCase() === 'title') return;

                            quizzesLoaded.push({ 
                                hall_id: normalizeHallId(rawHall), 
                                symposium: rawSymp || 'General', 
                                title: rawTitle, 
                                options: [cleanText(r[3 + colOffset]), cleanText(r[4 + colOffset]), cleanText(r[5 + colOffset]), cleanText(r[6 + colOffset])].filter(Boolean), 
                                correct: cleanText(r[7 + colOffset]), 
                                type: 'quiz' 
                            });
                        });
                    } else if (key === 'ao') {
                        const allAo = parseRawData(parsedCsv, "21 Aug");
                        let sem = [], dia = [], mis = [];
                        allAo.forEach(ev => {
                            let matchStr = `${ev.title} ${ev.time} ${ev.parent_session}`.toLowerCase();
                            if (/\b(workshop|16:15|16\.15)\b/i.test(matchStr)) { (matchStr.includes('diabetic') || matchStr.includes('nebula')) ? dia.push(ev) : mis.push(ev); } 
                            else { sem.push(ev); }
                        });
                        fetchedData['ao_seminar'] = { title: configTitles['ao_seminar'], events: sem };
                        fetchedData['workshop_diabetic'] = { title: configTitles['workshop_diabetic'], events: dia };
                        fetchedData['workshop_mis'] = { title: configTitles['workshop_mis'], events: mis };
                    } else { fetchedData[key] = { title: configTitles[key], events: parseRawData(parsedCsv, configTitles[key]) }; }
                } catch(err) { console.error("Error fetching schedule data"); }
            }
            
            appData = fetchedData;
            globalQuizzes = quizzesLoaded;
            
            let symps = [...new Set(globalQuizzes.map(q => q.symposium))].filter(Boolean);

            document.getElementById('loadingState').classList.add('hidden');
            document.getElementById('staticHeader').classList.remove('hidden');

        }

        function convertTo12HourFormat(timeStr) {
            if (!timeStr) return "";
            if (/[aApP][mM]/.test(timeStr)) { return timeStr; }
            return timeStr.replace(/\b([01]?[0-9]|2[0-3])[:.]([0-5][0-9])(?:[:.][0-9]{2})?\b/g, function(match, p1, p2) {
                let h = parseInt(p1, 10);
                return (h % 12 || 12) + ':' + p2 + ' ' + (h >= 12 ? 'PM' : 'AM');
            });
        }

        function parseRawData(rows, hallTitle) {
            let events = [], current_session = "";
            const breakRegex = /\b(break|lunch|banquet|gbm|valedictory|inauguration|registration|tea|coffee|sponsor|commercial|ad|video)\b/;

            rows.forEach(r => {
                while(r.length < 12) r.push("");
                r = r.map(x => cleanText(x));
                let col0 = r[0], col1 = r[1], col2 = r[2], col3 = r[3];
                let colTitle = r[4] || r[5] || "", colSpeaker = r[4] ? r[5] : r[6];
                let colChair1 = r[4] ? r[6] : r[7], colChair2 = r[4] ? r[7] : r[8], colChair3 = r[4] ? r[8] : r[9];
                let row_text = r.join(" ").toLowerCase();

                if (row_text.includes("position:absolute") || row_text.includes("docs-drivelogo") || row_text.includes("<!doctype html>")) return; 
                if (col0.toLowerCase().includes("duration") && col1.toLowerCase().includes("from")) return;
                if (!col0 && !col1 && !col2 && !col3 && !colTitle) return;

                let isBreakOrAd = breakRegex.test(row_text) && !row_text.includes("symposium") && !row_text.includes("session");
                
                if (isBreakOrAd) {
                    let text = colTitle || col3 || col0;
                    if (row_text.includes("registration")) text = "Registration";
                    else if (row_text.includes("lunch")) text = "Lunch";
                    else if (/\btea\b|\bcoffee\b/.test(row_text) && !row_text.includes("sponsor") && !row_text.includes("ad")) text = "Tea / Coffee Break";
                    
                    let time_raw = (col1 && col2) ? `${col1} - ${col2}` : (col1 || col0);
                    let display_time = convertTo12HourFormat(time_raw);
                    let adLink = r.find(c => c.toLowerCase().includes('http')) || "";
                    events.push({ type: 'break', title: text, time: time_raw, display_time: display_time, speaker: '', chairpersons: '', hall: hallTitle, parent_session: '', adLink: adLink });
                    return;
                }

                let isQA = col3.toLowerCase().includes("q&a") || colTitle.toLowerCase().includes("discussion");
                let isPlenary = col3.toLowerCase().includes("plenary") || colTitle.toLowerCase().includes("plenary");
                let isSession = false, isOration = false;
                
                if (row_text.includes('oration')) { isSession = true; isOration = true; } 
                else if (!isQA && !isPlenary) {
                    if (!col1 && !col2 && !col0) isSession = true; 
                    else if (!col0 && col1 && col2 && !colTitle) isSession = true; 
                    else if (col3 && !colTitle && !colSpeaker) isSession = true; 
                    else if (row_text.includes('symposium') || row_text.includes('session') || row_text.includes('workshop')) isSession = true;
                }

                if (isSession) {
                    let topic = colTitle || col3 || (isOration ? "Oration" : "Session");
                    if (colTitle && col3 && colTitle.toLowerCase() !== col3.toLowerCase()) {
                        if (colTitle.toLowerCase().includes(col3.toLowerCase())) topic = colTitle;
                        else if (col3.toLowerCase().includes(colTitle.toLowerCase())) topic = col3;
                        else topic = col3 + ": " + colTitle;
                    }
                    let chairsArr = [isOration ? "" : colSpeaker, colChair1, colChair2, colChair3].filter(c => c && !["nan", "speaker", "chairperson"].includes(c.toLowerCase()));
                    current_session = topic; 
                    
                    let time_raw = (col1 && col2) ? `${col1} - ${col2}` : (col1 || col0);
                    events.push({ type: 'session', isOration: isOration, time: time_raw, display_time: convertTo12HourFormat(time_raw), title: topic, speaker: isOration ? (colSpeaker || "") : chairsArr.join(", "), chairpersons: isOration ? chairsArr.join(", ") : "", hall: hallTitle, parent_session: current_session });
                    return;
                }

                if (col1 || colTitle || isQA || isPlenary) {
                    let speaker = ["nan", "tbd"].includes(colSpeaker.toLowerCase()) ? "" : colSpeaker;
                    let time_raw = (col1 && col2) ? `${col1} - ${col2}` : (col1 || col0);
                    if (col0 && !col0.toLowerCase().includes('duration')) { time_raw = time_raw ? `${time_raw} (${col0.trim()})` : col0.trim(); }
                    events.push({ type: 'presentation', time: time_raw, display_time: convertTo12HourFormat(time_raw), tag: (isQA && !colTitle) ? "Discussion" : col3, title: (isQA && !colTitle) ? col3 : (colTitle || col3), speaker: speaker, hall: hallTitle, parent_session: current_session });
                }
            });
            return events;
        }

        window.renderQuizCockpit = function(activeSympName = "") {
            let container = document.getElementById('quizButtonsContainer');

            let filterEl = document.getElementById('symposiumFilter');
            let filter = filterEl ? cleanText(filterEl.value) : 'ALL';

            let search = searchEl ? cleanText(searchEl.value).toLowerCase() : '';

            let targetHall = cleanText(liveHall).toLowerCase().replace(/[^a-z0-9]/g, '');

            let hallQuizzes = globalQuizzes.filter(q => {
                if (!q.hall_id) return true;
                let qHall = cleanText(q.hall_id).toLowerCase().replace(/[^a-z0-9]/g, '');
                
                if (qHall === targetHall || qHall === 'all') return true;
                if (targetHall.includes('22a') && (qHall === '22a' || qHall === 'halla' || qHall === 'a')) return true;
                if (targetHall.includes('22b') && (qHall === '22b' || qHall === 'hallb' || qHall === 'b')) return true;
                if (targetHall.includes('23a') && (qHall === '23a' || qHall === 'halla' || qHall === 'a')) return true;
                if (targetHall.includes('23b') && (qHall === '23b' || qHall === 'hallb' || qHall === 'b')) return true;
                if (targetHall.includes('ao') && qHall.includes('ao')) return true;
                if (targetHall.includes('diabet') && qHall.includes('diabet')) return true;
                if (targetHall.includes('mis') && qHall.includes('mis')) return true;
                return false;
            });

            if (hallQuizzes.length === 0 && globalQuizzes.length > 0) hallQuizzes = [...globalQuizzes];

            if (filterEl) {
                let currentVal = filterEl.value;
                let availableSymps = [...new Set(hallQuizzes.map(q => cleanText(q.symposium)))].filter(Boolean);
                let currentOptions = Array.from(filterEl.options).map(o => o.value);
                
                let isMatch = availableSymps.length === (currentOptions.length - 1) && availableSymps.every(s => currentOptions.includes(s));
                if (!isMatch) {
                    let optsHtml = `<option value="ALL">All Symposiums</option>`;
                    availableSymps.forEach(s => { optsHtml += `<option value="${s}">${s}</option>`; });
                    filterEl.innerHTML = optsHtml;
                    filterEl.value = currentOptions.includes(currentVal) ? currentVal : 'ALL';
                    filter = filterEl.value;
                }
            }

            let displayQuizzes = hallQuizzes;
            if (filter && filter !== 'ALL') {
                let cleanFilter = cleanText(filter).toLowerCase();
                displayQuizzes = displayQuizzes.filter(q => cleanText(q.symposium).toLowerCase() === cleanFilter);
            }

            if (search) {
                displayQuizzes = displayQuizzes.filter(q => 
                    cleanText(q.title).toLowerCase().includes(search) || 
                    cleanText(q.symposium).toLowerCase().includes(search)
                );
            }

            if (displayQuizzes.length > 0) {
                let groups = {};
                displayQuizzes.forEach(q => {
                    let symp = cleanText(q.symposium) || 'General Symposium';
                    if (!groups[symp]) groups[symp] = [];
                    groups[symp].push(q);
                });

                let dashHtml = '';
                let cleanActiveSymp = cleanText(activeSympName).toLowerCase();

                for (let [symp, qs] of Object.entries(groups)) {
                    let cleanSymp = cleanText(symp).toLowerCase();

                    let blockStyle = isRecommended ? "border-amber-500 bg-amber-500/10 shadow-[0_0_15px_rgba(245,158,11,0.15)] order-first" : "border-slate-700 bg-slate-800/40";
                    let headerStyle = isRecommended ? "text-amber-400 font-black" : "text-slate-300 font-bold";
                    let badge = isRecommended ? `<span class="bg-amber-500 text-slate-900 px-2 py-0.5 rounded text-[9px] font-black uppercase tracking-widest ml-2 animate-pulse shadow-md">Live Match</span>` : "";

                    dashHtml += `
                        <div class="border rounded-xl p-3 flex flex-col ${blockStyle} col-span-full md:col-span-1 lg:col-span-1">
                            <div class="text-[11px] mb-3 flex items-center justify-between"><span class="${headerStyle} truncate" title="${symp}">${symp}</span> ${badge}</div>
                            <div class="flex flex-col gap-2">`;
                    qs.forEach(q => {
                        let globalIdx = globalQuizzes.indexOf(q);
                        let safeTitle = cleanText(q.title).replace(/'/g, "\\'").replace(/"/g, '&quot;');
                        dashHtml += `<button onclick="launchQuizByGlobalIndex(${globalIdx}, '${safeTitle}')" class="bg-slate-900 hover:bg-rose-600 border border-slate-600 hover:border-rose-500 text-slate-300 hover:text-white px-3 py-2 rounded-lg text-[11px] font-bold transition text-left truncate w-full shadow-inner"><i class="fas fa-play text-rose-500 mr-2"></i> ${q.title}</button>`;
                    });
                    dashHtml += `   </div></div>`;
                }
                container.innerHTML = dashHtml;

        window.manualShift = async function(step) {
            const data = appData[liveHall]; if (!data) return;
            const playableEvents = data.events.filter(e => {
                if (e.type === 'presentation' || e.type === 'break') return true;
                if (e.isOration && (e.speaker || '').trim() !== '') return true; 
                return false;
            });
            
            if (manualOverrideIndex === null || manualOverrideIndex < 0) {
                const { currentEvent } = getLiveStatus(data.events);
                manualOverrideIndex = playableEvents.indexOf(currentEvent);
                if (manualOverrideIndex === -1) manualOverrideIndex = 0;
            }
            
            let newIndex = manualOverrideIndex + step;
            if (newIndex < 0) newIndex = 0;
            if (newIndex >= playableEvents.length) newIndex = playableEvents.length - 1;
            
            manualOverrideIndex = newIndex;
            updateLiveDisplay(true);
            logAction(`Timeline Shift: Manually moved to Index ${newIndex}`);

        function getLiveStatus(events) {
            const playableEvents = events.filter(e => {
                if (e.type === 'presentation' || e.type === 'break') return true;
                if (e.isOration && (e.speaker || '').trim() !== '') return true; 
                return false;
            });
            
            if (manualOverrideIndex !== null) {
                if (manualOverrideIndex < 0 && globalQuizzes.length > 0) {
                    return { currentEvent: globalQuizzes[Math.abs(manualOverrideIndex) - 1], nextEvent: playableEvents[0] || null };
                }
                return { currentEvent: playableEvents[manualOverrideIndex] || null, nextEvent: playableEvents[manualOverrideIndex + 1] || null };
            }
            
            const currentMins = new Date().getHours() * 60 + new Date().getMinutes();
            let currentEvent = null, nextEvent = null;

            for (let i = 0; i < playableEvents.length; i++) {
                const ev = playableEvents[i];
                const evStart = parseTimeToMinutes(ev.time);
                let evEnd = (ev.time && ev.time.includes('-')) ? parseTimeToMinutes(ev.time.split('-')[1].trim()) : (evStart !== null ? evStart + 15 : null);
                
                if (evStart !== null && evEnd !== null) {
                    if (currentMins >= evStart && currentMins < evEnd) {
                        currentEvent = ev; 
                        if (ev.type === 'break' && i > 0 && playableEvents[i-1].type !== 'break') { currentEvent = playableEvents[i-1]; }
                        if (i + 1 < playableEvents.length) nextEvent = playableEvents[i + 1]; 
                        break;
                    } else if (currentMins < evStart && !nextEvent) { nextEvent = ev; }
                }
            }
            return { currentEvent, nextEvent };
        }

                                    ${currentEvent.options.map((opt, i) => `<div class="bg-slate-800/80 border border-slate-600 p-6 rounded-2xl text-2xl text-slate-200 font-semibold shadow-inner flex items-center"><span class="bg-slate-900 px-4 py-2 rounded shadow-inner text-indigo-400 mr-4 font-black">${String.fromCharCode(65+i)}</span> ${opt}</div>`).join('')}

                                <div class="flex justify-between items-center mb-6">

                                        let badge = isCorrect ? `<span class="bg-amber-500 text-slate-950 px-3 py-1 rounded-md ml-auto text-xs font-black uppercase tracking-wider"><i class="fas fa-check mr-1"></i> Correct Answer</span>` : '';
                                        return `<div class="border p-5 rounded-2xl text-xl flex items-center ${stateClass}"><span class="bg-slate-950 px-4 py-1.5 rounded text-sm mr-4 font-black">${String.fromCharCode(65+i)}</span> ${opt} ${badge}</div>`;

                                </div>

                    }
                } else if (currentEvent.type === 'break') {
                    if (currentEvent.adLink) {
                        let link = currentEvent.adLink, media = '';
                        if (link.includes('youtube.com') || link.includes('youtu.be')) {
                            let ytMatch = link.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
                            if (ytMatch) media = `<iframe class="w-full aspect-video rounded-3xl shadow-2xl border border-slate-700 pointer-events-none" src="https://www.youtube.com/embed/${ytMatch[1]}?autoplay=1&mute=1&loop=1&playlist=${ytMatch[1]}&controls=0&showinfo=0&modestbranding=1" frameborder="0" allow="autoplay; encrypted-media"></iframe>`;

                            if (fId) media = `<img src="https://lh3.googleusercontent.com/d/${fId[0]}" class="w-full h-auto max-h-[50vh] object-contain rounded-3xl bg-black border border-slate-700 shadow-2xl">`;
                        } else { media = `<img src="${link}" class="w-full h-auto max-h-[50vh] object-contain rounded-3xl bg-black border border-slate-700 shadow-2xl">`; }

                        nowPlayingHtml = `<div class="mb-8 p-6 bg-slate-800 rounded-3xl border border-slate-700 shadow-2xl"><div class="flex items-center justify-between mb-4"><span class="bg-amber-500 text-slate-900 px-4 py-1.5 rounded-full text-sm font-black"><i class="fas fa-play-circle mr-2"></i> ${currentEvent.title}</span><span class="text-xl font-bold text-slate-400">${currentEvent.display_time}</span></div>${media}</div>`;
                    } else {
                        let breakIcon = "fa-coffee", iconColor = "text-amber-500";
                        const lowTitle = currentEvent.title.toLowerCase();
                        if (lowTitle.includes('lunch')) { breakIcon = "fa-utensils"; iconColor = "text-emerald-500"; }
                        else if (lowTitle.includes('banquet') || lowTitle.includes('dinner')) { breakIcon = "fa-glass-cheers"; iconColor = "text-purple-500"; }
                        else if (lowTitle.includes('registration')) { breakIcon = "fa-id-badge"; iconColor = "text-blue-400"; }

                        nowPlayingHtml = `<div class="text-center py-24 bg-slate-800/50 rounded-3xl border border-slate-700 my-8 shadow-inner"><i class="fas ${breakIcon} text-7xl mb-6 ${iconColor} animate-pulse drop-shadow"></i><h2 class="text-4xl font-black text-white uppercase tracking-widest">${currentEvent.title}</h2><p class="text-2xl text-slate-400 mt-3 font-semibold">${currentEvent.display_time}</p></div>`;
                    }
                } else {
                    let bStyle = currentEvent.isOration ? "bg-rose-600" : "bg-indigo-600";
                    let pSess = currentEvent.parent_session && currentEvent.parent_session !== currentEvent.title && !currentEvent.parent_session.toLowerCase().includes('oration') ? `<div class="text-indigo-400 font-bold uppercase text-base sm:text-xl mb-3 flex items-center"><i class="fas fa-layer-group mr-2 text-sm"></i>${currentEvent.parent_session}</div>` : '';
                    
                    nowPlayingHtml = `
                        <div class="bg-gradient-to-br from-slate-800 to-slate-800/80 border-2 border-slate-700/80 rounded-3xl p-6 sm:p-10 shadow-2xl mb-8">
                            <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
                                <span class="animate-live ${bStyle} px-4 py-1.5 rounded-full text-sm font-black uppercase tracking-widest flex items-center shadow-lg"><span class="w-2.5 h-2.5 bg-white rounded-full mr-2.5"></span> LIVE NOW</span>
                                <span class="text-xl sm:text-2xl font-bold text-slate-300 bg-slate-900/60 px-4 py-1.5 rounded-xl border border-slate-700/50 shadow-inner"><i class="far fa-clock mr-2 text-indigo-400"></i>${currentEvent.display_time}</span>
                            </div>
                            ${pSess}
                            <h1 class="text-3xl sm:text-5xl lg:text-6xl font-black text-white leading-tight mb-8">${currentEvent.title}</h1>
                            ${currentEvent.speaker ? `<div class="flex items-center bg-slate-900/90 p-5 sm:p-6 rounded-2xl border border-slate-700/80 shadow-inner inline-flex max-w-full"><div class="w-12 h-12 sm:w-16 sm:h-16 rounded-2xl bg-indigo-500/20 text-indigo-400 flex items-center justify-center text-2xl sm:text-3xl mr-4 sm:mr-6 flex-shrink-0 border border-indigo-500/30"><i class="fas fa-microphone"></i></div><div><span class="block text-xs uppercase tracking-widest text-slate-400 font-bold mb-0.5">Speaker</span><span class="text-xl sm:text-3xl font-extrabold text-white leading-snug">${currentEvent.speaker}</span></div></div>` : ''}
                        </div>`;
                }
            }

            let upNextHtml = '';
            if (nextEvent && nextEvent.type !== 'quiz') {
                upNextHtml = `
                    <div class="bg-slate-800/40 border border-slate-700/60 rounded-2xl p-6 sm:p-8 flex flex-col sm:flex-row sm:items-center justify-between gap-4 shadow-lg mb-4">
                        <div class="flex-1"><span class="text-xs font-black uppercase tracking-widest text-amber-400 block mb-1.5 flex items-center"><i class="fas fa-step-forward mr-2"></i>Coming Up Next &bull; ${nextEvent.display_time}</span><h4 class="text-xl sm:text-2xl font-bold text-slate-200 leading-snug">${nextEvent.title}</h4>${nextEvent.speaker ? `<p class="text-slate-400 font-semibold text-base mt-2 flex items-center"><i class="fas fa-user-md mr-2 text-indigo-400"></i>${nextEvent.speaker}</p>` : ''}</div>
                        <div class="sm:text-right flex-shrink-0"><span class="inline-block bg-slate-800 text-slate-400 font-bold text-xs px-3 py-1.5 rounded-lg border border-slate-700 uppercase tracking-wider shadow-inner">${nextEvent.type === 'break' ? 'Break' : 'Session'}</span></div>
                    </div>`;
            }

            document.getElementById('dynamicContentWrapper').innerHTML = nowPlayingHtml + upNextHtml;
        }

        function initLiveKiosk() {
            populateEventJump();
            
            supabaseClient.from('hall_states').select('override_index, quiz_start_time').eq('hall_id', liveHall).single().then(({ data }) => {
                if (data) { manualOverrideIndex = data.override_index; quizStartTimeStamp = data.quiz_start_time; }
                updateLiveDisplay(true);
            });

            supabaseClient.channel('custom-live-channel')
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'hall_states', filter: `hall_id=eq.${liveHall}` },
                    (payload) => { manualOverrideIndex = payload.new.override_index; quizStartTimeStamp = payload.new.quiz_start_time; updateLiveDisplay(true); }
                ).subscribe();
            
            if (liveUpdateTimer) clearInterval(liveUpdateTimer);
            if (tickerTimer) clearInterval(tickerTimer);
            
            liveUpdateTimer = setInterval(() => { if (manualOverrideIndex === null || manualOverrideIndex >= 0) updateLiveDisplay(false); }, 15000);
            
            tickerTimer = setInterval(() => {
                let clk = document.getElementById('liveDigitalClock');
                if(clk) clk.innerText = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });

                if (manualOverrideIndex !== null && manualOverrideIndex < 0 && quizStartTimeStamp) {
                    let diff = Math.floor((new Date() - new Date(quizStartTimeStamp)) / 1000);
                    let secondsLeft = 45 - diff;
                    
                    if (secondsLeft <= 0) {
                        if (!window.quizExpiredRendered) { window.quizExpiredRendered = true; updateLiveDisplay(true); }
                    } else {
                        window.quizExpiredRendered = false;
                        let timerEl = document.getElementById('quizCountdownTimer');
                        if (timerEl && timerEl.dataset.expired === "false") { timerEl.innerHTML = `<i class="fas fa-hourglass-half mr-2 animate-spin"></i>${secondsLeft}s`; }
                    }
                } else { window.quizExpiredRendered = false; }
            }, 1000);
        }

        if(localStorage.getItem('mgr_pin')) { loadManagerContext(); }
    </script>
</body>
</html>
