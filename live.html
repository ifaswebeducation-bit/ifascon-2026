<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IFASCON 2026 - AV Broadcaster</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        .loader { border: 3px solid #334155; border-top: 3px solid #6366f1; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse-fast { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.8; transform: scale(0.98); } }
        .animate-live { animation: pulse-fast 2s infinite ease-in-out; }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden bg-slate-900">

    <div id="manualOverridePanel" class="hidden fixed top-0 left-0 w-full bg-slate-950/95 border-b border-slate-700 p-4 z-50 shadow-2xl backdrop-blur flex flex-col gap-3 text-white">
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 border-b border-slate-800 pb-3">
            <div class="flex items-center gap-3">
                <span class="bg-amber-500 text-slate-950 font-black px-2.5 py-1 rounded text-xs uppercase tracking-wider animate-pulse">AV Control Panel</span>
                <span class="text-xs sm:text-sm text-slate-300">Overriding live timeline state. Select a custom slot or resume automatic tracking.</span>
            </div>
            <div class="flex items-center gap-2 w-full sm:w-auto justify-end flex-wrap">
                <button onclick="manualShift(-1)" class="bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg font-bold border border-slate-600 active:scale-95 transition text-sm">⬅ Prev Talk</button>
                <button onclick="manualShift(1)" class="bg-indigo-600 hover:bg-indigo-500 px-3 py-1.5 rounded-lg font-bold shadow active:scale-95 transition text-sm">Next Talk ➔</button>
                <button onclick="resumeAutoSync()" class="bg-rose-600/20 text-rose-400 hover:bg-rose-600/30 px-3 py-1.5 rounded-lg font-bold border border-rose-500/30 active:scale-95 transition text-sm">Resume Auto</button>
                <button onclick="toggleManualPanel()" class="bg-slate-800 text-slate-400 hover:text-white px-2.5 py-1.5 rounded-lg font-bold border border-slate-700 active:scale-95 transition text-sm"><i class="fas fa-times"></i></button>
            </div>
        </div>
        
        <div id="quizControlBar" class="flex items-center gap-2 pt-1 border-b border-slate-800 pb-3 flex-wrap">
            <span class="text-xs font-bold text-rose-400 uppercase tracking-wider"><i class="fas fa-bolt mr-1.5"></i>Launch Quiz:</span>
            <div id="quizButtonsContainer" class="flex flex-wrap gap-1.5"></div>
        </div>

        <div class="flex items-center justify-between flex-wrap gap-2 pt-1">
            <span class="text-xs font-bold text-slate-400 uppercase tracking-wider"><i class="fas fa-tv mr-1.5 text-indigo-400"></i>Switch TV Feed:</span>
            <div class="flex items-center gap-1.5 flex-wrap">
                <button onclick="switchHallFeed('ao_seminar')" id="feed-ao_seminar" class="feed-btn px-2.5 py-1 rounded text-xs font-bold bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700">21 Aug: AO Seminar</button>
                <button onclick="switchHallFeed('workshop_diabetic')" id="feed-workshop_diabetic" class="feed-btn px-2.5 py-1 rounded text-xs font-bold bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700">21 Aug: Diabetic Foot</button>
                <button onclick="switchHallFeed('workshop_mis')" id="feed-workshop_mis" class="feed-btn px-2.5 py-1 rounded text-xs font-bold bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700">21 Aug: MIS</button>
                <button onclick="switchHallFeed('22a')" id="feed-22a" class="feed-btn px-2.5 py-1 rounded text-xs font-bold bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700">22 Aug: Hall A</button>
                <button onclick="switchHallFeed('22b')" id="feed-22b" class="feed-btn px-2.5 py-1 rounded text-xs font-bold bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700">22 Aug: Hall B</button>
                <button onclick="switchHallFeed('23a')" id="feed-23a" class="feed-btn px-2.5 py-1 rounded text-xs font-bold bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700">23 Aug: Hall A</button>
                <button onclick="switchHallFeed('23b')" id="feed-23b" class="feed-btn px-2.5 py-1 rounded text-xs font-bold bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700">23 Aug: Hall B</button>
            </div>
        </div>
    </div>

    <div id="leaderboardModal" class="hidden fixed inset-0 bg-slate-950/95 backdrop-blur z-[60] flex flex-col items-center justify-center p-6">
        <h2 class="text-5xl lg:text-7xl font-black text-amber-500 mb-8 drop-shadow-lg"><i class="fas fa-trophy mr-4"></i>Top Quiz Performers</h2>
        <div id="leaderboardList" class="w-full max-w-3xl flex flex-col gap-4"></div>
        <button onclick="hideLeaderboard()" class="mt-10 bg-slate-800 hover:bg-slate-700 text-white border border-slate-600 px-8 py-4 rounded-xl font-bold text-xl shadow-lg transition">Close Leaderboard</button>
    </div>

    <main class="flex-1 overflow-y-auto p-6 sm:p-10 relative max-w-7xl mx-auto w-full" id="contentContainer">
        <div id="loadingState" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900 z-50">
            <div class="loader mb-4"></div>
            <p class="text-slate-400 font-semibold text-lg animate-pulse" id="loadingText">Connecting to Live Hall Feed...</p>
        </div>
    </main>

    <script>
        // --- SECURE SUPABASE RUNTIME CREDENTIALS ---
        const supabaseUrl = 'https://iiqxxxamsprzhzggsrer.supabase.co';
        const supabaseKey = 'sb_publishable_eYTrqO8dPDZj0mjbv3Csqg_dMrY2h3k';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        const sheetLinks = {
            'quizzes': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTRQ3g-iv-ZNPmsFq_zInPnhzbraxuMfJNEHsUro3i7C_eNIHWmAc261FSqBcmuNFmDlLVl0-8jKNJ_/pub?gid=2142278070&single=true&output=csv', // Sub-sheet connection
            'ao': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTRQ3g-iv-ZNPmsFq_zInPnhzbraxuMfJNEHsUro3i7C_eNIHWmAc261FSqBcmuNFmDlLVl0-8jKNJ_/pub?gid=189655281&single=true&output=csv',
            '22a': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTRQ3g-iv-ZNPmsFq_zInPnhzbraxuMfJNEHsUro3i7C_eNIHWmAc261FSqBcmuNFmDlLVl0-8jKNJ_/pub?gid=0&single=true&output=csv',
            '22b': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTRQ3g-iv-ZNPmsFq_zInPnhzbraxuMfJNEHsUro3i7C_eNIHWmAc261FSqBcmuNFmDlLVl0-8jKNJ_/pub?gid=660947078&single=true&output=csv',
            '23a': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTRQ3g-iv-ZNPmsFq_zInPnhzbraxuMfJNEHsUro3i7C_eNIHWmAc261FSqBcmuNFmDlLVl0-8jKNJ_/pub?gid=1579973346&single=true&output=csv',
            '23b': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTRQ3g-iv-ZNPmsFq_zInPnhzbraxuMfJNEHsUro3i7C_eNIHWmAc261FSqBcmuNFmDlLVl0-8jKNJ_/pub?gid=239334255&single=true&output=csv'
        };

        const configTitles = {
            'ao_seminar': "21st August' 2026 - AO Trauma Foot & Ankle Seminar",
            'workshop_diabetic': "21st August' 2026 - Diabetic Foot Workshop",
            'workshop_mis': "21st August' 2026 - MIS Workshop",
            '22a': "22nd August' 2026 - Day 1 Hall A",
            '22b': "22nd August' 2026 - Day 1 Hall B",
            '23a': "23rd August' 2026 - Day 2 Hall A",
            '23b': "23rd August' 2026 - Day 2 Hall B"
        };

        let appData = {};
        let globalQuizzes = [];
        const CACHE_KEY = 'ifascon_schedule_cache_v21'; 
        const container = document.getElementById('contentContainer');
        
        let liveHall = new URLSearchParams(window.location.search).get('hall') || 'ao_seminar';
        if (liveHall === 'ao') liveHall = 'ao_seminar';
        if (liveHall === 'ao_workshops') liveHall = 'workshop_diabetic';
        
        let manualOverrideIndex = null;
        let liveUpdateTimer = null;

        async function initializeApp() {
            const cachedData = localStorage.getItem(CACHE_KEY);
            if (cachedData) {
                try {
                    let parsed = JSON.parse(cachedData);
                    appData = parsed.halls || {};
                    globalQuizzes = parsed.quizzes || [];
                    document.getElementById('loadingState').classList.add('hidden');
                    initLiveKiosk();
                    fetchLiveSchedule(true);
                } catch (e) { fetchLiveSchedule(false); }
            } else { fetchLiveSchedule(false); }
        }

        async function fetchLiveSchedule(isBackground = false) {
            let fetchedData = {};
            let quizzesLoaded = [];
            
            for (const [key, link] of Object.entries(sheetLinks)) {
                try {
                    const response = await fetch(link);
                    const csvText = await response.text();
                    let parsedCsv = Papa.parse(csvText, { header: false }).data;
                    
                    if (key === 'quizzes') {
                        quizzesLoaded = parseQuizData(parsedCsv);
                    } else if (key === 'ao') {
                        const allAo = parseRawData(parsedCsv, "21 Aug");
                        let sem = [], dia = [], mis = [];
                        let isWs = false, track = 'diabetic';
                        allAo.forEach(ev => {
                            let matchStr = `${ev.title} ${ev.time} ${ev.parent_session}`.toLowerCase();
                            if (/\b(workshop|16:15|16\.15)\b/i.test(matchStr)) isWs = true;
                            if (isWs) {
                                if (matchStr.includes('diabetic') || matchStr.includes('nebula')) track = 'diabetic';
                                else if (matchStr.includes('mis') || matchStr.includes('arthrex')) track = 'mis';
                                if (track === 'diabetic') { ev.hall = "Diabetic Foot Hall"; dia.push(ev); }
                                else { ev.hall = "MIS Hall"; mis.push(ev); }
                            } else { ev.hall = "AO Seminar Hall"; sem.push(ev); }
                        });
                        fetchedData['ao_seminar'] = { title: configTitles['ao_seminar'], events: sem };
                        fetchedData['workshop_diabetic'] = { title: configTitles['workshop_diabetic'], events: dia };
                        fetchedData['workshop_mis'] = { title: configTitles['workshop_mis'], events: mis };
                    } else {
                        fetchedData[key] = { title: configTitles[key], events: parseRawData(parsedCsv, configTitles[key]) };
                    }
                } catch(err) { console.error("Error fetching " + key, err); }
            }
            
            if (Object.keys(fetchedData).length > 0) {
                appData = fetchedData;
                globalQuizzes = quizzesLoaded;
                localStorage.setItem(CACHE_KEY, JSON.stringify({ halls: appData, quizzes: globalQuizzes }));
                if (!isBackground) {
                    document.getElementById('loadingState').classList.add('hidden');
                    initLiveKiosk();
                } else if (manualOverrideIndex === null) { updateLiveDisplay(); }
            }
        }

        function parseQuizData(rows) {
            let list = [];
            rows.forEach(r => {
                if(!r[0] || r[0].toLowerCase().includes('question')) return;
                list.push({
                    type: 'quiz',
                    title: r[0].trim(),
                    options: [r[1], r[2], r[3], r[4]].map(x => (x || "").trim()).filter(Boolean),
                    correct: (r[5] || "").trim()
                });
            });
            return list;
        }

        function parseRawData(rows, hallTitle) {
            let events = [], current_session = "";
            rows.forEach(r => {
                while(r.length < 12) r.push("");
                r = r.map(x => (x || "").trim());
                let col0 = r[0], col1 = r[1], col2 = r[2], col3 = r[3];
                let colTitle = r[4] || r[5] || "", colSpeaker = r[4] ? r[5] : r[6];
                let colChair1 = r[4] ? r[6] : r[7], colChair2 = r[4] ? r[7] : r[8], colChair3 = r[4] ? r[8] : r[9];
                let row_text = r.join(" ").toLowerCase();

                if (row_text.includes("position:absolute") || row_text.includes("docs-drivelogo") || row_text.includes("<!doctype html>")) return; 
                if (col0.toLowerCase().includes("duration") && col1.toLowerCase().includes("from")) return;
                if (!col0 && !col1 && !col2 && !col3 && !colTitle) return;

                const breaks = ["break", "lunch", "tea", "coffee", "registration", "inauguration", "banquet", "gbm", "valedictory"];
                if (breaks.some(b => row_text.includes(b)) && !row_text.includes("symposium") && !row_text.includes("session")) {
                    let text = colTitle || col3 || col0;
                    if (row_text.includes("registration")) text = "Registration";
                    else if (row_text.includes("lunch")) text = "Lunch";
                    else if (row_text.includes("coffee") || row_text.includes("tea")) text = "Tea / Coffee Break";
                    
                    let adLink = r.find(c => c.toLowerCase().includes('http')) || "";
                    events.push({ type: 'break', title: text, time: (col1 && col2) ? `${col1} - ${col2}` : (col1 || col0), speaker: '', hall: hallTitle, parent_session: '', adLink: adLink });
                    return;
                }

                let isQA = col3.toLowerCase().includes("q&a") || colTitle.toLowerCase().includes("discussion");
                let isPlenary = col3.toLowerCase().includes("plenary") || colTitle.toLowerCase().includes("plenary");
                let isSession = false, isOration = false;
                
                if (row_text.includes('oration')) { isSession = true; isOration = true; } 
                else if (!isQA && !isPlenary) {
                    if (!col1 && !col2 && !col0) isSession = true; 
                    else if (!col0 && col1 && col2 && !colTitle) isSession = true; 
                    else if (col3 && !colTitle && !colSpeaker) isSession = true; 
                    else if (row_text.includes('symposium') || row_text.includes('session') || row_text.includes('workshop')) isSession = true;
                }

                if (isSession) {
                    let topic = colTitle || col3 || (isOration ? "Oration" : "Session");
                    if (colTitle && col3 && colTitle.toLowerCase() !== col3.toLowerCase()) {
                        if (colTitle.toLowerCase().includes(col3.toLowerCase())) topic = colTitle;
                        else if (col3.toLowerCase().includes(colTitle.toLowerCase())) topic = col3;
                        else topic = col3 + ": " + colTitle;
                    }
                    let chairsArr = [isOration ? "" : colSpeaker, colChair1, colChair2, colChair3].filter(c => c && !["nan", "speaker", "chairperson"].includes(c.toLowerCase()));
                    current_session = topic; 
                    events.push({ type: 'session', isOration: isOration, time: (col1 && col2) ? `${col1} - ${col2}` : (col1 || col0), title: topic, speaker: isOration ? (colSpeaker || "") : chairsArr.join(", "), chairpersons: isOration ? chairsArr.join(", ") : "", hall: hallTitle, parent_session: current_session });
                    return;
                }

                if (col1 || colTitle || isQA || isPlenary) {
                    let speaker = ["nan", "tbd"].includes(colSpeaker.toLowerCase()) ? "" : colSpeaker;
                    let time_display = (col1 && col2) ? `${col1} - ${col2}` : col1;
                    if (col0) {
                        let cleanDur = col0.replace(/[^0-9]/g, ''); 
                        time_display = time_display ? `${time_display} (${cleanDur ? cleanDur + ' mins' : col0})` : (cleanDur ? cleanDur + ' mins' : col0);
                    }
                    let displayTitle = (isQA && !colTitle) ? col3 : (colTitle || col3);
                    events.push({ type: 'presentation', time: time_display, tag: (isQA && !colTitle) ? "Discussion" : col3, title: displayTitle, speaker: speaker, hall: hallTitle, parent_session: current_session });
                }
            });
            return events;
        }

        function parseTimeToMinutes(timeStr) {
            if (!timeStr) return null;
            const parts = timeStr.split('-')[0].trim().split(/[.:]/);
            if (parts.length < 2) return null;
            return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
        }

        function getLiveStatus(events) {
            const playableEvents = events.filter(e => e.type === 'presentation' || e.type === 'break' || e.isOration);
            
            if (manualOverrideIndex !== null) {
                if (manualOverrideIndex < 0 && globalQuizzes.length > 0) {
                    return { currentEvent: globalQuizzes[Math.abs(manualOverrideIndex) - 1], nextEvent: playableEvents[0] || null };
                }
                return { currentEvent: playableEvents[manualOverrideIndex] || null, nextEvent: playableEvents[manualOverrideIndex + 1] || null };
            }
            
            const currentMins = new Date().getHours() * 60 + new Date().getMinutes();
            let currentEvent = null, nextEvent = null;

            for (let i = 0; i < playableEvents.length; i++) {
                const ev = playableEvents[i];
                const evStart = parseTimeToMinutes(ev.time);
                let evEnd = (ev.time && ev.time.includes('-')) ? parseTimeToMinutes(ev.time.split('-')[1].trim()) : (evStart !== null ? evStart + 15 : null);
                
                if (evStart !== null && evEnd !== null) {
                    if (currentMins >= evStart && currentMins < evEnd) {
                        currentEvent = ev; 
                        // CRITICAL SESSION LINKING LOGIC OVER SHORT BREAKS
                        if (ev.type === 'break' && i > 0 && playableEvents[i-1].type !== 'break') {
                            currentEvent = playableEvents[i-1];
                        }
                        if (i + 1 < playableEvents.length) nextEvent = playableEvents[i + 1]; 
                        break;
                    } else if (currentMins < evStart && !nextEvent) { 
                        nextEvent = ev; 
                    }
                }
            }
            return { currentEvent, nextEvent };
        }

        function toggleManualPanel() { document.getElementById('manualOverridePanel').classList.toggle('hidden'); }

        async function manualShift(step) {
            const data = appData[liveHall]; if (!data) return;
            const playableEvents = data.events.filter(e => e.type === 'presentation' || e.type === 'break' || e.isOration);
            
            if (manualOverrideIndex === null || manualOverrideIndex < 0) {
                const { currentEvent } = getLiveStatus(data.events);
                manualOverrideIndex = playableEvents.indexOf(currentEvent);
                if (manualOverrideIndex === -1) manualOverrideIndex = 0;
            }
            
            let newIndex = manualOverrideIndex + step;
            if (newIndex < 0) newIndex = 0;
            if (newIndex >= playableEvents.length) newIndex = playableEvents.length - 1;
            
            manualOverrideIndex = newIndex;
            updateLiveDisplay();
            await supabaseClient.from('hall_states').update({ override_index: manualOverrideIndex }).eq('hall_id', liveHall);
        }

        async function launchQuiz(idx) {
            manualOverrideIndex = -(idx + 1);
            updateLiveDisplay();
            await supabaseClient.from('hall_states').update({ override_index: manualOverrideIndex }).eq('hall_id', liveHall);
        }

        async function resumeAutoSync() {
            manualOverrideIndex = null;
            updateLiveDisplay();
            await supabaseClient.from('hall_states').update({ override_index: null }).eq('hall_id', liveHall);
        }

        function switchHallFeed(newHall) {
            liveHall = newHall; manualOverrideIndex = null;
            const newUrl = new URL(window.location); newUrl.searchParams.set('hall', newHall); window.history.pushState({}, '', newUrl);
            updateLiveDisplay();
        }

        function updateLiveDisplay() {
            const data = appData[liveHall]; if (!data) return;
            
            // Build dynamic quiz launcher bar controls inside dashboard
            let quizBtnContainer = document.getElementById('quizButtonsContainer');
            if (globalQuizzes.length > 0 && quizBtnContainer) {
                quizBtnContainer.innerHTML = globalQuizzes.map((q, idx) => 
                    `<button onclick="launchQuiz(${idx})" class="bg-rose-600/20 hover:bg-rose-600 border border-rose-500 text-rose-100 px-3 py-1.5 rounded-lg text-xs font-bold transition shadow">Q${idx+1}</button>`
                ).join('');
            }

            document.querySelectorAll('.feed-btn').forEach(btn => {
                btn.className = "feed-btn px-2.5 py-1 rounded text-xs font-bold " + (btn.id === 'feed-' + liveHall ? "bg-indigo-600 text-white border border-indigo-500" : "bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700");
            });

            const { currentEvent, nextEvent } = getLiveStatus(data.events);
            const nowStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            let nowPlayingHtml = `<div class="text-center py-20 bg-slate-800/40 rounded-3xl border border-slate-800 my-8"><i class="fas fa-calendar-check text-6xl mb-4 text-slate-600"></i><h2 class="text-3xl font-bold text-slate-400">No Session Currently Active</h2></div>`;
            
            if (currentEvent) {
                if (currentEvent.type === 'quiz') {
                    nowPlayingHtml = `
                        <div class="bg-gradient-to-b from-indigo-900/80 to-slate-900 rounded-3xl border-2 border-indigo-500/50 p-10 shadow-2xl mb-8">
                            <span class="bg-rose-600 text-white px-4 py-1.5 rounded-full text-sm font-black uppercase tracking-widest animate-pulse mb-6 inline-block shadow-lg"><i class="fas fa-bolt mr-2"></i> Live Audience Quiz</span>
                            <h1 class="text-4xl sm:text-5xl lg:text-6xl font-black text-white leading-tight mb-10">${currentEvent.title}</h1>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8">
                                ${currentEvent.options.map((opt, i) => `<div class="bg-slate-800/80 border border-slate-600 p-6 rounded-2xl text-2xl text-slate-200 font-semibold shadow-inner flex items-center"><span class="bg-slate-900 px-4 py-2 rounded shadow-inner text-indigo-400 mr-4 font-black">${String.fromCharCode(64+i+1)}</span> ${opt}</div>`).join('')}
                            </div>
                            <div class="flex justify-between items-center mt-8 pt-8 border-t border-slate-700/50">
                                <p class="text-2xl text-slate-300 font-bold"><i class="fas fa-mobile-alt mr-3 text-indigo-400"></i>Open the Live Dashboard on your mobile phone to participate!</p>
                                <button onclick="showLeaderboard()" class="bg-amber-500 hover:bg-amber-400 text-slate-900 font-black px-6 py-4 rounded-xl shadow-lg text-lg">Show Standings</button>
                            </div>
                        </div>`;
                } else if (currentEvent.type === 'break') {
                    if (currentEvent.adLink) {
                        let link = currentEvent.adLink, media = '';
                        if (link.includes('youtube.com') || link.includes('youtu.be')) {
                            let ytMatch = link.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
                            if (ytMatch) media = `<iframe class="w-full aspect-video rounded-2xl shadow-2xl border border-slate-700 point-events-none" src="https://www.youtube.com/embed/${ytMatch[1]}?autoplay=1&mute=1&loop=1&playlist=${ytMatch[1]}&controls=0&showinfo=0&modestbranding=1" frameborder="0" allow="autoplay; encrypted-media"></iframe>`;
                        } else if (link.includes('drive.google.com')) {
                            let fId = link.match(/[-\w]{25,}/);
                            if (fId) media = `<img src="https://drive.google.com/uc?id=${fId[0]}" class="w-full h-auto max-h-[50vh] object-contain rounded-2xl bg-black border border-slate-700">`;
                        } else { media = `<img src="${link}" class="w-full h-auto max-h-[50vh] object-contain rounded-2xl bg-black border border-slate-700">`; }

                        nowPlayingHtml = `<div class="mb-8 p-6 bg-gradient-to-b from-slate-800 to-slate-900 rounded-3xl border border-slate-700 shadow-2xl"><div class="flex items-center justify-between mb-4"><span class="bg-amber-500 text-slate-900 px-4 py-1.5 rounded-full text-sm font-black uppercase tracking-widest"><i class="fas fa-mug-hot mr-2"></i> ${currentEvent.title}</span><span class="text-xl font-bold text-slate-400">${currentEvent.time}</span></div>${media}</div>`;
                    } else {
                        let breakIcon = "fa-coffee", iconColor = "text-amber-500";
                        if (currentEvent.title.toLowerCase().includes('lunch')) { breakIcon = "fa-utensils"; iconColor = "text-emerald-500"; }
                        else if (currentEvent.title.toLowerCase().includes('banquet')) { breakIcon = "fa-glass-cheers"; iconColor = "text-purple-500"; }
                        else if (currentEvent.title.toLowerCase().includes('registration')) { breakIcon = "fa-id-badge"; iconColor = "text-blue-400"; }

                        nowPlayingHtml = `<div class="text-center py-24 bg-slate-800/50 rounded-3xl border border-slate-700 my-8 shadow-inner"><i class="fas ${breakIcon} text-7xl mb-6 ${iconColor} animate-pulse"></i><h2 class="text-4xl font-black text-white uppercase tracking-widest">${currentEvent.title}</h2><p class="text-2xl text-slate-400 mt-3 font-semibold">${currentEvent.time}</p></div>`;
                    }
                } else {
                    let bStyle = currentEvent.isOration ? "bg-rose-600" : "bg-indigo-600";
                    nowPlayingHtml = `
                        <div class="bg-gradient-to-br from-slate-800 to-slate-800/80 border-2 border-slate-700/80 rounded-3xl p-6 sm:p-10 shadow-2xl mb-8">
                            <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
                                <span class="animate-live ${bStyle} px-4 py-1.5 rounded-full text-sm font-black uppercase tracking-widest flex items-center shadow-lg"><span class="w-2.5 h-2.5 bg-white rounded-full mr-2.5"></span> LIVE NOW</span>
                                <span class="text-xl sm:text-2xl font-bold text-slate-300 bg-slate-900/60 px-4 py-1.5 rounded-xl border border-slate-700/50"><i class="far fa-clock mr-2 text-indigo-400"></i>${currentEvent.time}</span>
                            </div>
                            ${currentEvent.parent_session && currentEvent.parent_session !== currentEvent.title ? `<div class="text-indigo-400 font-bold uppercase tracking-wider text-base sm:text-xl mb-2 flex items-center"><i class="fas fa-layer-group mr-2 text-sm"></i>${currentEvent.parent_session}</div>` : ''}
                            <h1 class="text-3xl sm:text-5xl lg:text-6xl font-black text-white leading-tight mb-8">${currentEvent.title}</h1>
                            ${currentEvent.speaker ? `<div class="flex items-center bg-slate-900/90 p-5 sm:p-6 rounded-2xl border border-slate-700/80 shadow-inner inline-flex max-w-full"><div class="w-12 h-12 sm:w-16 sm:h-16 rounded-2xl bg-indigo-500/20 text-indigo-400 flex items-center justify-center text-2xl sm:text-3xl mr-4 sm:mr-6 flex-shrink-0 border border-indigo-500/30"><i class="fas fa-microphone"></i></div><div><span class="block text-xs uppercase tracking-widest text-slate-400 font-bold mb-0.5">Speaker</span><span class="text-xl sm:text-3xl font-extrabold text-white leading-snug">${currentEvent.speaker}</span></div></div>` : ''}
                        </div>`;
                }
            }

            let upNextHtml = '';
            if (nextEvent && nextEvent.type !== 'quiz') {
                upNextHtml = `
                    <div class="bg-slate-800/40 border border-slate-700/60 rounded-2xl p-6 sm:p-8 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div class="flex-1"><span class="text-xs font-black uppercase tracking-widest text-amber-400 block mb-1.5 flex items-center"><i class="fas fa-step-forward mr-2"></i>Coming Up Next &bull; ${nextEvent.time}</span><h4 class="text-xl sm:text-2xl font-bold text-slate-200 leading-snug">${nextEvent.title}</h4>${nextEvent.speaker ? `<p class="text-slate-400 font-semibold text-base mt-2 flex items-center"><i class="fas fa-user-md mr-2 text-indigo-400"></i>${nextEvent.speaker}</p>` : ''}</div>
                        <div class="sm:text-right flex-shrink-0"><span class="inline-block bg-slate-800 text-slate-300 font-bold text-xs px-3 py-1.5 rounded-lg border border-slate-700 uppercase tracking-wider">${nextEvent.type === 'break' ? 'Break' : 'Session'}</span></div>
                    </div>`;
            }

            container.innerHTML = `
                <div class="max-w-6xl mx-auto pt-2 sm:pt-4">
                    <div class="flex flex-col sm:flex-row justify-between items-center pb-6 mb-4 border-b border-slate-800 gap-4">
                        <div class="flex-1 w-full sm:w-auto text-left">
                            <h2 class="text-2xl sm:text-3xl lg:text-4xl font-black text-white tracking-tight leading-tight">${data.title}</h2>
                        </div>
                        <div class="flex-shrink-0 order-first sm:order-none mb-4 sm:mb-0 mx-4">
                            <div class="bg-white/95 p-3 rounded-2xl shadow-xl ring-1 ring-white/10 inline-block">
                                <img src="IFASCON chd logo.jpg" alt="IFASCON Logo" class="h-24 sm:h-32 w-auto object-contain" onerror="this.src='https://via.placeholder.com/250x80?text=IFASCON'">
                            </div>
                        </div>
                        <div class="flex-1 w-full sm:w-auto flex justify-end">
                            <div onclick="toggleManualPanel()" class="cursor-pointer bg-slate-800/80 hover:bg-slate-800 border border-slate-700 px-5 py-3 rounded-2xl transition flex items-center gap-3 shadow-lg group ml-auto">
                                <i class="fas fa-sliders-h text-slate-500 group-hover:text-indigo-400 text-xl"></i>
                                <div class="text-3xl sm:text-4xl font-black text-white font-mono tracking-wider">${nowStr}</div>
                            </div>
                        </div>
                    </div>
                    ${nowPlayingHtml}
                    ${upNextHtml}
                </div>`;
        }

        window.showLeaderboard = async function() {
            document.getElementById('leaderboardModal').classList.remove('hidden');
            document.getElementById('leaderboardList').innerHTML = '<div class="loader"></div>';
            try {
                const { data, error } = await supabaseClient.from('quiz_responses').select('phone').eq('is_correct', true);
                if (error) throw error;
                let counts = {};
                data.forEach(d => { counts[d.phone] = (counts[d.phone] || 0) + 1; });
                let sorted = Object.entries(counts).sort((a,b) => b[1] - a[1]).slice(0, 5);
                
                if (sorted.length === 0) {
                    document.getElementById('leaderboardList').innerHTML = '<div class="text-center text-slate-400 text-2xl font-bold py-10">No scores submitted yet.</div>';
                    return;
                }
                document.getElementById('leaderboardList').innerHTML = sorted.map((item, index) => {
                    let ob = item[0].substring(0, 2) + '******' + item[0].slice(-2);
                    return `<div class="flex justify-between items-center bg-slate-800 p-6 rounded-2xl border border-slate-600 shadow-xl"><div class="text-3xl font-bold text-white"><i class="fas fa-medal mr-4 text-amber-400"></i>${ob}</div><div class="text-3xl font-black text-indigo-400">${item[1]} pts</div></div>`;
                }).join('');
            } catch(e) { document.getElementById('leaderboardList').innerHTML = '<div class="text-red-400">Failed to load scores.</div>'; }
        };

        window.hideLeaderboard = function() { document.getElementById('leaderboardModal').classList.add('hidden'); };

        function initLiveKiosk() {
            updateLiveDisplay();
            if (liveUpdateTimer) clearInterval(liveUpdateTimer);
            liveUpdateTimer = setInterval(updateLiveDisplay, 30000);
        }

        initializeApp();
    </script>
</body>
</html>
